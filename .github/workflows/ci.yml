# CI for AI Grounded. Mirrors the local pre-commit gate chain so pull requests
# are checked automatically. Actions are version-pinned (no floating @latest/@main),
# per constitution Article II; renovate.json digest-pins them over time.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --quiet pyyaml==6.0.2 jsonschema==4.23.0 check-jsonschema==0.29.4
      - name: Configure git (sync/eject tests build real repos)
        run: |
          git config --global user.email "ci@ai-grounded.invalid"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - name: Run tooling and hook test suites
        run: |
          fail=0
          for t in $(git ls-files 'tooling/**/test_*.py' 'governance-commons/tooling/**/test_*.py' '.claude/hooks/test_*.py'); do
            echo "::group::$t"
            python3 "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  validators:
    name: Gate validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml==6.0.2
      - name: Gate inventory matches docs/GATES.md (strict)
        run: python3 tooling/gates/describe.py --check --strict --repo-root .
      - name: Manifest and schema references (advisory)
        run: |
          python3 tooling/manifest/check.py || true
          python3 tooling/schema/check.py project-manifest.yaml || true

  lint:
    name: Lint (ruff + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install --quiet ruff==0.7.4
          ruff check $(git ls-files '*.py')
      - name: ShellCheck (framework-authored shell)
        run: shellcheck $(git ls-files '.githooks/pre-commit' '.githooks/pre-commit.d/*' 'scripts/*.sh' '.claude/hooks/*.sh' | grep -v '\.md$')

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install and run gitleaks
        run: |
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --source . --config .gitleaks.toml --redact --no-banner

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Every PR commit carries a Signed-off-by line
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          rc=0
          for c in $(git rev-list "$base".."$head"); do
            if ! git log -1 --format='%B' "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $c is missing a Signed-off-by (DCO) line — use git commit -s"
              rc=1
            fi
          done
          exit $rc
