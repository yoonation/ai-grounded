# ===========================================================
# Cost computation reference
# ===========================================================

cost_computation:
  formula: |
    estimated_usd = (input_tokens / 1_000_000) * input_per_million_tokens
                  + (output_tokens / 1_000_000) * output_per_million_tokens

  example: |
    Claude Opus 4.8 with 12,500 input tokens and 3,200 output tokens:
    estimated_usd = (12500 / 1_000_000) * 5.00
                  + (3200 / 1_000_000) * 25.00
                  = 0.0625 + 0.08
                  = 0.1425 USD

  cached_input_note: |
    When the same content is sent repeatedly (e.g., system prompts,
    long context), providers offer cached input pricing. If your
    framework integration supports cache awareness, use the
    cached_input_per_million_tokens rate for tokens served from cache.

# ===========================================================
# Defaults for unknown models
# ===========================================================

defaults:
  unknown_model:
    input_per_million_tokens: 5.00
    output_per_million_tokens: 25.00
    notes: |
      When an agent reports usage of a model not in this file, fall
      back to these conservative defaults. Update this file to add
      the missing model so future reports are accurate.

# ===========================================================
# Model selection guidance
# ===========================================================

selection_guidance:
  framework_routing: |
    The authoritative per-agent routing for this framework is the model:
    field in each .claude/agents/*.md frontmatter (single source; this
    file provides prices and tier guidance, never assignments). Current
    tiers: opus for judgment-dense and security-sensitive agents
    (staff-engineer, threat-modeler, security-reviewer, closure-auditor,
    operational-architect, production-readiness, test-architect), sonnet
    for scaffolded reviewers and drafting (code-reviewer,
    performance-reviewer, concern-selector, adr-architect), haiku for
    mechanical survey work (discovery-agent). Fable 5 has no standing
    assignment: its value case (long-horizon autonomous multi-step work)
    matches interactive implementation sessions, not bounded read-only
    review agents, and its classifier reroutes flagged security queries
    to Opus 4.8 anyway. Operators may hand-route a rare
    Opus-insufficient invocation to it deliberately.

  security_caveat: |
    Claude Sonnet 5 has deliberately low cybersecurity capability and
    real-time cyber safeguards. Keep security review, threat modeling,
    and any red-team or exploit-analysis work on an Opus-tier model
    (Opus 4.8) even though Sonnet is cheaper. Fable 5 carries its own
    cyber safety measures and is not preferred over Opus 4.8 for these
    tasks either.

  reasoning_intensive_tasks:
    recommendation: opus-tier or gpt-5
    use_cases:
      - Complex multi-step reasoning
      - Architecture review
      - Threat modeling
      - Code review with novel codebases
      - Security analysis

  balanced_tasks:
    recommendation: sonnet-tier or gpt-5-mini or gemini-2.5-pro
    use_cases:
      - Most code generation
      - Standard reviews
      - Documentation writing
      - Spec drafting

  high_volume_simple_tasks:
    recommendation: haiku-tier or gpt-5-nano or gemini-2.5-flash
    use_cases:
      - Linting tasks
      - Format conversions
      - Simple classifications
      - Repetitive structured generation

