# AI model pricing data for cost reporting.
#
# This file is provider-agnostic. The framework supports cost
# reporting for any provider; agents read this file at invocation
# time to compute estimated cost from token counts.
#
# Pricing accuracy:
# - Approximate, based on published list rates as of last_reviewed
# - Does not include enterprise volume discounts, batching discounts,
#   or cached input discounts
# - Use for relative cost awareness, not for billing reconciliation
#
# Maintenance cadence: quarterly (per MAINTENANCE.md)
# Update procedure: check provider pricing pages, update entries,
#   bump last_reviewed date, commit.

last_reviewed: "2026-07-04"
review_cadence: quarterly
unit: USD per million tokens

# ===========================================================
# Anthropic
# ===========================================================

providers:
  anthropic:
    docs_url: https://docs.claude.com/en/docs/about-claude/pricing
    models:
      claude-opus-4-8:
        input_per_million_tokens: 5.00
        output_per_million_tokens: 25.00
        cached_input_per_million_tokens: 0.50
        context_window: 1000000
        notes: "Most capable Opus; verified 2026-07-04. Reserve for complex reasoning, security analysis, threat modeling, and correctness-critical implementation. 1M context standard. Fast mode is 2x (10.00/50.00); not for batch or background work. New tokenizer (Opus 4.7+): roughly 30 percent more tokens for the same text. On the first-party Anthropic API the 'opus' alias resolves here (needs Claude Code v2.1.154+)."

      claude-sonnet-5:
        input_per_million_tokens: 3.00
        output_per_million_tokens: 15.00
        cached_input_per_million_tokens: 0.30
        context_window: 1000000
        notes: "Balanced default; near-Opus on coding at lower cost. Introductory pricing 2.00 in / 10.00 out through 2026-08-31, then 3.00 / 15.00. New tokenizer emits roughly 30 percent more tokens than Sonnet 4.6 for the same text, so recount before budgeting. Deliberately low cyber capability with cybersecurity safeguards (refusals arrive as HTTP 200, stop_reason refusal): do NOT route security review, threat modeling, or red-team work here, keep those on Opus. On the first-party Anthropic API the 'sonnet' alias resolves here (needs Claude Code v2.1.197+)."

      claude-fable-5:
        input_per_million_tokens: 10.00
        output_per_million_tokens: 50.00
        cached_input_per_million_tokens: 1.00
        context_window: 1000000
        notes: "Verified 2026-07-04 at the pricing docs: 10.00/50.00, exactly 2x Opus 4.8; 1M context at standard rates, 128K max output; batch 5.00/25.00. Top tier above Opus 4.8, for rare Opus-insufficient long-horizon work only; no standing agent assignment in this framework. Safety classifiers auto-reroute flagged cyber/bio/chem/distillation queries to Opus 4.8 (billed at Opus rates, under 5% of sessions; the 2026-07-01 retrained classifier flags benign coding requests more often), so security agents gain nothing routing here over Opus 4.8 directly. Compliance: Mythos-class traffic carries 30-day retention and is not available under zero-data-retention agreements. Mythos 5 shares this pricing but is trusted-access only (Project Glasswing); not routable from this framework."

      claude-opus-4-7:
        input_per_million_tokens: 5.00
        output_per_million_tokens: 25.00
        cached_input_per_million_tokens: 0.50
        context_window: 1000000
        notes: "Prior Opus generation; corrected 2026-07-04, the 15.00/75.00 previously listed belongs to the Opus 4.0/4.1 era. Same sticker as 4.8; fast mode 6x (30.00/150.00), scheduled for removal 2026-07-24."

      claude-opus-4-6:
        input_per_million_tokens: 5.00
        output_per_million_tokens: 25.00
        cached_input_per_million_tokens: 0.50
        context_window: 1000000
        notes: "Prior Opus generation; corrected 2026-07-04 (see 4-7 note). Fast mode discontinued 2026-06-29."

      claude-sonnet-4-6:
        input_per_million_tokens: 3.00
        output_per_million_tokens: 15.00
        cached_input_per_million_tokens: 0.30
        context_window: 1000000
        notes: "Prior Sonnet generation; previous tokenizer, so token counts are not comparable to Sonnet 5."

      claude-haiku-4-5:
        input_per_million_tokens: 1.00
        output_per_million_tokens: 5.00
        cached_input_per_million_tokens: 0.10
        context_window: 200000
        notes: "Fast and cheap; corrected 2026-07-04 (the 0.80/4.00 previously listed was stale). Good for high-volume mechanical tasks; lowest-cost current-generation model. 200K context, previous tokenizer. Does not support effort levels."

