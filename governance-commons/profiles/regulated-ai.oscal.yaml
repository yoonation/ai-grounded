#
# Regulated-AI industry-tilt profile. Inherits the production-grade-
# baseline profile (profile-of-a-profile) and elevates the severities of
# the concerns that the EU AI Act, NIST AI RMF, and ISO/IEC 42001 make
# critical: responsible-AI controls and documentation, agent permission
# boundaries, privacy and data governance for training and inference data,
# data classification, and post-market monitoring and incident detection.
# Second M7 industry profile, authored at draft; highest-differentiation
# tilt for an AI Security Architect portfolio.

