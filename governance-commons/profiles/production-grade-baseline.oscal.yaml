        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected as the preventive companion to secrets-management.no-secrets-in-source.
                  A correct .gitignore is the principal control that
                  keeps developers' real .env, key, and credential files
                  from ever entering version control. The rule has
                  near-universal applicability.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
