      # ===================================================================
      # ERROR-HANDLING CONCERN (10 rules)
      # ===================================================================

      - control-id: error-handling.no-bare-except
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because bare except / catch-all handlers
                  are the most common code-smell that masks defects
                  and creates undefined recovery behavior. The
                  mechanical detection of unqualified except / catch
                  (Exception) without re-raise is high-precision.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: error-handling.no-exception-swallow
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because exception swallow (pass, empty
                  catch, discarded err) creates silent failures
                  invisible to operations. Detection of catch blocks
                  with no logger, metric, or re-raise is reliable.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
