                ns: governance-commons
                value: |
                  Selected because a declared backup resource with zero,
                  unset, or disabled retention is the silent failure that
                  looks like protection and provides none; the non-zero
                  retention floor is the mechanical precondition for every
                  higher-layer recovery rule.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
