  # Imports reference concern catalogs as they reach authored status. The
  # substrate's Tier 1 concerns (authentication, code-organization,
  # error-handling, logging, performance-database, testing-strategy,
  # plus authorization, input-validation, observability, reliability,
  # cost-model-selection, data-classification, privacy, responsible-ai)
  # are imported here as they become available.
  #
  # Substrate compliance catalogs (NIST 800-53, NIST CSF v2, NIST AI
  # RMF, EU AI Act, ai-security-baseline, federal-bridge) may also be
  # imported here, though the substrate's design separates compliance
  # selection from production-grade engineering selection. Industry
  # profiles handle compliance-specific tailoring.
  #
  # At substrate version 0.4.0 this profile imports the authentication
  # catalog (16 rules), the authorization catalog (12 rules), the
  # input-validation catalog (12 rules), the error-handling catalog
  # (10 rules), the testing-strategy catalog (8 rules), the
  # secrets-management catalog (8 rules), the
  # dependency-management catalog (5 rules), the logging catalog
  # (10 rules), the observability catalog (8 rules), the
  # cost-model-selection catalog (5 rules), and the supply-chain
  # catalog (12 rules), for a total of 106 selected rules across the
  # universal-floor concerns plus the M2-added authorization,
  # input-validation, error-handling, testing-strategy, and
  # supply-chain concerns. The authorization concern is the M2
  # Session 1 addition; input-validation is the M2 Session 2
  # addition; error-handling is the M2 Session 3 addition;
  # testing-strategy is the M2 Session 4 addition; supply-chain is
  # the M2 Session 5 addition. All five at draft lifecycle pending
  # stable promotion at M2 close.

