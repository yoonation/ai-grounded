                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: dependency-management.update-cadence
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because cadence discipline bounds the
                  exposure window between a CVE's publication and the
                  consumer's adoption of the patch. Without documented
                  cadence, security patches drift unboundedly.
              - name: profile-severity-override
                ns: governance-commons
                value: medium
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (medium) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: dependency-management.vetting-policy
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because the vetting policy is the decision
                  that determines what evidence accompanies every
                  subsequent L2 review. The paired MADR at
                  decision-frameworks/dependency-vetting-policy.madr.md
                  guides the consumer's ADR. Without an explicit
                  policy, dependency admission is implicit and
                  inconsistent.
              - name: profile-severity-override
                ns: governance-commons
                value: medium
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (medium) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: logging.structured-format
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because structured logging is the
                  foundation that makes every subsequent logging
                  rule effective. L1-002 redaction depends on
                  field-name detection; L1-003 correlation
                  propagation depends on structured fields;
                  L1-004 severity normalization depends on a
                  structured severity field; L1-005 injection
                  defense depends on field-vs-message
                  separation. Without L1-001, the rest of the
                  logging stance has no leverage.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: logging.no-sensitive-data-in-logs
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because credential and PII disclosure
                  via logs is the production-grade-baseline's
                  hard line. The substrate's L1 detection covers
                  the recognized vocabulary; L2-003 covers
                  application-specific gaps. Together they
                  implement OWASP ASVS V11 and the substrate's
                  data-classification stance.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (critical) preserved. Sensitive
                  data in logs is the substrate's strictest L1
                  severity for the logging concern.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: logging.correlation-ids
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because cross-service incident response
                  is impossible without correlation. The substrate-
                  recommended W3C Trace Context propagation is
                  industry-standard and OpenTelemetry-aligned;
                  consumers should adopt it without controversy.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: logging.severity-levels
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because severity discipline is the
                  precondition for filtering, alerting, and dashboard
                  thresholds. Without it, severity-based incident
                  response is unreliable.
              - name: profile-severity-override
                ns: governance-commons
                value: medium
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (medium) preserved. Lower than
                  L1-001, L1-002, L1-003 because severity drift is
                  recoverable through retroactive aggregator
                  reclassification, while the others are not.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: logging.log-injection
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because log injection (CWE-117, CWE-93)
                  is a recognized attack class with mechanical
                  detection. Forged log entries undermine the
                  audit trail integrity logging.integrity attempts to
                  establish; the L1 prevention is the foundation.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: logging.retention-policy
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because retention is a compliance lever
                  (PCI DSS Requirement 10.5.1 minimum 12 months
                  for audit logs) and a cost lever simultaneously.
                  Production-grade applications have explicit
                  retention bands; default-or-nothing retention is
                  not production-grade.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: logging.integrity
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because security log integrity is the
                  precondition for trust in audit trails. The
                  substrate accepts multiple mechanisms (object-
                  lock, hash chain, SIEM separation, signed
                  records); the production-grade-baseline
                  requires one be chosen and configured.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: logging.redaction
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because the substrate's L1 vocabulary
                  catches generic sensitive fields but cannot
                  catch application-specific sensitive fields.
                  The semantic-layer policy closes the gap.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved. Application-
                  specific sensitive field disclosure is the same
                  risk class as L1-002 disclosure of substrate
                  vocabulary.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: logging.aggregation
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because aggregation readiness is the
                  precondition for incident response capability.
                  Production-grade applications have cross-service
                  search readiness; absence is operationally fatal
                  during incidents.
              - name: profile-severity-override
                ns: governance-commons
                value: medium
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (medium) preserved. Lower than
                  L2-001, L2-002, L2-003 because aggregation gaps
                  are operationally painful but not as immediately
                  exploitable as integrity or retention gaps.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: logging.architecture
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because the architecture decision is
                  the platform-level commitment that determines
                  every subsequent L2 rule's specifics. The
                  paired MADR at decision-frameworks/logging-
                  architecture.madr.md guides the consumer's ADR.
                  Without an explicit architecture, retention,
                  integrity, redaction, and aggregation are each
                  decided in isolation.
              - name: profile-severity-override
                ns: governance-commons
                value: medium
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (medium) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: supply-chain.digest-pinned-artifacts
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because digest pinning is the structural
                  anchor beneath the supply-chain L1 enforcement
                  chain. Mutable artifact references defeat the trust
                  chain supply-chain.slsa-provenance-verification and supply-chain.signature-verification attempt to
                  establish; the L1 digest-pinning rule is the
                  foundation those later rules rely on.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: supply-chain.slsa-provenance-verification
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because SLSA provenance verification at
                  deployment is the substrate's primary defense
                  against compromised-build-system attacks
                  (SolarWinds-pattern). The substrate elects Build L2
                  as the production-grade-baseline minimum because
                  Build L2 requires the build platform to generate
                  the attestation, defeating the producer-side
                  forgery attack.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (critical) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved. First substrate rule
                  consuming static-analysis-binding schema variant 6
                  attestation-orchestration.

      - control-id: supply-chain.signature-verification
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because signature verification anchors
                  the consumer's trust in signer identity. Provenance
                  without signature is forgeable; the two L1 rules
                  compose. The substrate elects OIDC-bound keyless
                  signing (Sigstore Fulcio) as the substrate-preferred
                  signing scheme to eliminate long-lived key
                  management.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (critical) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: supply-chain.sbom-presence-and-validity
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because SBOM presence is the precondition
                  for advisory-response triage. Without an SBOM, the
                  consumer cannot answer "are we affected by this
                  CVE?" without rebuilding each release. SBOM
                  format validity (CycloneDX 1.6 or SPDX 2.3) is
                  mechanically checkable; SBOM accuracy is L2
                  territory.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: supply-chain.no-remote-execution-in-build
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because remote-execution patterns
                  (curl-pipe-shell and equivalents) are the substrate-
                  recognized highest-impact build-environment
                  compromise vector. Detection is unambiguous and
                  the pattern has zero substrate-accepted production
                  use cases; supply-chain.no-remote-execution-in-build catches the common case,
                  supply-chain.build-environment-isolation catches the structural posture.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (critical) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: supply-chain.dependency-vetting
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because untyped adoption of upstream
                  dependencies is the substrate-recognized highest-
                  frequency supply-chain risk surface. The L2 rule
                  requires a documented vetting artifact per new
                  production dependency, anchoring the consumer's
                  incident-response audit trail.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: supply-chain.vulnerability-disclosure-response
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because vulnerability disclosure response
                  is a discipline, not a document. The substrate
                  requires both: documented runbook plus quarterly
                  exercise cadence. The EU CRA 24-hour ENISA
                  notification obligation (activates 2026-09-11)
                  raises the rule's urgency for in-scope consumers.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: supply-chain.critical-dependency-audit
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because not all dependencies are equal.
                  The tiered inventory plus audit cadence
                  operationalizes the substrate's "dependencies are
                  not free" stance with proportional response.
                  Substrate-recommended cadence: tier-1 quarterly,
                  tier-2 semi-annual, tier-3 annual.
              - name: profile-severity-override
                ns: governance-commons
                value: medium
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (medium) preserved. Lower than
                  L2-001/L2-002 because the failure mode is gradual
                  (audit-cadence drift over months) and surfaces in
                  incident-response capability rather than immediate
                  vulnerability.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: supply-chain.signed-commit-and-protected-branch
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because source authority is the substrate's
                  anchor for "did this change actually come from the
                  named author?" Signed commits answer at the commit
                  level; protected-branch policy answers at the merge
                  level. Both are substrate-required; either alone
                  permits a substrate-recognized bypass.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: supply-chain.build-environment-isolation
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because a leaky or unreproducible build
                  environment is the substrate-recognized substrate
                  beneath every other supply-chain rule: artifact
                  trust depends on build-environment trust. SLSA
                  Build Level alignment per profile policy
                  operationalizes the discipline; reproducibility
                  verification catches drift.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: supply-chain.attestation-and-sbom-retention
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because attestations and SBOMs are most
                  valuable during incident response. Retention
                  discipline ensures the evidence exists when needed;
                  audit-trail discipline ensures the evidence has not
                  been tampered with. Substrate-recommended retention
                  windows: production-grade-baseline three years
                  (matches typical regulatory minima); stricter
                  profiles seven years.
              - name: profile-severity-override
                ns: governance-commons
                value: medium
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (medium) preserved. The failure
                  mode surfaces only at incident-response time;
                  retention is the precondition for response
                  capability rather than a direct vulnerability.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: supply-chain.supply-chain-integrity-strategy
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because supply-chain integrity is a
                  portfolio of decisions, not a single setting. The
                  ADR ties the L1/L2 surface to the consumer's
                  specific decisions (SLSA Build Level target,
                  attestation scope, SBOM cadence, signing policy,
                  transparency log, retention horizon, exemption
                  discipline, review cadence) and makes them
                  reviewable.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: infrastructure-misconfiguration.data-resource-encryption-at-rest
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because encryption-at-rest on data-bearing
                  resources is the foundational confidentiality control
                  for the infrastructure layer. The substrate's bias is
                  declaration-in-source even where provider-defaults
                  encrypt at apply time; reviewability requires the
                  intent to be visible in IaC.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: infrastructure-misconfiguration.no-unrestricted-ingress
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because unrestricted ingress on sensitive
                  ports is the single most common cloud-account
                  compromise vector. The substrate-curated sensitive-
                  port list with tagged-public exception is the
                  production-grade-baseline floor.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (critical) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: infrastructure-misconfiguration.no-public-access-without-tag
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because public-access defaults must be
                  inverted: presence of the substrate-original
                  governance-commons.intent tag declares public
                  exposure deliberate; absence treats it as a finding.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (critical) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: infrastructure-misconfiguration.audit-and-flow-logging-enabled
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because audit and flow logging at the
                  infrastructure layer is the evidence base for every
                  downstream incident-response capability. Cross-
                  references the logging concern's logging.retention-policy
                  retention rule.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: infrastructure-misconfiguration.iac-sources-version-pinned
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because IaC source-pinning is the IaC-
                  native expression of the pinning principle that
                  dependency-management.pinned-versions expresses for application packages.
                  Cross-references dependency-management.pinned-versions without duplication;
