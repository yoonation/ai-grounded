      - control-id: reliability.bounded-buffers
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Unbounded in-memory accumulation is the most common
                  single reason a service passes load testing and then
                  dies under sustained production traffic. Selected so
                  every production service carries a mechanical gate
                  against unbounded queues, caches, and accumulators
                  before any semantic resilience review applies.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: reliability.tracked-async-tasks
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Fire-and-forget async tasks drop their errors silently
                  and detach work from any supervision or shutdown path.
                  Selected because an untracked task is invisible to every
                  later reliability control and turns a recoverable failure
                  into a silent one.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

