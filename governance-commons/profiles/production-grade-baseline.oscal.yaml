      # ===================================================================
      # SECRETS-MANAGEMENT CONCERN (8 rules)
      # ===================================================================

      - control-id: secrets-management.no-secrets-in-source
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because secret material committed to source
                  is universally incompatible with the production-grade-
                  baseline stance. Detection is mechanical (Semgrep,
                  gitleaks, GitHub Advanced Security) and remediation
                  is well-defined (rotate, then purge). No carve-out
                  applies at substrate default.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (critical) preserved. No tailoring
                  required per CHARTER.md Article V Section 5.6.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
