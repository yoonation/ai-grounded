        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Retry and redelivery are the substrate's default failure
                  response under error-handling.retry-and-circuit-breaker; without idempotency those
                  retries duplicate side effects. Selected because the retry
                  posture the substrate already mandates is unsafe unless
                  redelivered operations converge to a single effect.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

