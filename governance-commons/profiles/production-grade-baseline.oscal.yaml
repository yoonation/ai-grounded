        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  A single synchronous blocking call on an event-loop path
                  stalls every concurrent request the loop is serving,
                  converting one slow dependency into a service-wide stall.
                  Selected so the service keeps the concurrency model it
                  claims to have.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

