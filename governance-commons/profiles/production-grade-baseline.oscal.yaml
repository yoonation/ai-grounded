                  alerting on any change. RFC 7807 / 9457 Problem
                  Details is the substrate-recommended default;
                  consumer alternatives must be documented and
                  consistent.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
