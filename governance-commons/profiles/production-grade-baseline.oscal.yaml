      - control-id: error-handling.no-stack-trace-in-response
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because stack-trace leakage to clients is
                  the canonical CWE-209 information-disclosure
                  pattern. Direct serialization of exception objects
                  or traceback strings to HTTP responses is
                  mechanically detectable and unambiguous.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (critical) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: error-handling.error-status-code
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because hardcoded 200 in error paths
                  defeats HTTP-level monitoring, gateway routing,
                  and client retry. Detection of jsonify/res.json/
                  send returns without explicit status inside catch
                  blocks is reliable.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: error-handling.resource-finalization
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because resource leaks under load
                  produce cascading failures (connection-pool
                  exhaustion, file-descriptor exhaustion). Detection
                  of bare try/finally pairs that should use
                  language-native finalization (with, try-with-
                  resources, defer) is partial but high-precision
                  for the patterns it catches.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
