        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because the restore is the only part of a backup
                  regime that matters and the part most often left
                  unverified; a scheduled restore into an isolated target
                  with integrity checks converts an assumed backup into
                  proven recovery capability.
              - name: profile-severity-override
                ns: governance-commons
