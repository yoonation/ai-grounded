                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: performance-database.pool-sizing
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Pool sizing is a two-sided constraint: too small serializes
                  concurrency, too large breaches the database ceiling.
                  Selected because both failures are workload-wide and the
