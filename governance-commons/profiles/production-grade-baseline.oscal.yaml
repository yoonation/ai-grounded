  # =====================================================================
  # MODIFY
  # =====================================================================
  #
  # The default profile generally selects rules at their substrate-
  # default severities, applicabilities, and parameters. Consumers and
  # industry profiles inheriting from this profile apply modifications.
  #
  # The modify.alters block records profile-level metadata on selected
  # controls: selection rationale per CHARTER.md Article V, severity
  # confirmation or override per Article V Section 5.5/5.6, and any
  # parameter adjustments. These are non-substantive when the profile
  # accepts the catalog defaults; the block is populated for audit
  # discipline.
  #
  # When the default profile needs to set parameters that have no
  # substrate default (because the parameter is too organization-
  # specific to have one), the modify.set-parameters block is
  # populated. This is rare.

  modify:
    set-parameters: []
    alters:
      - control-id: authentication.password-hashing
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected in production-grade-baseline because password
                  storage hashing is the canonical authentication rule
                  with universal applicability. Plaintext or weakly-
                  hashed password storage is incompatible with the
                  production-grade-baseline stance under any threat
                  model. No carve-out is appropriate at substrate
                  default.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  The catalog's default severity (critical) is preserved
                  without modification. No tailoring is required for
                  the baseline production stance per CHARTER.md Article
                  V Section 5.6 (strengthening requires no rationale;
                  matching the default also requires no rationale).
                  This property is recorded for audit discipline.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted this alter block from substrate-author
                  intent (Myoung Hong). Human approved the selection
                  rationale and severity confirmation before commit
                  per CHARTER.md Article III Section 3.4.

      - control-id: authentication.no-credentials-in-urls
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because credentials in URLs leak through
                  multiple passive disclosure channels (logs, browser
                  history, Referer headers) and recovery requires
                  rotation across all affected systems. Incompatible
                  with production-grade-baseline at any severity.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (critical) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: authentication.no-credentials-in-logs
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because logs persist beyond credential
                  lifetimes and are accessed by many operators. Any
                  credential reaching logs is broadly disclosed.
                  Incompatible with production-grade-baseline.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (critical) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: authentication.token-expiration
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because tokens without expiration grant
                  indefinite access on leak. Substrate-recommended
                  for production-grade-baseline at the catalog's
                  default severity.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: authentication.timing-safe-comparison
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because timing attacks against non-constant-
                  time credential comparison are well-documented and
                  practical. Substrate-recommended for production-grade-
                  baseline at the catalog's default severity.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: authentication.generic-failure-responses
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because user enumeration enables targeted
                  attacks (credential stuffing, phishing). Substrate-
                  recommended for production-grade-baseline at the
                  catalog's default severity. Note: rule is at L1/L2
                  boundary; consumers may treat findings as L2 review
                  prompts per the catalog's layer-boundary-note.
              - name: profile-severity-override
                ns: governance-commons
                value: medium
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (medium) preserved. Severity is
                  medium because the leak is informational
                  (enumeration) rather than direct credential
                  disclosure.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: authentication.no-hardcoded-credentials
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because hardcoded credentials are credentials
                  broadly disclosed via every channel source code
                  travels through. Incompatible with production-grade-
                  baseline.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (critical) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: authentication.no-credential-files-in-repo
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because credential-bearing files in
                  repositories have the same disclosure pathways and
                  remediation requirements as hardcoded credentials.
                  Pairs operationally with authentication.no-hardcoded-credentials for full
                  mechanical coverage. Incompatible with production-
                  grade-baseline.
              - name: profile-severity-override
                ns: governance-commons
                value: critical
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (critical) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
                value: drafted-by-ai-approved-by-human
              - name: profile-ai-assistance-detail
                ns: governance-commons
                value: |
                  AI drafted; human approved.

      - control-id: authentication.rate-limiting
        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because rate limiting is the substrate's
                  primary defense against credential stuffing and
                  brute force attacks. Production-grade applications
                  cannot defensibly omit rate limiting on
                  authentication endpoints; this is the first L2
                  rule selected for the baseline profile and is the
                  prove-the-pipeline rule for L2 in the substrate.
              - name: profile-severity-override
                ns: governance-commons
                value: high
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
                  Catalog default (high) preserved.
              - name: profile-ai-assistance
                ns: governance-commons
