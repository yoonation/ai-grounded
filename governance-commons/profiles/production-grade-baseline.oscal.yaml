        adds:
          - position: ending
            props:
              - name: profile-selection-rationale
                ns: governance-commons
                value: |
                  Selected because an unguarded irreversible destruction in
                  application or migration code is the most preventable
                  data-loss event; interposing a guard at the source spends
                  no recovery effort on avoidable loss.
              - name: profile-severity-override
                ns: governance-commons
                value: medium
              - name: profile-severity-override-rationale
                ns: governance-commons
                value: |
