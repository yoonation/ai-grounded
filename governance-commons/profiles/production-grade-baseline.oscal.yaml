      - uuid: 3f8a1c9d-2b4e-5a6f-7c08-9d0e1f2a3b4c
        title: "Agentic-Systems Concern Catalog"
        rlinks:
          - href: ../dist/concerns/agentic-systems.oscal.yaml
        description: |
          The agentic-systems concern catalog imported by this profile at
          substrate version 0.7.0. All 12 rules are selected (2 L1
          mechanical, 6 L2 semantic, 4 L3 judgmental). The four L3 rules are
          paired with the MADRs at decision-frameworks/agent-autonomy-and-
          authorization-policy.madr.md, agent-human-action-gating-policy.madr.md,
          multi-agent-trust-and-delegation.madr.md, and
          agent-tool-and-skill-trust-policy.madr.md. The agentic-systems
          concern is the M5 Session 2 deliverable and is kept structurally
          distinct from the responsible-ai concern (M5 Session 1): responsible-ai
          owns the properties of a model or AI system, agentic-systems owns the
          security of the autonomous action loop, and the two cross-reference at
          the human-oversight seam (responsible-ai owns oversight of a decision
          or output, agentic-systems owns the human gate on a consequential
          action). The OWASP Agentic Skills Top 10 threat catalog (M5 Session 3)
          binds principally to agentic-systems.tool-and-skill-trust-policy. Promoted to stable (catalog version 1.0.0,
          catalog-status feature-complete) at the M5 close
          consolidation at substrate version 0.8.0.
      - uuid: 9e2d4f6a-1c3b-5e7d-8a09-b2c4d6e8f0a1
        title: "Privacy Concern Catalog"
        rlinks:
          - href: ../dist/concerns/privacy.oscal.yaml
        description: |
          The privacy concern catalog imported by this profile at substrate
          version 0.7.0. All 9 rules are selected (2 L1 mechanical, 5 L2
          semantic, 2 L3 judgmental). The two L3 rules are paired with the
          MADRs at decision-frameworks/privacy-lawful-basis-and-consent-
          policy.madr.md and privacy-data-subject-rights-and-retention.madr.md.
          The privacy concern is the M5 Session 4 deliverable and builds on the
          data-classification concern: data-classification owns the sensitivity
          scheme (data-classification.model-classification-label is the precondition label) and privacy adds the
          personal-data regulatory layer (lawful basis, consent, purpose
          limitation, minimization, data-subject rights, and retention) on top.
          It defers automated-decision rights to responsible-ai (responsible-ai.explanation-and-recourse,
          responsible-ai.human-oversight) and cross-references logging (logging.retention-policy retention,
          logging.redaction redaction) rather than restating either. privacy.processor-and-transfer-safeguards
          (processor and cross-border transfer safeguards) is review-only and
          has no test template because the obligation is contractual. Promoted to stable (catalog version 1.0.0,
          catalog-status feature-complete) at the M5 close
          consolidation at substrate version 0.8.0.
      - uuid: c4a7e1f9-3b6d-4f2a-8e5c-1d9b7a3f6e02
        title: "Monitoring and Alerting Concern Catalog"
        rlinks:
          - href: ../dist/concerns/monitoring-alerting.oscal.yaml
        description: |
          The monitoring-alerting concern catalog imported by this profile at
          substrate version 0.7.0. All 8 rules are selected (2 L1 mechanical, 5
          L2 semantic, 1 L3 judgmental). The L3 rule is paired with the MADR at
          decision-frameworks/monitoring-alerting-strategy.madr.md. The
          monitoring-alerting concern is the M5 Session 5 deliverable, the fifth
          and final authoring session of the M5 milestone, and owns the
          operations layer of alerting (detection coverage, severity-based
          routing and escalation, the alert lifecycle, meta-monitoring of the
          alerting pipeline, and on-call coverage) that observability explicitly
          defers to it. observability.alerting-discipline owns the per-alert-rule hygiene and
          observability.slo-policy owns the SLO and error-budget policy; monitoring-alerting
          consumes the severity label and the SLOs those rules define rather
          than redefining them, and it references the reliability health signals
          (reliability.health-signaling) as one input it may alert on. monitoring-alerting.on-call-rotation-coverage (on-call
          rotation coverage) is review-only and has no test template because its
          subject is a human rotation, mirroring privacy.processor-and-transfer-safeguards and agentic-systems.instruction-data-separation.
          Promoted to stable (catalog version 1.0.0,
          catalog-status feature-complete) at the M5 close
          consolidation at substrate version 0.8.0.
