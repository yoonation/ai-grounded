#
# Healthcare industry-tilt profile. Inherits the production-grade-baseline
# profile (profile-of-a-profile) and elevates the severities of the
# concerns that the HIPAA Security Rule, Privacy Rule, and HITECH make
# critical: minimum-necessary PHI handling and privacy, PHI classification
# and transmission security, person-or-entity authentication and access
# control, encryption key management for electronic PHI, guarded PHI and
# media disposal, and audit-control logging and retention. Third M7
# industry profile, authored at draft.

