#
# Financial-services industry-tilt profile. Inherits the production-grade-
# baseline profile (profile-of-a-profile) and elevates the severities of
# the concerns that PCI-DSS, SOX, GLBA, and FFIEC make critical:
# cardholder and financial data classification and handling, encryption
# key management, audit logging and retention, third-party and supply-
# chain risk, detection and monitoring, records-destruction guards, change
# control, and availability. Fourth-and-final-milestone-6 inventory is the
# parent; this is the first M7 industry profile, authored at draft.

