#
# FedRAMP industry-tilt profile. Inherits the production-grade-baseline
# profile (profile-of-a-profile) and elevates the severities of the
# concerns that FedRAMP and the NIST SP 800-53 Rev. 5 control families
# make critical: supply-chain risk, configuration management, continuous
# monitoring, cryptographic key protection, audit logging and retention,
# and dependency provenance and flaw remediation. Fourth M7 industry
# profile, authored at draft.

