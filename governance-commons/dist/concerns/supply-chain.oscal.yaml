        library is structurally more critical than a string-formatting library. The
        substrate-recommended criticality tiers reflect blast-radius dimensions: tier-1
        (compromise affects application-wide security or correctness invariants),
        tier-2 (compromise affects a specific application surface), tier-3 (compromise
        affects developer ergonomics or non-critical paths). The audit cadence operationalizes
        the substrate''s "dependencies are not free" stance. Substrate-recommended
        quarterly cadence for tier-1 is calibrated against typical advisory release
