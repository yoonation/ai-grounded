    - name: applies-to-environment
      ns: governance-commons
      value: any-with-binary-artifacts
    parts:
    - id: supply-chain.digest-pinned-artifacts_smt
      name: statement
      prose: 'Every binary artifact referenced in a production deployment manifest
        is identified by content-addressed digest, not by a mutable tag or version
        range. The rule applies at the consumption surface across all substrate-recognized
        artifact surfaces: container images (Dockerfile FROM, docker-compose image,
        Kubernetes Pod and Deployment image, Helm chart values image, container manifest
        overlays); CI workflow action references (GitHub Actions uses, GitLab CI include
        references); infrastructure-as-code provider and module references (terraform
        required_providers version vs hash, terraform module source pinning); and
        downloadable binaries referenced in build scripts. Development and test manifests
        may reference mutable tags during active iteration; the substrate restricts
        the rule to production-bound manifests identified by path, by branch, by environment
        overlay, or by explicit manifest-level annotation.'
    - id: supply-chain.digest-pinned-artifacts_rationale
      name: rationale
      prose: 'The substrate elects digest pinning as the L1 rule rather than version
        pinning because version tags are mutable in practice across most ecosystems
        even when semantic versioning is followed: tag re-push permits an attacker
        who compromises upstream signing credentials to substitute a different artifact
        under the same version label. Content-addressed digests bind the deployment
        manifest to the specific bytes the consumer tested. The trade-off the substrate
        accepts is increased friction at upgrade time, because the consumer must update
        both the version label (for human readability) and the digest (for byte-level
        binding) on each upgrade. Substrate-recommended tooling (Renovate, Dependabot)
        automates digest updates alongside version updates and treats the digest as
        the canonical identifier.'
    links:
    - rel: authoritative-source
      text: SLSA v1.1 Build Track requirements (provenance attestation generation
        and consumer verification require artifact identification by content-addressed
        digest)
      href: https://slsa.dev/spec/v1.1/requirements
