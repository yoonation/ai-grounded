    - id: supply-chain.build-environment-isolation_rationale
      name: rationale
      prose: The substrate elects SLSA Build Level alignment as the principle organizing
        the L2 isolation discipline because SLSA's level definitions encode an industry-consensus
        progression. Build L1 (the consumer's build process is scripted and generates
        provenance) is the substrate-minimum starting point. Build L2 (the build platform
        generates provenance rather than the producer claiming the platform did) is
        the substrate-default for production-grade-baseline. Build L3 (the build platform
        is hardened against insider tampering, with hermetic execution and isolated
        build environments) is the substrate-recommended target for stricter profiles.
        Reproducibility verification is the substrate's check on the rest of the discipline.
        If two builds of the same source at the same commit produce byte-identical
        artifacts, the build environment is substantively reproducible. Drift between
        builds surfaces either build-environment non-determinism (which substrate-rejects
