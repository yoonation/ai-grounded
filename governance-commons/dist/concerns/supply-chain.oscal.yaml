  - id: supply-chain.no-remote-execution-in-build
    class: substrate-rule
    title: Build scripts and CI workflows contain no remote-execution patterns (curl-pipe-shell,
      wget-pipe-bash, eval of remote payloads, unauthenticated network downloads in
      privileged build steps)
    props:
    - name: rule-id
      ns: governance-commons
      value: supply-chain.no-remote-execution-in-build
    - name: layer
