  - id: supply-chain.signed-commit-and-protected-branch
    class: substrate-rule
    title: Production source repositories enforce signed-commit and protected-branch
      discipline for release-bearing branches
    props:
    - name: rule-id
      ns: governance-commons
      value: supply-chain.signed-commit-and-protected-branch
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    parts:
    - id: supply-chain.signed-commit-and-protected-branch_smt
      name: statement
      prose: 'The consumer''s release-bearing branches (substrate-default: main, release-*
        branches, tag refs pointing to release commits) enforce: (a) signed commits
        via Sigstore-signed (gitsign), GPG-signed, or SSH-signed attribution chains;
        (b) protected-branch policy requiring pull-request review before merge with
        substrate-recommended minimum of one reviewer distinct from the author; (c)
        administrator-bypass discipline (either administrator-bypass disabled entirely,
        or each bypass logged via audit-trail and reviewed under supply-chain.attestation-and-sbom-retention).
        The substrate accepts the consumer''s hosting provider''s specific feature
        names (GitHub branch protection rules, GitLab protected branches, Bitbucket
        merge checks, Gerrit access controls).'
    - id: supply-chain.signed-commit-and-protected-branch_rationale
      name: rationale
      prose: 'Source authority verification is the substrate''s anchor for the question
        "did this change actually come from the person whose name appears on it?"
        Signed commits answer the question at the commit level; protected-branch policy
        answers it at the merge level. Both are required: signed commits alone permit
        an attacker with valid signing credentials to push directly to the release
        branch bypassing review; protected branches alone permit unsigned commits
        to flow through review where attribution is not verifiable. The substrate
        elects signed-commit verification rather than signed-tag-only verification
        because the release-bearing branch state at the moment of release is the substrate-relevant
        integrity surface. A signed tag on an unsigned-commit branch attests that
        someone authorized the release; signed commits attest that each commit in
        the release was authorized.'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V14.1 (Build pipeline source integrity)
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x22-V14-Configuration.md
    - rel: authoritative-source
      text: SLSA Source Track (draft) requirements on source authority verification
      href: https://slsa.dev/spec/v1.1/source-requirements
    - rel: authoritative-source
      text: OWASP Top 10 CI/CD Security Risks CICD-SEC-1 (Insufficient Flow Control
        Mechanisms) and CICD-SEC-6 (Insufficient Credential Hygiene)
      href: https://owasp.org/www-project-top-10-ci-cd-security-risks/
  - id: supply-chain.slsa-provenance-verification
    class: substrate-rule
    title: SLSA provenance attestation present and verifiable for every production
      artifact at deployment time
    props:
    - name: rule-id
      ns: governance-commons
      value: supply-chain.slsa-provenance-verification
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: critical
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-1357
    - name: cwe
      ns: governance-commons
      value: CWE-829
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: production
    parts:
    - id: supply-chain.slsa-provenance-verification_smt
      name: statement
      prose: 'Every artifact deployed to production carries a SLSA provenance attestation
        that is verified at deployment time. The verification step is gated in the
        CI/CD pipeline: a deployment cannot proceed without a successful attestation
        verification result. The attestation must satisfy the consumer''s profile-selected
        SLSA Build Level threshold (substrate-default Build L2 for production-grade-baseline
        profile; L3 for stricter profiles: financial-services, healthcare, government).
        The verification consults a transparency log (Sigstore Rekor by substrate
        default) and verifies the signing identity against the consumer''s allowed-signers
        policy. Artifacts lacking an attestation during the substrate-recommended
        transition window (consumer-defined deadline; substrate-recommended six months
        for new dependency adoption) are tracked via the substrate''s exemption-handling
        discipline.'
    - id: supply-chain.slsa-provenance-verification_rationale
      name: rationale
      prose: Build provenance is the substrate's answer to the question "where did
        this artifact come from, who built it, from what source, in what environment,
        and how do I know the answer is trustworthy?" The SLSA framework operationalizes
        this question with a layered requirements model (Build L1 generates provenance;
        Build L2 signs it; Build L3 hardens the build platform against insider tampering).
        The substrate elects Build L2 as the production-grade-baseline threshold because
        Build L2 requires the build platform to generate the attestation (not the
        producer claiming the build platform did), with a verifiable signing identity.
        Build L3 raises the bar to attacker-resistant build platforms (hosted services
        with hermeticity and isolation guarantees); the substrate recommends L3 for
        profiles with elevated regulatory or risk posture. The substrate's verification
        gate is consumer-side because attestation generation is upstream (the build
        platform's responsibility) but attestation enforcement is consumer's responsibility
        (the deployment surface). The substrate publishes the verification discipline;
        the consumer implements the gate in their CI/CD.
    links:
    - rel: authoritative-source
      text: SLSA v1.1 Provenance specification (attestation format and predicate structure)
      href: https://slsa.dev/spec/v1.1/provenance
    - rel: authoritative-source
      text: SLSA v1.1 Verifying Artifacts (consumer-side verification discipline)
      href: https://slsa.dev/spec/v1.1/verifying-artifacts
    - rel: authoritative-source
      text: in-toto Attestation Framework v1.0 (envelope and statement format consumed
        by SLSA provenance and related predicates)
      href: https://github.com/in-toto/attestation/blob/main/spec/v1/README.md
    - rel: authoritative-source
      text: NIST SP 800-218 SSDF v1.1 PS.3 (Archive and Protect Each Software Release)
        and PW.4 (verifiable integrity via provenance)
      href: https://csrc.nist.gov/pubs/sp/800/218/final
    - rel: authoritative-source
      text: Executive Order 14028 of May 12, 2021 (US foundational policy generating
        the SSDF; federal collection mandate rescinded operationally by OMB M-26-05
        in February 2026; EO itself remains in force)
      href: https://www.federalregister.gov/documents/2021/05/17/2021-10460/improving-the-nations-cybersecurity
    - rel: authoritative-source
      text: EU Regulation 2024/2847 (Cyber Resilience Act) Annex I Part I 3(c) and
        Part II (vulnerability handling and provenance discipline; reporting obligations
        activate 2026-09-11; full enforcement 2027-12-11)
      href: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    - rel: authoritative-source
      text: CWE-1357 Reliance on Insufficiently Trustworthy Component
      href: https://cwe.mitre.org/data/definitions/1357.html
  - id: supply-chain.supply-chain-integrity-strategy
    class: substrate-rule
    title: Substrate consumer authors and maintains a supply-chain integrity strategy
      ADR documenting SLSA level target, attestation scope, SBOM cadence, signing
      identity policy, transparency log selection, and exemption discipline
    props:
    - name: rule-id
      ns: governance-commons
      value: supply-chain.supply-chain-integrity-strategy
    - name: layer
      ns: governance-commons
      value: judgmental
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    parts:
    - id: supply-chain.supply-chain-integrity-strategy_smt
      name: statement
      prose: 'The consumer authors and maintains an ADR (Architecture Decision Record)
        documenting their supply-chain integrity strategy. The ADR addresses each
        substrate-required decision: target SLSA Build Level (1, 2, or 3 substrate-recommended;
        consumer may select higher); attestation scope (which artifacts carry attestations,
        which predicate types are required); SBOM cadence (every release, every patch,
        every dependency change); SBOM format (CycloneDX or SPDX or both); signing
        identity policy (which OIDC issuers, which signer patterns, which signature
        schemes); transparency log selection (Sigstore Rekor public-good, self-hosted
        Rekor, equivalent); retention horizon (substrate-recommended profile-keyed
        defaults; consumer may deviate with rationale); exemption discipline (criteria
        for accepting unverified artifacts during transition; maximum transition window;
        approver identity). The ADR is committed under the consumer''s substrate-recommended
        ADR directory and reviewed on a substrate-recommended annual cadence or upon
        regulatory change (substrate-recommended explicit attention to EU CRA full-enforcement
        activation 2027-12-11).'
    - id: supply-chain.supply-chain-integrity-strategy_rationale
      name: rationale
      prose: 'Supply-chain integrity is a portfolio of decisions, not a single setting.
        The substrate cannot pick the consumer''s SLSA Build Level target because
        the target depends on the consumer''s threat model, regulatory exposure, and
        engineering investment tolerance. The substrate provides the decision framework;
        the consumer''s ADR records the choices. The substrate elects an ADR rather
        than a profile setting because supply-chain strategy decisions interact: choosing
        SLSA Build L3 implies hosted-hardened build platforms which implies a specific
        set of OIDC issuers which implies a specific allowed-signers policy which
        implies a transparency-log configuration. A profile setting reduces the interaction
        to a single value; an ADR preserves the interaction and the rationale.'
    links:
    - rel: authoritative-source
      text: SLSA v1.1 Threats overview (substrate-recommended threat-model anchor
        for the ADR)
      href: https://slsa.dev/spec/v1.1/threats-overview
    - rel: authoritative-source
      text: NIST SP 800-218 SSDF v1.1 (substrate-recommended technical-framework anchor
        for the ADR)
      href: https://csrc.nist.gov/pubs/sp/800/218/final
    - rel: authoritative-source
      text: NIST SP 800-161r1 Cybersecurity Supply Chain Risk Management
      href: https://csrc.nist.gov/pubs/sp/800/161/r1/final
    - rel: authoritative-source
      text: Executive Order 14028 (foundational US policy generating SSDF; substrate-referenced
        for historical context; federal collection mandate rescinded operationally
        by OMB M-26-05 Feb 2026)
      href: https://www.federalregister.gov/documents/2021/05/17/2021-10460/improving-the-nations-cybersecurity
    - rel: authoritative-source
      text: EU Regulation 2024/2847 (Cyber Resilience Act; active enforceable regulatory
        driver; reporting obligations activate 2026-09-11)
      href: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  - id: supply-chain.vulnerability-disclosure-response
    class: substrate-rule
    title: Coordinated vulnerability disclosure response runbook documented and exercised
    props:
    - name: rule-id
      ns: governance-commons
      value: supply-chain.vulnerability-disclosure-response
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    parts:
    - id: supply-chain.vulnerability-disclosure-response_smt
      name: statement
      prose: 'The consumer maintains a documented coordinated vulnerability disclosure
        response runbook covering: advisory monitoring (substrate-recommended sources:
        OSV, GitHub Advisory Database, ecosystem-specific advisory feeds, vendor security
        advisories); triage criteria (severity threshold for action, exploitability
        assessment, blast-radius assessment); response steps (containment, patching,
        communication to affected internal and external stakeholders); regulatory
        notification obligations (substrate-recommended explicit attention to EU CRA
        24-hour ENISA notification for in-scope products); escalation paths and on-call
        ownership; and a post-incident review template. The runbook is exercised through
        periodic drills (substrate-recommended quarterly); drill records are retained
        per supply-chain.attestation-and-sbom-retention.'
    - id: supply-chain.vulnerability-disclosure-response_rationale
      name: rationale
      prose: 'Vulnerability disclosure response is a discipline, not a document. The
        substrate requires both: the document codifies the discipline, and the exercise
        cadence keeps the document accurate. Substrate-recommended exercise patterns
        include tabletop walkthroughs of historical advisories (re-running the response
        for log4shell or similar high-impact CVEs as a documented exercise), live-fire
        drills triggered by published-but-not-targeting-consumer advisories, and game-day
        events where the response is tested against a simulated advisory. The EU CRA
        dimension elevates this rule''s importance for consumers shipping products
        with digital elements into the EU market. Beginning 2026-09-11, manufacturers
        must notify ENISA within 24 hours of becoming aware of an actively-exploited
        vulnerability, with follow-up reports within 72 hours and final reports within
        14 days of mitigation availability. Consumers without a documented and exercised
        runbook will struggle to meet these timelines.'
    links:
    - rel: authoritative-source
      text: NIST SP 800-216 Recommendations for Federal Vulnerability Disclosure Guidelines
      href: https://csrc.nist.gov/pubs/sp/800/216/final
    - rel: authoritative-source
      text: ISO/IEC 29147:2018 Vulnerability disclosure
      href: https://www.iso.org/standard/72311.html
    - rel: authoritative-source
      text: ISO/IEC 30111:2019 Vulnerability handling processes
      href: https://www.iso.org/standard/72311.html
    - rel: authoritative-source
      text: EU Regulation 2024/2847 (Cyber Resilience Act) Articles 14-15 (vulnerability
        handling and reporting; 24-hour notification to ENISA on awareness of actively-exploited
        vulnerabilities; activates 2026-09-11)
      href: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    - rel: authoritative-source
      text: OWASP Top 10 CI/CD Security Risks CICD-SEC-8 (Ungoverned Usage of 3rd
        Party Services)
      href: https://owasp.org/www-project-top-10-ci-cd-security-risks/
