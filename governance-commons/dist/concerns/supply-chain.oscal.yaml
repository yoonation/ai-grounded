      value: shell
    - name: applies-to-framework
      ns: governance-commons
      value: any-ci-platform
    - name: applies-to-environment
      ns: governance-commons
      value: build
    parts:
    - id: supply-chain.no-remote-execution-in-build_smt
      name: statement
      prose: 'Build scripts and CI workflow files contain no substrate-rejected remote-execution
        patterns. The substrate-rejected patterns include: piping a network fetch
        directly to a shell or interpreter (`curl URL | sh`, `curl URL | bash`, `wget
        URL -O- | sh`, `wget URL -O- | bash`, `irm URL | iex`, `Invoke-WebRequest
        URL | Invoke-Expression`); evaluating a fetched payload as code (`eval $(curl
        ...)`, `bash -c "$(curl ...)"`, `python -c "$(curl ...)"`); downloading and
        immediately executing without integrity check (`curl URL -o foo; ./foo`, `wget
        URL && chmod +x ... && ./...`); installing via shell-script installers from
        upstream that follow the same pattern internally (`curl -fsSL <installer>
        | sh`). The rule applies to substrate-recognized build-script locations (Dockerfile
        RUN, GitHub Actions run steps, GitLab CI script blocks, Jenkins Pipeline sh
        blocks, Makefile recipes, shell scripts in build directories).'
    - id: supply-chain.no-remote-execution-in-build_rationale
      name: rationale
      prose: 'The substrate elects this as a hard L1 prohibition because the pattern
        is unambiguous and its presence indicates either an unhardened build pipeline
        or a hardened pipeline with an unhardened bypass. The pattern has zero substrate-accepted
        use cases in production builds: every legitimate need (installing a tool,
        fetching a dependency, downloading test data) has a substrate-accepted alternative
        (use the ecosystem package manager with lockfile pinning, use a pre-built
        and digest-pinned container base, use a CI-native action with provenance,
        use the consumer''s authenticated artifact store). The substrate accepts that
        the pattern remains common in upstream installer documentation and in legacy
        pipelines. The migration path is per-violation: each instance is replaced
        by the substrate-accepted alternative for that specific dependency.'
    links:
    - rel: authoritative-source
      text: OWASP Top 10 CI/CD Security Risks CICD-SEC-4 (Poisoned Pipeline Execution)
        and CICD-SEC-7 (Insecure System Configuration)
      href: https://owasp.org/www-project-top-10-ci-cd-security-risks/
    - rel: authoritative-source
