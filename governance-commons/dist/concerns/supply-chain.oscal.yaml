    parts:
    - id: supply-chain.sbom-presence-and-validity_smt
      name: statement
      prose: 'Every production release artifact has an associated Software Bill of
        Materials in CycloneDX v1.6 or SPDX v2.3 format. The SBOM is generated by
        the build platform from the build environment and committed alongside the
        release artifact (in the same OCI registry as a referrers-attached attestation,
        in the same GitHub release as a release asset, or in the consumer''s substrate-recommended
        SBOM repository per supply-chain.attestation-and-sbom-retention retention
        discipline). The SBOM enumerates each component with at minimum: component
        name, version, supplier or namespace, and an integrity hash. CycloneDX and
        SPDX are both substrate-accepted because they cover overlapping use cases
        with different strengths; the consumer profile selects which is preferred.'
    - id: supply-chain.sbom-presence-and-validity_rationale
      name: rationale
      prose: The substrate elects SBOM presence as L1 rather than L2 because both
        generation (build-time machinery) and validation (format conformance) are
        mechanically checkable. SBOM utility (does the SBOM accurately represent the
        components in the artifact?) is L2 semantic territory and is covered by supply-chain.attestation-and-sbom-retention
        retention and audit discipline. The L1 rule catches the failure mode where
        SBOM generation was never attempted; the L2 rules catch the failure mode where
        SBOM generation was performed but the SBOM drifted from reality. The substrate
        accepts both CycloneDX and SPDX because they have different strengths. CycloneDX
        is strongest for component-and-vulnerability use cases (the substrate's primary
        use case in production-grade-baseline). SPDX is strongest for license-and-provenance
        use cases. CycloneDX 1.6 is substrate-default; SPDX 2.3 is substrate-accepted;
        SPDX 3.0 will be substrate-accepted on stable release.
