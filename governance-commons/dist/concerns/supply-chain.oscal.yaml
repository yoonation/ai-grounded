    - id: supply-chain.dependency-vetting_rationale
      name: rationale
      prose: 'Most supply-chain incidents in the past five years trace to dependencies
        that entered the production surface without per-adoption review. The substrate''s
        vetting discipline does not promise to catch every malicious dependency at
        adoption time; it does guarantee an audit trail for each adoption that anchors
        the consumer''s incident response. When an advisory drops on a dependency
        the consumer adopted, the vetting artifact is the consumer''s documentation
        of why the dependency was chosen, who chose it, what alternatives were considered,
        and what audit obligations followed. The substrate accepts that vetting adds
        friction. The friction is the point: dependencies are not free. Each adoption
        commits the consumer to ongoing audit burden (supply-chain.critical-dependency-audit)
        and incident response obligation (supply-chain.vulnerability-disclosure-response).
        The vetting artifact makes the burden visible at adoption rather than at advisory
