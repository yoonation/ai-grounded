  - id: code-organization.data-model-single-source-of-truth
    class: substrate-rule
    title: Data-model fields that are constant across a referencing dimension live
      once in a referenced entity, not duplicated per-referrer
    props:
    - name: rule-id
      ns: governance-commons
      value: code-organization.data-model-single-source-of-truth
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
