    parts:
    - id: code-organization.dependency-direction-layering_smt
      name: statement
      prose: 'Dependencies among first-party modules point in the direction the architecture
        intends: volatile and detailed modules depend on stable and abstract ones,
        and the domain core does not depend on delivery mechanisms, frameworks, or
        infrastructure detail. The rule presupposes code-organization.no-import-cycles
        (the graph is acyclic) and adds the question L1 cannot answer: given that
        the arrows form a directed acyclic graph, do they point the right way? The
        intended direction is set by the architectural style the consumer chose in
        code-organization.organization-strategy (layered, hexagonal, clean, vertical-slice);
        this rule checks conformance to that chosen direction. Where the direction
        must be inverted to keep a stable module from depending on a volatile one,
        the substrate-recommended mechanism is an abstraction (interface, protocol,
        trait) owned by the stable module and implemented by the volatile one.'
    - id: code-organization.dependency-direction-layering_rationale
      name: rationale
      prose: 'The Dependency Inversion Principle and the Stable Dependencies Principle
        together state the property: depend in the direction of stability, and where
        the natural dependency would run from stable to volatile, invert it with an
        abstraction. This is the structural choice that most determines whether a
        system''s core can be tested and evolved independently of its edges. A domain
        core that depends only on abstractions can be exercised without a database,
        a message bus, or a web server, which makes its tests fast and its logic portable;
        a core that imports the ORM and the framework is welded to them. The rule
        is semantic because direction is meaningful only relative to an intended architecture:
        an import from module A to module B is correct under one architectural style
        and a violation under another. Only a human holding the intended architecture
        in mind can judge a given edge, which is why the rule pairs with the L3 strategy
        that records that architecture.'
    links:
    - rel: authoritative-source
      text: The Dependency Inversion Principle (depend on abstractions; high-level
        modules do not depend on low-level modules; concept referenced)
