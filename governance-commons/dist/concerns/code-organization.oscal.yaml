    - id: code-organization.cyclomatic-complexity_smt
      name: statement
      prose: 'Functions and methods in first-party production source do not exceed
        the substrate-default cyclomatic-complexity threshold (default 10) or the
        substrate-default cognitive-complexity threshold (default 15). Both are profile-tunable
        parameters; a function breaching either is a finding. Cyclomatic complexity
        counts the linearly independent paths through the function (one plus the number
        of decision points: if, for, while, case, boolean operators, catch clauses).
        Cognitive complexity weights the same control flow by how hard it is for a
        human to follow, charging more for nesting and for breaks in linear flow.
        The substrate requires both because they catch different problems: a flat
        switch with many cases scores high on cyclomatic but low on cognitive (often
        acceptable), while a triply-nested loop-and-conditional scores moderate on
        cyclomatic but high on cognitive (usually not).'
    - id: code-organization.cyclomatic-complexity_rationale
      name: rationale
      prose: 'Of the cheaply measurable structural properties, control-flow complexity
        is the one most consistently associated with defects and with the cost of
        safe change. The substrate enforces it mechanically for the same reason it
        enforces length: a codebase that never measures complexity drifts toward functions
        whose every path no human has held in mind at once, and those are where the
        untested edge case lives. Pairing cyclomatic with cognitive complexity is
        deliberate. Cyclomatic alone penalizes a clean exhaustive switch as much as
        a tangled nest, which trains authors to avoid the wrong thing; cognitive complexity
        corrects this by charging for nesting and flow-breaking rather than for branch
        count, so the pair rewards flattening and named dispatch over clever density.'
