  - id: code-organization.duplication-and-abstraction
    class: substrate-rule
    title: Significant duplication is consolidated where it reflects one concept,
      and abstractions are introduced only when justified
    props:
    - name: rule-id
      ns: governance-commons
      value: code-organization.duplication-and-abstraction
    - name: layer
