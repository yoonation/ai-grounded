    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: code-organization.function-length_smt
      name: statement
      prose: Functions and methods in first-party production source do not exceed
        the substrate-default length threshold of 50 logical lines of code, where
        logical lines count executable statements and exclude blank lines, comments,
        import or use statements, and the signature line. The threshold is a profile-tunable
        parameter; consumers raise or lower it to fit their language's idiom (a higher
        ceiling is defensible for languages with verbose error handling, a lower one
        for terse functional styles) but the rule's intent (bound the amount a single
        function asks a reader to hold at once) is constant. The rule applies to named
        functions, methods, lambdas with bodies, and closures; it does not apply to
        declarative data literals (a long list, a long match table) that happen to
        live inside a function, which the binding excludes.
    - id: code-organization.function-length_rationale
      name: rationale
      prose: 'Length is the cheapest structural signal to measure and one of the most
        reliable early warnings that a function has accreted responsibilities. The
        substrate treats it as a mechanical floor precisely because it is cheap: a
        linter can enforce it on every commit at no review cost, and the act of keeping
        functions short pushes authors toward naming the steps of a computation, which
        is the single highest-leverage readability practice available. The substrate
        does not claim that 50 lines is a magic number; it claims that a codebase
        which never measures length will drift toward functions that only their author
        can change, and that a measured threshold with documented exemptions is strictly
        better than no threshold. The complementary rule code-organization.cyclomatic-complexity
        (complexity) catches the case of a short function that is nonetheless hard
        to follow because of dense branching; the two L1 rules together bound both
        the volume and the tangledness of a single scope.'
    links:
    - rel: authoritative-source
      text: Ruff PLR0915 too-many-statements rule (Python function statement-count
        ceiling; substrate-default detector for the Python ecosystem)
      href: https://docs.astral.sh/ruff/rules/too-many-statements/
    - rel: authoritative-source
      text: ESLint max-lines-per-function rule (JavaScript and TypeScript function
        length ceiling)
      href: https://eslint.org/docs/latest/rules/max-lines-per-function
    - rel: authoritative-source
      text: golangci-lint funlen linter (Go function length ceiling in lines and statements)
      href: https://golangci-lint.run/usage/linters/#funlen
  - id: code-organization.module-boundary-cohesion
    class: substrate-rule
    title: Modules and packages group code by cohesive responsibility, so that each
      module has a single clear reason to change
    props:
    - name: rule-id
      ns: governance-commons
      value: code-organization.module-boundary-cohesion
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: maintainability
    - name: severity
      ns: governance-commons
      value: medium
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: code-organization.module-boundary-cohesion_smt
      name: statement
      prose: 'Modules, packages, and namespaces group code by cohesive responsibility
        so that the elements of a module change together and for the same reason,
        and so that a module can be named for what it does rather than for the kind
        of thing it holds. A reviewer can state, in one sentence and without "and",
        what each module is responsible for. The substrate treats two patterns as
        findings to investigate: the grab-bag module (utils, common, helpers, misc,
        shared) that holds unrelated code united only by not belonging elsewhere,
        and the smeared responsibility (a single concept whose implementation is scattered
        across many modules so that one logical change touches all of them). The rule
        does not mandate a particular module granularity; it requires that whatever
        granularity is chosen tracks cohesive responsibility.'
    - id: code-organization.module-boundary-cohesion_rationale
      name: rationale
      prose: 'Cohesion and coupling are the two halves of one idea: code that changes
        together should live together, and code that changes independently should
        be separable. The Single Responsibility Principle and the Common Closure Principle
        both express the same operational test, which the substrate adopts: a module
        should have one reason to change. When boundaries follow responsibility, the
        system exhibits the property teams actually want, that the size of a change
        in the code tracks the size of the change in requirements. When boundaries
        follow incidental categories (everything that is a "service", everything that
        is a "model", a junk drawer of utilities), a small requirement change scatters
        across the codebase. The rule is semantic because only a human who understands
        the domain can say whether two things share a reason to change; a tool can
        flag a suspiciously central module or an over-large one, but it cannot read
        the domain.'
    links:
    - rel: authoritative-source
      text: The Single Responsibility Principle (a module should have one reason to
        change; concept referenced, originated by Robert C. Martin)
      href: https://en.wikipedia.org/wiki/Single-responsibility_principle
    - rel: authoritative-source
      text: Cohesion in software (the degree to which a module's elements belong together)
        and its inverse relationship with coupling
      href: https://en.wikipedia.org/wiki/Cohesion_(computer_science)
  - id: code-organization.no-import-cycles
    class: substrate-rule
    title: First-party modules do not form circular import or dependency relationships
    props:
    - name: rule-id
      ns: governance-commons
      value: code-organization.no-import-cycles
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
      ns: governance-commons
      value: maintainability
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: code-organization.no-import-cycles_smt
      name: statement
      prose: 'The dependency graph of first-party modules contains no cycles. Built
        by static import or dependency analysis at the consumer-selected granularity
        (module, package, or architectural layer), the graph has no strongly connected
        component of size greater than one. The rule covers first-party source only:
        a cycle through a third-party library is not in scope (and is generally impossible
        to introduce), and the rule never asserts anything about the external dependency
        graph, which is the dependency-management concern. Where the language compiler
        already forbids cycles at the chosen granularity (Go package imports), the
        rule is satisfied by the build, and the substrate-recommended detection target
        shifts to finer-grained or layer-level cycles the compiler does not catch.'
    - id: code-organization.no-import-cycles_rationale
      name: rationale
      prose: 'A cycle is the one structural property that is both unambiguous and
        almost always wrong, which makes it ideal for mechanical enforcement. Unlike
        length or complexity, where the threshold is a heuristic, cycle-freedom is
        a crisp graph property with a clear remediation vocabulary. Cycles are corrosive
        because they erase modularity at the exact granularity the consumer chose
        to reason in: two modules in a cycle are effectively one module that has been
        split for filing convenience, with all the coupling and none of the independence.
        Enforcing acyclicity early and continuously keeps the cost of each break small
        (one edge to invert or extract) rather than letting cycles accrete into a
        tangle that resists any decomposition. The rule is the mechanical foundation
        on which code-organization.dependency-direction-layering builds: you cannot
        meaningfully ask which way the arrows should point until you have established
        that the arrows form a directed acyclic graph at all.'
    links:
    - rel: authoritative-source
      text: The Acyclic Dependencies Principle (component dependency graph must be
        a directed acyclic graph; concept referenced, originated by Robert C. Martin)
      href: https://en.wikipedia.org/wiki/Acyclic_dependencies_principle
    - rel: authoritative-source
      text: 'import-linter contract types (Python: forbidden, independence, and layers
        contracts that detect and prevent first-party cycles)'
      href: https://import-linter.readthedocs.io/en/stable/contract_types.html
    - rel: authoritative-source
      text: eslint-plugin-import no-cycle rule (JavaScript and TypeScript first-party
        import-cycle detection)
      href: https://github.com/import-js/eslint-plugin-import/blob/main/docs/rules/no-cycle.md
    - rel: authoritative-source
      text: 'ArchUnit cycle checks (Java and JVM: slices().should() .beFreeOfCycles()
        architecture test)'
      href: https://www.archunit.org/userguide/html/000_Index.html#_cycle_checks
