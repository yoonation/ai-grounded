  - id: monitoring-alerting.silence-carries-expiry
    class: substrate-rule
    title: No alert silence, mute, or inhibition is open-ended; every suppression
      carries an explicit expiry
    props:
    - name: rule-id
      ns: governance-commons
      value: monitoring-alerting.silence-carries-expiry
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
