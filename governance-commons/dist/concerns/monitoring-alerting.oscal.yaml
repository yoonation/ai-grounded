        decisions about who is notified and how a missed page is recovered, not properties
        of an individual alert rule. The dominant failure here is the critical alert
        that fires correctly and routes to a channel no one is paged on, so it sits
        until business hours, and the page that goes to a single responder with no
        backstop, so an asleep or unavailable primary means the incident is unhandled.
