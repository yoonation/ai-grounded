    parts:
    - id: performance-caching.no-cache-call-in-loop_smt
      name: statement
      prose: Cache operations over a collection use the cache client's batch form
        (MGET, MSET, a pipeline, or the framework get_many and set_many) rather than
        a single-key operation issued once per element inside a loop. The rule applies
        to reads and writes on the request path; it does not apply to a loop with
        a constant low iteration count, to a batch or background path exempted by
        directory, or to a loop whose body issues no cache operation. The presence
        of a per-item cache call in a load-scaled loop is the finding; the correct
        batch form is chosen in review.
    - id: performance-caching.no-cache-call-in-loop_rationale
      name: rationale
      prose: A cache is added to remove latency, and a round trip per item reintroduces
        the very latency the cache was meant to remove, multiplied by the collection
        size. The fixed cost of a cache round trip (a network hop, command parsing,
        a response) is paid once per element instead of once per request, and the
        element count grows with load. The substrate treats the per-item cache call
        in a loop as a mechanical floor because the structure is statically visible
        and the batch remedy is a single well-known call, while the judgment of whether
        the loop is hot enough to matter is review. This is the cache-tier sibling
        of the database N+1 rule (performance-database.no-query-in-loop) and the set-based
        bulk rule (performance-database.bulk-operations); the same round-trip-amortization
        principle applies wherever a per-item call crosses a process boundary.
    links:
    - rel: authoritative-source
      text: Redis MGET command (retrieving many keys in one round trip, the batch
        remedy for per-key cache lookups)
      href: https://redis.io/docs/latest/commands/mget/
