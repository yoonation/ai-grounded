  - id: performance-caching.ttl-on-write
    class: substrate-rule
    title: Every cache write sets an explicit, bounded time-to-live; no value is written
      to a cache with no expiry
    props:
    - name: rule-id
      ns: governance-commons
      value: performance-caching.ttl-on-write
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
