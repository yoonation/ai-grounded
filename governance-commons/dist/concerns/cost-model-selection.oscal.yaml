    parts:
    - id: cost-model-selection.cost-attribution-tags_smt
      name: statement
      prose: 'Every infrastructure resource declared in the consumer''s infrastructure-as-code
        (IaC) that incurs cloud or vendor cost carries the substrate-required cost-attribution
        tag set. The substrate-recommended floor is four tags: cost-center (which
        financial cost center the spend attributes to), environment (production, staging,
        development, or the consumer''s environment vocabulary), service (which service
        in the consumer''s service catalog the resource supports), and owner (which
        team or individual is accountable for the spend). Consumers extend the required
        set with additional tags appropriate to their cost program (tenant for multi-tenant
        deployments, project for grant-funded work, compliance-regime for regulated
        workloads). The tag block is present in the resource declaration at IaC author
        time. The CI pipeline rejects IaC changes that introduce billable resources
        without the tag block. Provider-side tag enforcement (AWS Service Control
        Policies, Azure Policy, GCP Organization Policy, OPA Gatekeeper for Kubernetes)
        is the substrate-recommended belt-and-braces complement; the rule''s mechanical
        L1 detection runs at the IaC source regardless of whether the provider-side
        gate exists.'
    - id: cost-model-selection.cost-attribution-tags_rationale
      name: rationale
      prose: 'Tag presence at the resource declaration is the only point in the resource
        lifecycle at which attribution is cheap. After provisioning, retroactive tagging
        requires either an inventory crawl (covering every resource and matching it
        back to its IaC source of truth) or live re-tagging via provider APIs against
        running resources, both of which produce gaps where the resource was created
        outside IaC, was destroyed before re-tagging, or was created during the retrofit
        window. The cumulative cost of untagged resources compounds: in mature consumer
        cost programs, the largest remediation effort is typically retroactive attribution
        rather than ongoing tag governance. Untagged resources also break the cost-anomaly
        signal. A 20 percent month-over-month increase in untagged spend is uninvestigable:
        the operator does not know which service, team, or tenant is consuming the
        increment. Tagged resources convert the same anomaly into a service-level
        question that the consumer''s pipeline can answer. The rule is mechanical
        because it does not depend on judgment about the tag values, only on the presence
        of the tag block. Whether cost-center "CC-1234" resolves to a real cost center
        is L2; whether the tag block is present at all is L1. The L1 boundary is well-suited
        to static analysis because the question is positional (is there a tags block
        at this position in the resource declaration?) rather than semantic (does
        the tag block reference correct values?).'
    links:
    - rel: authoritative-source
      text: 'FinOps Foundation Framework: Allocation principle (the practice of attributing
        cloud spend to its business consumers; tag-based allocation is the substrate-recommended
        primary mechanism)'
      href: https://www.finops.org/framework/principles/
