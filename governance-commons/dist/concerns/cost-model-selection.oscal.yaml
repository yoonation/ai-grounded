  - id: cost-model-selection.workload-resource-limits
    class: substrate-rule
    title: Every workload declares CPU and memory resource limits; the orchestrator
      rejects workloads that omit them
    props:
    - name: rule-id
      ns: governance-commons
      value: cost-model-selection.workload-resource-limits
    - name: layer
