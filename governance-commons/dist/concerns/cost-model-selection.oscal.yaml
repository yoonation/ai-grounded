    - name: applies-to-environment
      ns: governance-commons
      value: any-orchestrated-runtime
    parts:
    - id: cost-model-selection.workload-resource-limits_smt
      name: statement
      prose: 'Every workload (container in a Kubernetes pod spec, a Lambda function,
        a Cloud Run service revision, an ECS task definition''s container, an Azure
        Container Apps container, an Azure Functions plan-scoped function, or other
        orchestrator-managed workload) declares its CPU limit and memory limit as
        part of the workload manifest committed to IaC. The orchestrator or admission
        controller rejects workloads that omit the limit declaration: Kubernetes via
        a LimitRange or an admission policy (OPA Gatekeeper, Kyverno, or Pod Security
        Standards equivalent); AWS Lambda via a consumer-side IaC linter that fails
        the pipeline on missing memorySize; Cloud Run via the substrate-recommended
        deployment gate; ECS via task-definition validation in the consumer''s deployment
        pipeline. Substrate-recommended floor: every container declares both resources.limits.cpu
        and resources.limits.memory (Kubernetes terminology; equivalent in other orchestrators).
        Substrate-recommended addition: resources.requests are also declared and aligned
        with the limits per the consumer''s QoS class policy (L2 scope; see cost-model-selection.cost-emission-pipeline).'
    - id: cost-model-selection.workload-resource-limits_rationale
      name: rationale
      prose: 'Cost discipline at the workload layer is bounding. Without a CPU limit,
        a runaway thread saturates a node CPU; without a memory limit, a leaking allocation
        grows until the orchestrator''s OOM killer terminates the workload or, on
        platforms without OOM bounds, the node OOMs and evicts every other workload
        on it. The cost consequence is twofold: the runaway workload consumes capacity
        the consumer pays for at the runaway rate; the eviction of neighbors triggers
        cascade restart costs (cold-start latency, replica scaling, downstream retry
        storms) that bill against services that did nothing wrong. Resource limits
        also gate the noisiest workload-level cost surprise: a workload sized for
        one traffic profile and deployed against a different one without an explicit
        limit. The substrate-recommended L2 review (cost-model-selection.cost-emission-pipeline
        cost-emission pipeline) covers whether the limit values match the workload''s
        actual profile; the L1 rule''s concern is only that limits exist. The rule
        is mechanical because limit declarations are positional in the workload manifest:
        a key under a resources block (Kubernetes), a MemorySize field (Lambda), a
        resources.limits block (Cloud Run), a cpu and memory field at the container
        level (ECS). Static analysis verifies presence; right-sizing is L2.'
    links:
    - rel: authoritative-source
