    - id: dependency-management.vetting-policy_rationale
      name: rationale
      prose: 'Every direct dependency is a commitment. Beyond the immediate functional
        value, the dependency carries ongoing cost: integration maintenance, transitive
        surface expansion, security tracking, license compliance, eventual upgrade
        or replacement. The cumulative cost across many dependencies is the project''s
        maintenance burden in the future. Intake-time vetting is the cheapest place
        to manage that cost. A dependency rejected at intake never accumulates the
        costs above. A dependency accepted without examination accumulates them silently.
        The substrate''s L3 rule forces the criteria to be explicit so the team can
        evaluate dependencies consistently against them, and so that turnover in the
        team does not lose the institutional reasoning. The substrate provides analysis
        of common criteria (license, maintenance health, security posture, transitive
        footprint, alternatives evaluation) in the framework. The consumer chooses
        which criteria apply in their context and at what weight.'
