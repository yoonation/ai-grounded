    parts:
    - id: dependency-management.update-cadence_smt
      name: statement
      prose: 'The project documents an update cadence: how often updates are attempted,
        who reviews them, and the staleness budget beyond which a dependency is considered
        overdue. Evidence of the cadence is visible (automation bot PRs, merged update
        PRs in history, a dependency dashboard, a periodic review ritual). Where automated
        update tooling is in use, its configuration is committed to the repository
        and its open PRs are addressed within the documented SLA rather than left
        to accumulate. The substrate-recommended starting cadence for production-grade-baseline:
        at least weekly automated PRs; major-version upgrades reviewed monthly; total
        staleness budget of 90 days for any single direct dependency past its latest
        release.'
    - id: dependency-management.update-cadence_rationale
      name: rationale
      prose: 'Three risk patterns motivate this rule. Accumulated upgrade gap: a dependency
        that has shipped six minor releases since the project last upgraded is harder
        to upgrade than a dependency one minor release behind. Breaking changes accumulate;
        migration guides span multiple versions; testing surface multiplies. Reactive-only
        patching: a team that only updates on incident is reacting to attacker timing.
        A CVE published Monday becomes a panic by Friday because the team has not
        exercised the upgrade muscle. Regular cadence keeps the muscle warm. Maintainer
        abandonment risk: a dependency whose upstream has not released in 18 months
        may be abandoned, deprecated, or compromised. Active cadence surfaces these
        signals; quarterly review catches them before they become emergencies.'
    links:
    - rel: authoritative-source
      text: NIST SP 800-218 SSDF v1.1 (PW.4 well-secured components; PO.3 maintain
        a secure environment)
      href: https://csrc.nist.gov/publications/detail/sp/800-218/final
