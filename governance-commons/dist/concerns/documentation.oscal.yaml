    parts:
    - id: documentation.no-placeholder-documentation_smt
      name: statement
      prose: Committed documentation (doc comments, README and guide files, and reference
        pages) MUST NOT contain unresolved placeholder or TODO markers presented as
        though the content were complete. A documentation artifact that ships with
        a TODO, TBD, fill-in-here stub, or lorem-ipsum placeholder in place of content
        is a violation.
    - id: documentation.no-placeholder-documentation_rationale
      name: rationale
      prose: 'A reader trusts that shipped documentation is finished. A placeholder
        defeats that trust silently: the reader spends time on a section that turns
        out to be empty, or worse, acts on a stub that looks like guidance. Flagging
        unresolved placeholders keeps the documented surface honest, so that what
        ships is either real content or an explicit, visible gap rather than a stub
        masquerading as complete.'
    links:
