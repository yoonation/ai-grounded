    parts:
    - id: documentation.public-api-documented_smt
      name: statement
      prose: Every public or exported API surface in first-party code (an exported
        function, method, class, type, module, or package, per the language's visibility
        rules and the consumer's public-surface definition) MUST carry a doc comment.
        An exported symbol with no doc comment is a violation.
    - id: documentation.public-api-documented_rationale
      name: rationale
      prose: 'The public surface is the contract a codebase offers its consumers,
        and a contract with no description forces every consumer to reverse-engineer
        it from the implementation. Requiring a doc comment at the point of definition
        makes the contract self-describing, keeps the description next to the code
        so it is more likely to stay current, and gives the accuracy rule a target
        to verify. The rule deliberately targets only the public surface: internal
        helpers are not in scope, because documenting everything indiscriminately
        produces noise that degrades rather than aids understanding.'
    links:
    - rel: authoritative-source
      text: Diataxis documentation framework, on reference documentation that describes
        the public surface of a system.
      href: https://diataxis.fr/
