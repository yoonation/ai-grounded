    - id: documentation.decisions-and-operations_smt
      name: statement
      prose: 'A team MUST record and keep discoverable the decisions and operational
        knowledge needed to operate and evolve the system: architecturally significant
        decisions captured as decision records, consumer-visible changes captured
        in a changelog, and the minimum operational documentation (a setup or onboarding
        guide and a runbook for the system''s on-call surface).'
    - id: documentation.decisions-and-operations_rationale
      name: rationale
      prose: 'The most expensive documentation gap is the knowledge that was never
        written down: the reason a design was chosen, the difference between two releases,
        the steps to bring the system up, and the response to a known failure. When
        that knowledge lives only with individuals, onboarding is slow, settled debates
        reopen, and incidents run long. Recording decisions, changes, and operations,
        and keeping them where a reader will find them, makes the team resilient to
        the absence of any one person.'
