  - id: performance-database.index-alignment
    class: substrate-rule
    title: Indexes are aligned to the application's actual query access patterns,
      with composite and covering indexes for hot queries and no unused or redundant
      indexes that only tax writes
    props:
    - name: rule-id
      ns: governance-commons
      value: performance-database.index-alignment
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
