    class: substrate-rule
    title: Schema migrations create indexes and alter columns using the engine's non-blocking
      form where one exists, so a migration does not take a long exclusive lock on
      a hot table
    props:
    - name: rule-id
      ns: governance-commons
      value: performance-database.non-blocking-migrations
