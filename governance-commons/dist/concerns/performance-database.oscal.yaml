    - id: performance-database.explicit-column-projection_smt
      name: statement
      prose: Read queries on the request path select an explicit list of the columns
        the code uses rather than a wildcard. Expressed in raw SQL this means naming
        the columns instead of SELECT *; expressed through an ORM it means using the
        field-restriction directive where the response needs only a subset of a wide
        model. The rule targets read paths where projection width affects cost; it
        does not require projecting away columns from a single-row fetch whose full
        entity is genuinely used and mutated. The presence of a wildcard projection
        on a read path is the finding.
    - id: performance-database.explicit-column-projection_rationale
      name: rationale
      prose: 'Selecting columns the code does not use is pure waste paid on every
        execution: more bytes off disk, more bytes over the wire, more deserialization,
        and more memory. The quieter cost is the defeat of covering indexes: a narrow
        query can sometimes be answered entirely from an index without touching the
        table, an index-only scan that is often an order of magnitude cheaper, and
        a wildcard makes that impossible because the index cannot contain every column.
        A wildcard also couples the query to the table''s full shape, so adding a
        large column later silently slows every wildcard read. The substrate sets
        this at medium because the cost is a constant factor rather than an unbounded
        blowup, but it remains a mechanical floor because the waste is unambiguous
        and the fix is free.'
