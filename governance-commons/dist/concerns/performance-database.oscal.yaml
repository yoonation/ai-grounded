  - id: performance-database.keyset-pagination
    class: substrate-rule
    title: Deep result navigation uses keyset (cursor) pagination rather than large
      OFFSET scans
    props:
    - name: rule-id
      ns: governance-commons
      value: performance-database.keyset-pagination
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: performance-efficiency
    - name: severity
      ns: governance-commons
      value: medium
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: performance-database.keyset-pagination_smt
      name: statement
      prose: 'Collection endpoints that back lists large enough to be navigated deeply
        paginate by keyset: the page boundary is a cursor encoding the last seen value
        of a stable, indexed sort key, and the next page is fetched with a predicate
        on that key plus a LIMIT, rather than with a large OFFSET. The ordering is
        total and stable (the sort key plus a tiebreaker such as the primary key)
        so that pages neither overlap nor skip rows as data changes. Shallow pagination
        over small lists may use offset; the rule targets the deep-navigation case
        where offset cost becomes a cliff.'
    - id: performance-database.keyset-pagination_rationale
      name: rationale
      prose: 'OFFSET is implemented by scanning and throwing away the skipped rows,
        so it does work proportional to how far into the list the page is; the hundredth
        page of a long list pays for the ninety-nine pages before it on every request.
        Keyset pagination replaces that scan with an indexed seek to the boundary,
        making every page the same cost regardless of depth, at the price of a cursor-based
        interface rather than arbitrary page numbers. The trade is almost always worth
        it for lists that are genuinely navigated deeply or exposed to automated traversal,
        and unnecessary for short lists. The stable-order requirement is the subtle
        part: without a total, deterministic order, concurrent inserts cause keyset
        (and offset) pages to drift, so the rule requires a tiebreaker on a unique
        column.'
    links:
    - rel: authoritative-source
      text: Keyset (seek) pagination versus OFFSET (a public explanation of the deep-offset
        cost, referenced as concept)
      href: https://use-the-index-luke.com/no-offset
    - rel: authoritative-source
      text: Postgres LIMIT and OFFSET (the offset cost this rule avoids for deep navigation)
      href: https://www.postgresql.org/docs/current/queries-limit.html
  - id: performance-database.no-query-in-loop
    class: substrate-rule
    title: Database queries are not issued from inside a loop over a collection; related
      data is fetched in a single set-based query or via the ORM's eager-loading mechanism
    props:
    - name: rule-id
      ns: governance-commons
      value: performance-database.no-query-in-loop
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
      ns: governance-commons
      value: performance-efficiency
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: performance-database.no-query-in-loop_smt
      name: statement
      prose: Database queries are not issued from inside a loop that iterates over
        rows returned by a prior query or over a request-scaled collection. Related
        data needed for each element is fetched up front in a single set-based query
        (a JOIN, or a single query with an IN clause over the collected keys) or through
        the ORM's eager-loading mechanism. The rule applies to read and write queries
        alike on the OLTP request path; it does not apply to a fixed small number
        of queries that happen to sit in a loop with a constant low bound, to analytics
        or batch paths exempted by directory, or to loops whose body issues no datastore
        query. The presence of a datastore query in a load-scaled loop is the finding;
        the correct rewrite (set-based versus eager-load) is chosen in review.
    - id: performance-database.no-query-in-loop_rationale
      name: rationale
      prose: 'Each database round trip carries fixed overhead independent of the data
        it moves: a connection checkout, a network round trip, query planning, and
        result marshalling. Issuing that overhead once per row instead of once per
        request multiplies it by the row count, and the row count is exactly the quantity
        that grows as the application succeeds. The defect is therefore self-concealing
        in two ways: it is invisible against small development datasets, and it gets
        worse precisely when the system is most valuable. The substrate treats the
        loop-query pattern as a mechanical floor because the structure is statically
        visible and the fix is a well-trodden ORM idiom, while the cost of leaving
        it is a latency regression that is hard to attribute after the fact (it presents
        as general slowness, not a single slow query). The complementary L2 rule performance-database.index-alignment
        ensures the single set-based query the remediation produces is itself backed
        by an index.'
    links:
    - rel: authoritative-source
      text: SQLAlchemy relationship-loading guide (selectinload and joinedload as
        the eager-loading remedies for N+1)
      href: https://docs.sqlalchemy.org/en/20/orm/queryguide/relationships.html
    - rel: authoritative-source
      text: Django QuerySet select_related and prefetch_related (the ORM eager-loading
        directives that collapse N+1 into one or two queries)
      href: https://docs.djangoproject.com/en/stable/ref/models/querysets/#select-related
    - rel: authoritative-source
      text: Prisma relation queries and the include directive (eager loading in the
        TypeScript ORM)
      href: https://www.prisma.io/docs/orm/prisma-client/queries/relation-queries
