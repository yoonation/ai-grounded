    - rel: authoritative-source
      text: Postgres multi-row INSERT and COPY (set-based and bulk-load write forms)
      href: https://www.postgresql.org/docs/current/dml-insert.html
    - rel: authoritative-source
      text: SQLAlchemy bulk INSERT and UPDATE (set-based ORM write operations)
      href: https://docs.sqlalchemy.org/en/20/orm/queryguide/dml.html
  - id: performance-database.data-access-strategy
    class: substrate-rule
    title: 'The application has a documented data-access performance strategy: a recorded
      decision covering workload characterization, indexing posture, connection topology,
      transaction and consistency policy, pagination and bulk-IO conventions, and
      read-scaling, reviewed on a stated cadence'
