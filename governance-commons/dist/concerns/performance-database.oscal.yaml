  - id: performance-database.pool-sizing
    class: substrate-rule
    title: The connection pool is sized and configured for the workload and the datastore's
      own connection ceiling, including the serverless and high-concurrency fan-out
      case
    props:
    - name: rule-id
      ns: governance-commons
      value: performance-database.pool-sizing
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: performance-efficiency
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: performance-database.pool-sizing_smt
      name: statement
      prose: The connection pool's maximum size is chosen so that the sum of all application
        instances' pools stays within the datastore's connection ceiling with headroom
        for administrative and replica connections, and so that a single instance
        has enough connections to serve its concurrent workload without serializing
        on the pool. The pool is configured with a bounded acquire timeout (so a starved
        pool fails fast rather than hanging), a maximum connection lifetime (so connections
        recycle and rebalance), and, in serverless or high-fan-out deployments, an
        external pooler between the application and the database so that instance
        churn does not breach the ceiling.
    - id: performance-database.pool-sizing_rationale
      name: rationale
      prose: 'More connections are not faster. A database serves connections with
        a bounded number of backend processes or threads, and beyond the point where
        active connections match available cores, additional connections add context-switching
        and contention rather than throughput, which is why the empirically right
        pool is often surprisingly small. The constraint that makes sizing hard is
        that it is global: each instance''s pool is local, but they all draw on one
        shared ceiling, so a pool size that is fine for one instance becomes an outage
        at fifty. Serverless makes this acute because instance count is elastic and
        largely outside the application''s control, which is the canonical reason
        to interpose an external pooler that multiplexes many client connections onto
        few database connections. The acquire timeout and max lifetime are the safety
        valves: the former converts pool starvation into a fast, visible error, and
        the latter keeps connections from pinning to a single database node after
        a failover or scaling event.'
    links:
    - rel: authoritative-source
      text: Postgres max_connections (the hard ceiling that the sum of all application
        pools must respect)
      href: https://www.postgresql.org/docs/current/runtime-config-connection.html
    - rel: authoritative-source
      text: PgBouncer (an external connection pooler for the serverless and high-fan-out
        case)
      href: https://www.pgbouncer.org/
  - id: performance-database.pooled-connections
    class: substrate-rule
    title: Database connections are obtained from a configured connection pool rather
      than constructed per request or per operation on the request path
    props:
    - name: rule-id
      ns: governance-commons
      value: performance-database.pooled-connections
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: performance-efficiency
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: performance-database.pooled-connections_smt
      name: statement
      prose: Database connections used on the request path are drawn from a connection
        pool established once at process or worker startup and returned to the pool
        when the unit of work completes, not constructed and torn down per request
        or per operation. The rule applies to the OLTP request path; it does not apply
        to one-shot scripts, migrations, or administrative tasks that legitimately
        open a single connection, run, and exit. The construction of a connection
        or engine on the request path is the finding.
    - id: performance-database.pooled-connections_rationale
      name: rationale
      prose: 'Connection establishment is one of the most expensive operations in
        the data path, and it is also one of the scarcest: databases enforce a hard
        ceiling on concurrent connections, and exceeding it does not degrade gracefully,
        it refuses new connections and locks out the application. A pool amortizes
        establishment cost across many requests and, critically, bounds the number
        of connections the application can hold, converting an unbounded per-request
        connection storm into a bounded queue for a fixed set of connections. The
        substrate makes pool use a mechanical floor because the per-request-connection
        antipattern is statically visible and its consequence under load is a correlated
        outage. Pool sizing, acquire timeout, and the serverless case are the contextual
        judgments handled in performance-database.pool-sizing.'
    links:
    - rel: authoritative-source
      text: SQLAlchemy connection pooling (QueuePool and the engine as the process-level
        pooled resource)
      href: https://docs.sqlalchemy.org/en/20/core/pooling.html
    - rel: authoritative-source
      text: node-postgres pooling guide (Pool versus per-request Client)
      href: https://node-postgres.com/features/pooling
  - id: performance-database.replica-routing
    class: substrate-rule
    title: Where read replicas are used, each read path declares its tolerance for
      replication lag, and only reads that tolerate staleness are routed to replicas
    props:
    - name: rule-id
      ns: governance-commons
      value: performance-database.replica-routing
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: performance-efficiency
    - name: severity
      ns: governance-commons
      value: medium
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: performance-database.replica-routing_smt
      name: statement
      prose: 'Where the deployment uses read replicas to scale reads, each read path
        is classified by its tolerance for replication lag, and routing respects that
        classification: reads that require read-your-writes or strong consistency
        (a user reading data they just wrote, a check that gates a write) go to the
        primary, while reads that tolerate bounded staleness (listings, dashboards,
        analytics, search results) may go to replicas. The classification is explicit
        in the code or configuration rather than implicit, so a new read path is routed
        deliberately. Where a normally lag-tolerant path occasionally needs fresh
        data, the freshness requirement is expressed at the call site.'
    - id: performance-database.replica-routing_rationale
      name: rationale
      prose: 'A read replica is a consistency trade dressed as a performance feature:
        it adds read capacity in exchange for serving data that may be slightly behind
        the primary. The trade is sound for the large class of reads that do not need
        the very latest write, and unsound for the reads that do, and the failure
        when the line is crossed is a subtle, intermittent staleness bug rather than
        an error. Because the routing decision is per-read-path and depends on what
        the read is for, it cannot be made globally; the discipline is to make the
        lag tolerance of each path explicit so routing is a deliberate classification
        rather than an accident of which connection the code happened to grab. This
        rule is conditional: a single-primary deployment has no replica to route to,
        and the rule activates when replicas enter the topology.'
    links:
    - rel: authoritative-source
      text: Postgres replication and standby servers (the source of replication lag
        that read routing must account for)
      href: https://www.postgresql.org/docs/current/warm-standby.html
  - id: performance-database.transaction-scope
    class: substrate-rule
    title: 'Database transactions are kept short and narrow: they perform no network
      or external I/O, hold no user think-time, and use the lowest isolation level
      sufficient for correctness'
    props:
    - name: rule-id
      ns: governance-commons
      value: performance-database.transaction-scope
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: performance-efficiency
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: performance-database.transaction-scope_smt
      name: statement
      prose: Transactions enclose only the database work that must be atomic, and
        nothing else. They do not span calls to external systems (HTTP requests, message
        publishes, third-party APIs), do not wait on user input or other think-time,
        and do not perform expensive in-process computation that could be done outside
        the transaction. The isolation level is the lowest that preserves the operation's
        correctness, escalated deliberately only where a specific anomaly (a lost
        update, a phantom read) would otherwise occur. Where stronger guarantees are
        needed under contention, the review considers optimistic concurrency (a version
        column) before a longer or stricter transaction.
    - id: performance-database.transaction-scope_rationale
      name: rationale
      prose: 'The duration a transaction is open is the duration its locks are held
        and its connection is occupied, and both are shared, contended resources.
        A long transaction does not slow only itself; it slows everything that needs
        the rows it holds or the connection it occupies. Wrapping an external call
        in a transaction is the acute form: the database now holds locks for as long
        as a remote system takes to respond, which under that system''s slow path
        can be seconds, and a deadlock or pool exhaustion can follow. The remedy is
        almost always to restructure so the external effect happens outside the transaction
        (publish an event after commit, or use an outbox), keeping the transaction
        to the local writes that must be atomic. Isolation level is the second axis:
        stronger isolation buys correctness at the cost of more aborts and contention,
        so the discipline is to take the least that is correct.'
    links:
    - rel: authoritative-source
      text: Postgres transaction isolation levels (choosing the lowest level sufficient
        for correctness)
      href: https://www.postgresql.org/docs/current/transaction-iso.html
    - rel: authoritative-source
      text: Postgres explicit locking and lock duration (locks are held until the
        transaction ends)
      href: https://www.postgresql.org/docs/current/explicit-locking.html
