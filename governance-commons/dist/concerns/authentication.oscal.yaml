        for compliance windows, and accessed by operators and developers. Each of
        these stages widens credential exposure. Logs often outlive the credentials
        they contain; a token expired weeks ago may still appear in logs that are
        queryable today. Application logs are also a common breach target; an attacker
        who reads logs reads every credential logged ever.
