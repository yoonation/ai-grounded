    - id: authentication.mfa-factor-selection_rationale
      name: rationale
      prose: MFA factor selection determines the authenticator assurance level achievable
        by the authenticated session. Different factor types provide different phishing
        resistance, different recovery flow complexity, and different regulatory acceptability.
        The most common substrate failure mode is defaulting to SMS-based codes because
        they are familiar and easy to implement. SMS suffers from SIM-swap attacks,
        telco SS7 vulnerabilities, and carrier-dependency. NIST SP 800-63B-4 explicitly
        does NOT permit SMS as an OOB authenticator at AAL2 or higher as of the 2024
        revision. Defaulting to SMS without analyzing whether it meets the application's
        assurance level requirements is the failure mode this rule prevents. Making
        this choice without explicit analysis forces the team into the SMS-default
        pattern. An explicit documented decision forces them to consider their threat
        model (is phishing in scope? is SIM-swap in scope?), their regulatory context
        (which AAL is required?), and their user population (can users use modern
        authenticators?). This rule is judgmental because the right answer depends
        on context. The substrate provides analysis of each factor option but does
        not prescribe a single choice. The substrate does require that the choice
        be deliberate and that substrate-discouraged choices be justified.
