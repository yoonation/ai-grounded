  - id: authentication.mfa-on-privileged-operations
    class: substrate-rule
    title: Privileged operations require fresh multi-factor authentication independent
      of session validity
    props:
    - name: rule-id
      ns: governance-commons
      value: authentication.mfa-on-privileged-operations
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
