      prose: The application does not contain authentication credential values as
        string literals in source code. Credentials include API keys, passwords, cryptographic
        keys, JWT signing secrets, database connection passwords, OAuth client secrets,
        webhook signing secrets, encryption keys, and any other secret value whose
        disclosure compromises authentication or authorization. Credentials are supplied
        at runtime from environment variables, secrets management services, encrypted
        configuration files, or hardware secure modules.
    - id: authentication.no-hardcoded-credentials_rationale
      name: rationale
      prose: Source code travels widely. It is read by every developer on the team,
        stored in every contributor's git clone, served to CI agents, mirrored to
        backup services, indexed by code search tools, and (when public) crawled by
        automated secret scanners that actively search public repositories for credentials.
        A credential committed to source code is a credential disclosed broadly. Worse,
        source code persists. Even after rotation, the old credential remains in git
        history (rebase does not erase distributed history; force-push does not erase
        clones; rewritten history does not erase CI logs that captured the file).
        Practical remediation of a leaked credential requires rotation plus audit,
        not removal from history. Externalizing credentials separates the secret's
        lifecycle from the code's lifecycle. The code can be public; the credential
        remains private.
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V14 (Configuration) and V51 (JWT) requirements on credential
        externalization
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x22-V14-Config.md
    - rel: authoritative-source
      text: CWE-798 Use of Hard-coded Credentials
      href: https://cwe.mitre.org/data/definitions/798.html
  - id: authentication.password-hashing
    class: substrate-rule
    title: Password storage uses an approved, computationally intensive password hashing
      function
    props:
    - name: rule-id
      ns: governance-commons
      value: authentication.password-hashing
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: critical
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-916
    - name: cwe
      ns: governance-commons
      value: CWE-327
    - name: cwe
      ns: governance-commons
      value: CWE-256
    - name: cwe
      ns: governance-commons
      value: CWE-261
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-with-credentials
    parts:
    - id: authentication.password-hashing_smt
      name: statement
      prose: 'The application stores user passwords exclusively using an approved
        password hashing function. Approved functions are computationally intensive
        by design and produce irreversible output. Approved functions as of substrate
        version 0.1.0: Argon2id, bcrypt, scrypt, and PBKDF2. Each stored password
        value incorporates a unique salt generated by the hashing library. The application
        does not use general-purpose cryptographic hashes such as MD5, SHA-1, SHA-256,
        or SHA-512 for password storage. The application does not store passwords
        in plaintext. The application does not store passwords under reversible encryption.'
    - id: authentication.password-hashing_rationale
      name: rationale
      prose: Password storage is the canonical authentication concern. A breach of
        the password database is the most common attacker objective and the most damaging
        authentication outcome. Plaintext storage means every user account is compromised
        on breach. Fast hashes (MD5, SHA-1, SHA-256) allow attackers to crack substantial
        portions of leaked databases within hours using commodity GPU hardware. Slow,
        memory-hard hashes (Argon2id, bcrypt, scrypt, PBKDF2) raise per-hash attack
        cost by orders of magnitude. The mechanical nature of the rule (algorithm
        choice and salt usage) makes it Layer 1 checkable. Parameter tuning (work
        factor, memory cost) is Layer 2 review.
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0-6.6.2 (Password storage hashing algorithm requirement)
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x15-V6-Authentication.md
    - rel: authoritative-source
      text: NIST SP 800-63B-4 Section 5.1.1.2 (Memorized Secret Verifiers; password
        hashing requirements)
      href: https://pages.nist.gov/800-63-4/sp800-63b.html
  - id: authentication.password-policy
    class: substrate-rule
    title: Password policy enforces minimum length and screens against breached-password
      corpus
    props:
    - name: rule-id
      ns: governance-commons
      value: authentication.password-policy
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-521
    - name: cwe
      ns: governance-commons
      value: CWE-262
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-with-passwords
    parts:
    - id: authentication.password-policy_smt
      name: statement
      prose: 'Passwords accepted by the application satisfy a minimum-length requirement
        (substrate-recommended: 12 characters, with absolute floor 8) and are screened
        against a current breach corpus (substrate-recommended: HaveIBeenPwned Pwned
        Passwords API or equivalent local k-anonymity lookup). The policy does not
        impose composition requirements (mandatory uppercase, number, symbol), does
        not impose periodic mandatory expiration, and does not restrict maximum length
        below 64 characters.'
    - id: authentication.password-policy_rationale
      name: rationale
      prose: Modern password guidance (NIST SP 800-63B-4) replaces composition rules
        with length and breach screening. Composition rules produce predictable substitutions
        (Pa$$w0rd1) that attacker rules handle; length defeats brute-force more effectively
        than character mixing; breach screening catches the credentials that attackers
        already know. Mandatory periodic expiration (every 90 days, etc.) reliably
        produces weaker passwords because users make minimal changes to their existing
        memorable passwords (winter2025 to spring2026). Expiration should be triggered
        only on credible compromise signal, not on a calendar. Maximum length restrictions
        below 64 characters discriminate against passphrases. The substrate permits
        arbitrary length up to bcrypt's 72-byte limit (and Argon2id has no practical
        limit).
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V6.1 (Password Security) requirements
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x15-V6-Authentication.md
    - rel: authoritative-source
      text: NIST SP 800-63B-4 Section 5.1.1 (Memorized Secret) length and screening
        requirements
      href: https://pages.nist.gov/800-63-4/sp800-63b.html
    - rel: authoritative-source
      text: CWE-521 Weak Password Requirements
      href: https://cwe.mitre.org/data/definitions/521.html
  - id: authentication.rate-limiting
    class: substrate-rule
    title: Authentication endpoints implement rate limiting that prevents credential
      stuffing and brute force attacks
    props:
    - name: rule-id
      ns: governance-commons
      value: authentication.rate-limiting
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-307
    - name: cwe
      ns: governance-commons
      value: CWE-799
    - name: cwe
      ns: governance-commons
      value: CWE-770
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: network-accessible-authentication
    parts:
    - id: authentication.rate-limiting_smt
      name: statement
      prose: Authentication endpoints (login, password reset, MFA challenge, token
        endpoints, account recovery) implement rate limiting that constrains the rate
        at which requests are accepted. Rate limiting operates at both per-source
        (typically per-IP) and per-target (per-account or per-credential) granularities.
        The limits are tuned to the application's threat model with the substrate-recommended
        starting points described in the guidance section. The rate-limit response
        is uniform with respect to authentication outcome (does not signal whether
        credentials would have been correct).
    - id: authentication.rate-limiting_rationale
      name: rationale
      prose: 'Rate limiting is the substrate''s primary defense against credential
        stuffing and brute force attacks. Credential stuffing tests breached credential
        pairs against the application at scale; without rate limiting an attacker
        can test millions of pairs quickly and identify the small percentage that
        succeed. Brute force tests passwords against known accounts; without rate
        limiting weak passwords fall within minutes. Rate limiting is Layer 2 rather
        than Layer 1 because detection requires semantic understanding: which endpoints
        are authentication endpoints (framework-specific routing knowledge), whether
        the rate-limit configuration is appropriate (judgment about application risk
        profile), and whether all auth paths are covered (cross-endpoint review).
        Semgrep cannot reliably make these determinations.'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V6 (Authentication) rate limiting requirements
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x15-V6-Authentication.md
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V11 (Business Logic) anti-automation requirements
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x19-V11-BussLogic.md
    - rel: authoritative-source
      text: CWE-307 Improper Restriction of Excessive Authentication Attempts
      href: https://cwe.mitre.org/data/definitions/307.html
    - rel: authoritative-source
      text: CWE-799 Improper Control of Interaction Frequency
      href: https://cwe.mitre.org/data/definitions/799.html
  - id: authentication.session-regeneration
    class: substrate-rule
    title: Session identifiers are regenerated at authentication and privilege-boundary
      crossings
    props:
    - name: rule-id
      ns: governance-commons
      value: authentication.session-regeneration
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-384
    - name: cwe
      ns: governance-commons
      value: CWE-613
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-with-sessions
    parts:
    - id: authentication.session-regeneration_smt
      name: statement
      prose: The application generates a new session identifier on every authentication
        event (login completion, MFA challenge completion, step-up authentication
        completion) and on privilege-boundary crossings (admin role acquisition, sensitive-area
        entry). The pre-event session identifier is invalidated; subsequent requests
        presenting the old identifier are unauthenticated.
    - id: authentication.session-regeneration_rationale
      name: rationale
      prose: Session fixation works by the attacker setting the victim's session identifier
        before authentication (via XSS, network injection, malicious link with session-ID
        parameter, or other channels). When the victim authenticates and the application
        does not rotate the session identifier, the attacker holds a valid authenticated
        session. Rotation defeats fixation because the attacker-set identifier becomes
        useless the moment authentication completes; the authenticated session lives
        at a new identifier the attacker does not know. Rotation at privilege boundaries
        (admin elevation, sensitive-area entry) similarly defeats lateral escalation.
        If the user's session is partially compromised at low privilege, the rotation
        on elevation forces the attacker to re-compromise to follow.
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V7 (Session Management) session-identifier rotation
        requirements
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x16-V7-Session-Management.md
    - rel: authoritative-source
      text: CWE-384 Session Fixation
      href: https://cwe.mitre.org/data/definitions/384.html
  - id: authentication.timing-safe-comparison
    class: substrate-rule
    title: Credential comparison uses a timing-safe equality function
    props:
    - name: rule-id
      ns: governance-commons
      value: authentication.timing-safe-comparison
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-208
    - name: cwe
      ns: governance-commons
      value: CWE-203
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-with-credentials
    parts:
    - id: authentication.timing-safe-comparison_smt
      name: statement
      prose: Comparison of credential material uses a constant-time (timing-safe)
        equality function provided by the language standard library or a well-audited
        cryptographic library. Credential material includes API key comparisons, token
        comparisons, MAC and HMAC signature comparisons, password hash comparisons,
        and any other security-sensitive equality check whose timing leaks information
        about the secret value.
    - id: authentication.timing-safe-comparison_rationale
      name: rationale
      prose: 'Language string equality short-circuits at the first differing byte.
        An attacker who can submit candidate credentials and measure response time
        can deduce the correct credential one byte at a time: the request whose first
        byte matches takes slightly longer than requests whose first byte mismatches.
        Across many samples (and network noise can be filtered with statistical techniques),
        the attacker recovers the credential. Constant-time comparison functions perform
        the same amount of work regardless of where the inputs differ. Timing carries
        no information about the secret value.'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V6 timing-attack resistance requirements
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x15-V6-Authentication.md
    - rel: authoritative-source
      text: CWE-208 Observable Timing Discrepancy
      href: https://cwe.mitre.org/data/definitions/208.html
  - id: authentication.token-expiration
    class: substrate-rule
    title: Authentication tokens have an explicit expiration set at issuance
    props:
    - name: rule-id
      ns: governance-commons
      value: authentication.token-expiration
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-613
    - name: cwe
      ns: governance-commons
      value: CWE-384
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-with-tokens
    parts:
    - id: authentication.token-expiration_smt
      name: statement
      prose: Every token issued by the application for authentication purposes carries
        an explicit expiration time established at issuance. Token types include session
        tokens, JWTs, OAuth access tokens, OAuth refresh tokens, password reset tokens,
        email verification tokens, magic link tokens, and any other token whose presentation
        authenticates the bearer. The expiration time is enforced at verification.
    - id: authentication.token-expiration_rationale
      name: rationale
      prose: 'Token expiration limits the blast radius of token compromise. A token
        leaked through any channel (log leakage, browser history, third-party breach,
        phishing) authenticates only until expiration. Without expiration, a single
        leak grants indefinite access. Expiration is also defense in depth against
        detection gaps: a compromise that goes undetected for 30 days is bounded if
        the token expires within those 30 days.'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V7 (Session Management) and V51 (Self-contained Tokens,
        JWT) expiration requirements
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x16-V7-Session-Management.md
    - rel: authoritative-source
      text: CWE-613 Insufficient Session Expiration
      href: https://cwe.mitre.org/data/definitions/613.html
