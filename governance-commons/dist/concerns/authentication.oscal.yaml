    - id: authentication.no-credentials-in-urls_smt
      name: statement
      prose: The application does not transmit authentication credentials in URL query
        strings, URL paths, or URL fragments. Credentials include passwords, API keys,
        session tokens, JWT tokens, OAuth access tokens, OAuth refresh tokens, password
        reset tokens, email verification tokens, and any other material whose disclosure
        grants authentication. Credentials are transmitted in Authorization headers,
        POST request bodies, or secure cookies.
    - id: authentication.no-credentials-in-urls_rationale
      name: rationale
      prose: URLs are logged in many places by default. Web servers log full URLs
        including query strings. Reverse proxies, load balancers, CDNs, and observability
        tooling similarly log URLs. Browsers store URLs in history. When the user
        navigates from one site to another, the Referer header contains the source
        URL, leaking credentials to the destination site. Application analytics and
        error monitoring tools often capture URLs in their telemetry. Credentials
        in URLs leak to all of these locations passively, with no active attacker
        involvement required.
