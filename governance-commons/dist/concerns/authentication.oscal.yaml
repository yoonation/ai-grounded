      value: any-with-authentication
    parts:
    - id: authentication.generic-failure-responses_smt
      name: statement
      prose: 'Authentication endpoints return failure responses that do not distinguish
        between cause categories. Cause categories include: account does not exist,
        password incorrect for existing account, account locked, account disabled,
        account not yet verified, MFA challenge required, MFA challenge failed. All
        cause categories return the same response status, same response body, and
        the same response time. The application reveals cause to the user only through
        the dedicated account-recovery flow that itself does not leak existence.'
    - id: authentication.generic-failure-responses_rationale
      name: rationale
      prose: 'Distinguishing cause categories enables user enumeration: an attacker
        submits candidate usernames or email addresses to the login endpoint and observes
        which receive ''user not found'' versus ''incorrect password''. The enumeration
        is the input to targeted attacks like credential stuffing (testing breached
        passwords against confirmed accounts) and targeted phishing. Time-equivalent
        responses prevent the same enumeration through timing channels. A login flow
        that performs a database lookup but skips password verification when the user
        does not exist runs substantially faster on missing accounts. The application
        performs the verification path unconditionally so timing carries no signal.'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V6 requirements on authentication response uniformity
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x15-V6-Authentication.md
    - rel: authoritative-source
      text: CWE-203 Observable Discrepancy
      href: https://cwe.mitre.org/data/definitions/203.html
