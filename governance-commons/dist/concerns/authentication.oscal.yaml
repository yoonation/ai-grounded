    - id: authentication.account-lockout_smt
      name: statement
      prose: Account lockout (triggered when authentication.rate-limiting per-account
        thresholds are exceeded) is bounded in duration and supports self-service
        recovery. Lockout duration is at most 30 minutes for standard accounts. Self-service
        recovery is available through the password reset flow, which itself is rate-limited
        per authentication.rate-limiting. Lockout does not signal its state in authentication
        responses (preserving authentication.generic-failure-responses).
    - id: authentication.account-lockout_rationale
      name: rationale
      prose: 'Permanent lockout requiring administrative intervention has two failure
        modes: it enables denial-of-service attacks (attacker triggers lockout for
        legitimate users by submitting failed logins targeting them) and it creates
        support burden that scales poorly. Time-bounded lockout solves both problems.
        The lockout window is long enough to defeat the attack (15-30 minutes prevents
        the attacker from trying many candidates) but short enough that legitimate
        users self-recover. Self-service recovery through password reset handles the
        case where the user has forgotten their password and the lockout window is
        irrelevant. Password reset is itself rate-limited so it cannot become a lockout
        bypass.'
