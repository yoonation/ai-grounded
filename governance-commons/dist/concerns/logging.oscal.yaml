  - id: logging.retention-policy
    class: substrate-rule
    title: Log retention follows a documented policy with bands tuned to operational,
      compliance, and forensic needs
    props:
    - name: rule-id
      ns: governance-commons
      value: logging.retention-policy
    - name: layer
      ns: governance-commons
      value: semantic
