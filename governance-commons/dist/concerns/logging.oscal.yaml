  - id: logging.redaction
    class: substrate-rule
    title: Sensitive data is redacted from log records by an explicit, reviewed strategy
      applied at the call site and at the pipeline
    props:
    - name: rule-id
      ns: governance-commons
      value: logging.redaction
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
