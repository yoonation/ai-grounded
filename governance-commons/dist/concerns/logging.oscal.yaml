      ns: governance-commons
      value: maintainability
    - name: severity
      ns: governance-commons
      value: medium
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-778
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: logging.severity-levels_smt
      name: statement
      prose: Every log record carries a structured severity field whose value is drawn
        from a finite documented vocabulary. The substrate-recommended vocabulary
        is the OpenTelemetry Logs severity scale (TRACE, DEBUG, INFO, WARN, ERROR,
        FATAL) or the RFC 5424 Syslog vocabulary (debug, info, notice, warning, error,
        critical, alert, emergency); consumers may use a subset of either. Calls to
        language-builtin output functions (print, console.log) and to logger methods
        whose severity is implied by the method name (logger.debug, logger.info) are
        equivalent at the output level; both produce a record with a severity field.
        Custom severity vocabularies are documented in the consumer's logging ADR
        (logging.architecture) and remain stable across application code.
    - id: logging.severity-levels_rationale
      name: rationale
      prose: 'Severity is the field on which every operational workflow filters: incident
        response queries for ERROR and above; alerting fires on FATAL and CRITICAL;
        cost-management dashboards trim DEBUG and TRACE; SOC workflows route different
        severities to different response paths. A log stream without a severity field
        is a log stream that defeats these workflows; a log stream with an inconsistent
        severity vocabulary produces correctness problems when filters miss events
        that should have surfaced. The substrate prefers standards-aligned vocabularies
        because the receiving aggregators (Splunk, Datadog, Elastic, GCP Cloud Logging,
        Azure Monitor, AWS CloudWatch) have built-in handling for them. Custom vocabularies
        force per-consumer aggregator configuration and create cross-team friction
        when logs from multiple systems converge.'
    links:
    - rel: authoritative-source
      text: RFC 5424 The Syslog Protocol (severity vocabulary, Section 6.2.1)
      href: https://datatracker.ietf.org/doc/html/rfc5424
    - rel: authoritative-source
      text: OWASP Logging Cheat Sheet (event severity attribution)
      href: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    - rel: authoritative-source
      text: OpenTelemetry Logs Data Model (severity field, severity number mapping)
      href: https://opentelemetry.io/docs/specs/otel/logs/data-model/
  - id: logging.structured-format
    class: substrate-rule
    title: Application log output uses a structured format (JSON or key-value) rather
      than free-form prose
    props:
    - name: rule-id
      ns: governance-commons
      value: logging.structured-format
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
      ns: governance-commons
      value: maintainability
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-778
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-production
    parts:
    - id: logging.structured-format_smt
      name: statement
      prose: Every log statement emitted from production code uses a structured logger
        whose output is machine-parseable without bespoke regex. The substrate-recommended
        output format is JSON; key-value (logfmt) is substrate-acceptable when the
        consumer's downstream pipeline requires it. Free-form prose log output (Python's
        print, JavaScript's console.log, Go's fmt.Println, Ruby's puts, Java System.out.println,
        or any logger configured to emit prose-only output without a structured layout)
        is prohibited in code paths that reach production.
    - id: logging.structured-format_rationale
      name: rationale
      prose: 'Structured logs are the substrate''s load-bearing assumption for every
        subsequent logging rule. Retention policies (logging.retention-policy) require
        records have a stable identity for retention-band classification. Integrity
        attestation (logging.integrity) requires per-record serialization that downstream
        tooling can hash. Redaction (logging.redaction) requires field-level access
        to the record''s content. Aggregation readiness (LOG-L2- 004) requires the
        indexer treat each log as a typed document. None of these are achievable on
        free-form prose without authoring per-application parsers that themselves
        become maintenance burden and produce ambiguity at parse failure. The substrate-recommended
        structured logger families are: structlog and the stdlib logging module with
        a JSON formatter (Python); pino, winston, or bunyan (Node.js); zap or zerolog
        (Go); slf4j with logstash encoder (Java/JVM); semantic_logger or lograge (Ruby);
        serilog (.NET). The substrate does not mandate a specific library; it mandates
        the output property.'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V11 Logging and Error Handling (structured logging requirement)
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x20-V11-BusLogic.md
    - rel: authoritative-source
      text: OWASP Top 10 2021 A09 Security Logging and Monitoring Failures (insufficient
        logging context)
      href: https://owasp.org/Top10/A09_2021-Security_Logging_and_Monitoring_Failures/
    - rel: authoritative-source
      text: OWASP Logging Cheat Sheet (event log format guidance)
      href: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    - rel: authoritative-source
      text: NIST SP 800-92 Guide to Computer Security Log Management (log format and
        consistency)
      href: https://csrc.nist.gov/publications/detail/sp/800-92/final
    - rel: authoritative-source
      text: CWE-778 Insufficient Logging
      href: https://cwe.mitre.org/data/definitions/778.html
