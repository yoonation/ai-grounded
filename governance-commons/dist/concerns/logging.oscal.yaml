    parts:
    - id: logging.integrity_smt
      name: statement
      prose: 'Logs carrying security-relevant events are protected against tampering
        by one or more of the substrate-recognized integrity mechanisms: append-only
        or write-once log stores (cloud-native log services with immutability configured,
        object-lock storage with governance or compliance retention), per-record or
        per-segment hash chains with periodic publication of the chain head to an
        external attestation service, shipping to a centralized SIEM with administrative
        isolation from application teams, signed log records produced by a trusted
        shipper. The chosen mechanism is documented in the logging architecture ADR
        (logging.architecture) and is verifiable: the substrate''s review checklist
        asks reviewers to confirm the mechanism is configured, not merely intended.'
    - id: logging.integrity_rationale
      name: rationale
      prose: 'The threat model for log integrity is concrete: an attacker who compromises
        an application host attempts to remove evidence of compromise from local logs
        before exfiltration is noticed; an insider with application administrative
        access edits or deletes logs that would document their actions; a compromise
        of the log aggregator itself permits retroactive log modification. Each of
        these is a documented attack pattern. The substrate accepts several mechanisms
        because the appropriate choice depends on threat model and operational maturity.
        Append-only cloud storage with object-lock is the lowest-operational-overhead
        option (the consumer''s aggregator does the work) and is suitable when the
        aggregator is administratively isolated. Hash chains with external publication
        (rfc6962-style or similar) provide cryptographic attestation but require more
        infrastructure. SIEM centralization with isolation provides defense-in-depth
        when the application team has different privileges than the security team.
        Signed records provide per-record provenance and survive aggregator compromise.
        The rule is explicit that the mechanism is configured, not merely available.
        Many aggregators support immutability flags but ship with the flag unset;
        the review checklist verifies the actual configuration matches the policy.'
    links:
    - rel: authoritative-source
      text: NIST SP 800-53 Rev 5 AU-9 Protection of Audit Information; AU-10 Non-Repudiation
