    parts:
    - id: backup-recovery.strategy-adr_smt
      name: statement
      prose: 'The consumer MUST decide and record, in an Architecture Decision Record,
        its backup-and-recovery strategy. The ADR MUST address, at minimum: the protection
        inventory and tiers (deferring classification to data-classification); the
        backup topology (full and incremental, on-site and off-site, cross-region,
        and the keep-multiple-copies discipline); the retention and immutability policy;
        the recovery point and recovery time objectives per tier; the restore-verification
        cadence; the encryption and key-custody boundary (deferring handling to secrets-management);
        the destructive-operation guard convention; and ownership and review cadence.'
    - id: backup-recovery.strategy-adr_rationale
      name: rationale
      prose: 'The backup-and-recovery decisions are interlocking and durable, and
        they are expensive to reconstruct after the fact. The strategy is the place
        where the consumer decides the surface the lower-layer rules then police:
        what must be protected and how well, how long copies are kept and how immutable
        they are, how much data loss and downtime each tier tolerates, how restores
        are proven, and where the boundaries with data-classification, reliability,
        monitoring-alerting, infrastructure-misconfiguration, and secrets-management
        sit. Recording it once lets every service inherit one coherent recovery discipline
        and lets reviewers check a backup against a written standard rather than relitigating
        the basics each time.'
