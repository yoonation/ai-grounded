        up the information the system requires to recover.
      href: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
  - id: backup-recovery.guarded-destructive-operation
    class: substrate-rule
    title: An irreversible bulk-data-destruction operation is not executed unguarded
      in application or migration code
    props:
    - name: rule-id
      ns: governance-commons
      value: backup-recovery.guarded-destructive-operation
    - name: layer
