    parts:
    - id: backup-recovery.backup-retention-set_smt
      name: statement
      prose: Every backup, snapshot, or backup-policy resource declared in infrastructure-as-code
        MUST set an explicit retention or expiration that is greater than zero and
        is not disabled. A declared backup resource that omits a retention setting,
        sets it to zero, or explicitly disables expiration in a way that prevents
        a recoverable copy from being kept is a violation.
    - id: backup-recovery.backup-retention-set_rationale
      name: rationale
      prose: 'The most common way a backup regime fails is not a missing backup but
        a backup that is not kept. A snapshot schedule with no retention, a lifecycle
        rule that expires the only copy immediately, or a backup plan whose retention
        field was dropped when the block was copied from another resource all produce
        the same outcome: at the moment of need there is no copy old enough to restore.
        Requiring a positive, non-disabled retention at declaration time makes the
        keep-the-copy decision explicit and reviewable, and gives the higher-layer
        rules a copy to verify and to measure against the recovery objectives.'
    links:
    - rel: authoritative-source
      text: NIST SP 800-53 Rev. 5, control CP-9 (system backup), including the retention
        of backup copies adequate to recovery objectives.
      href: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
    - rel: authoritative-source
      text: NIST SP 800-34 Rev. 1, on backup-storage strategy and the retention of
        recoverable copies as part of contingency planning.
      href: https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
  - id: backup-recovery.coverage-and-objectives
