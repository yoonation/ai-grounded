      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: backup-recovery.guarded-destructive-operation_smt
      name: statement
      prose: An irreversible bulk-data-destruction operation in first-party application
        code, database migration scripts, or operational scripts MUST NOT be executed
        unconditionally. A destructive operation (a schema or table drop, a truncate,
        a delete without a scoping predicate, a recursive force-delete of a data path,
        or a force-destroy of a data store) that appears with no interposed guard,
        snapshot precondition, or substrate-recognized safeguard is a violation.
    - id: backup-recovery.guarded-destructive-operation_rationale
      name: rationale
      prose: 'Backups protect against most data loss, but the cheapest and most preventable
        loss is the destructive operation that runs without anyone meaning it to:
        a migration that drops before it should, a cleanup script with an unscoped
        delete, a teardown that force-destroys the wrong store. Requiring that destruction
        pass through a guard (an explicit confirmation, a snapshot-first step, a dry-run
        gate, or a recognized safe-delete wrapper) interposes a deliberate point of
        control at the exact place the loss originates, and makes the difference between
        intended and accidental destruction visible in review. The guard does not
        replace the backup; it prevents the avoidable loss the backup would otherwise
        have to recover from.'
    links:
    - rel: authoritative-source
      text: NIST SP 800-34 Rev. 1, on protecting data against loss and the recoverability
        of information as a contingency-planning objective.
      href: https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final
    - rel: authoritative-source
      text: NIST SP 800-53 Rev. 5, control CP-10 (system recovery and reconstitution),
        on returning data to a known state after loss or destruction.
      href: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
  - id: backup-recovery.restore-verification
    class: substrate-rule
    title: Backups are proven recoverable by a scheduled restore test; an untested
      backup is treated as no backup
    props:
    - name: rule-id
