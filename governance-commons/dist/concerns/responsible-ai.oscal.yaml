    - id: responsible-ai.data-governance_smt
      name: statement
      prose: The training and evaluation data is documented in its provenance, composition,
        collection method, and known gaps; its composition is representative of the
        population the system will serve, or the gaps are recorded and accounted for;
        and its use is consistent with the basis on which it was collected. Where
        the data carries a sensitivity class, its handling is owned by data-classification;
        where it is personal, its lawful basis and purpose limitation are owned by
        privacy. The data governance is reviewed when a new dataset is introduced
