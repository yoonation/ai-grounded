    parts:
    - id: responsible-ai.fairness-objective_smt
      name: statement
      prose: 'A fairness objective is chosen and recorded for the system: the fairness
        criterion it targets and why that criterion fits the use (the trade-off among
        parity of outcomes, parity of error rates, and calibration made explicit),
        the groups across which fairness is measured, the metric and the acceptable
        disparity threshold, and the mitigation approach where the objective is not
        met. The responsible-ai.fitness-evaluation disaggregated evaluation measures
        against this objective and the responsible-ai.responsible-ai-policy policy
        records the commitment. The decision is revisited when the use, the population,
        or the model changes materially.'
    - id: responsible-ai.fairness-objective_rationale
      name: rationale
      prose: Because the formal fairness criteria cannot be satisfied simultaneously,
        fairness is a choice the system must make and defend rather than a box it
        can tick, and leaving it unmade does not avoid the choice, it defaults it
        to whatever the data produced. Naming the criterion, the groups, the metric,
        the threshold, and the mitigation turns fairness from an implicit accident
        into an explicit, measurable, contestable commitment, and it gives the responsible-ai.fitness-evaluation
        evaluation a target. The substrate makes this an L3 ADR because the choice
        among incompatible definitions is a real trade-off with no universally correct
        answer, and pairs it with a MADR that structures the trade-off.
