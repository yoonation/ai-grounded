    parts:
    - id: responsible-ai.explanation-and-recourse_smt
      name: statement
      prose: A significant automated decision affecting a person (one with a material
        effect on that person) provides an explanation meaningful to the affected
        person, naming the principal factors, and a route to human review or contestation
        that is reachable and acted upon. The disclosure of responsible-ai.ai-disclosure-marker
        is present so the person knows the decision was automated. The oversight mode
        the decision class requires is decided in responsible-ai.human-oversight;
        the human gate on a consequential agent action is owned by agentic-systems.
        The explanation and recourse are reviewed when a new person-affecting decision
        is automated.
    - id: responsible-ai.explanation-and-recourse_rationale
      name: rationale
      prose: 'A decision a person cannot understand and cannot challenge is a decision
        that has placed itself beyond accountability, and when that decision materially
        affects the person the loss of recourse is the harm. A meaningful explanation
        (the factors that drove the outcome, in terms the person can act on, not the
        raw weights) and a reachable contestation route are what return the person
        to the loop. The substrate scopes the rule to significant, person-affecting
        decisions to avoid demanding explanation of trivial automation, keeps it at
        L2 because the significance and the meaningfulness are judgments, and draws
        the seam to agentic-systems clearly: this concern governs the explanation
        and contestability of a decision, the agent concern governs the human gate
        on an action.'
    links:
    - rel: authoritative-source
      text: EU AI Act Regulation 2024/1689 (Article 14 human oversight and the explanation
        and recourse expectations for high-risk systems, referenced as a concept)
      href: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    - rel: authoritative-source
      text: NIST AI Risk Management Framework (the GOVERN and MAP functions, accountability
