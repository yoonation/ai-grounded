        protection. The substrate makes the presence of a disclosure marker a mechanical
        floor because an AI-output path that attaches none is statically visible and
        the fix is local, while whether the disclosure is adequate (clear, prominent,
        not buried) is a review judgment. The rule nudges toward attaching the disclosure
        on a shared output wrapper so it cannot be forgotten per endpoint.
