    parts:
    - id: responsible-ai.model-provenance_smt
      name: statement
      prose: 'A deployed model records its lineage and exposes it: the model version
        or identifier, a reference to the training-data snapshot it was trained on,
        and a reference to the evaluation run and its results, bound to the artifact
        actually serving and queryable at incident time. A rollback can target a specific
        prior version. The cryptographic attestation and signing of the model artifact
        is owned by supply-chain. The lineage is reviewed when a new model version
        is deployed.'
    - id: responsible-ai.model-provenance_rationale
      name: rationale
      prose: 'A deployed model with no lineage is a model that cannot be investigated:
        when it regresses or draws a fairness complaint, nobody can say which version
        it was, what data shaped it, or whether it passed evaluation, and so nobody
        can confidently roll back or hold it accountable. Recording the version, the
        training-data snapshot, and the evaluation reference, bound to the serving
        artifact, is what makes the model an investigable object rather than an opaque
        endpoint. The substrate keeps the rule at medium because the cost lands at
        incident time, at L2 because completeness and correct binding are a pipeline
        review, and defers the artifact attestation to supply-chain.'
    links:
