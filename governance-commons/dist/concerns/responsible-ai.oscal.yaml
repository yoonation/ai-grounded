    parts:
    - id: responsible-ai.output-safety_smt
      name: statement
      prose: 'The output path applies the output-safety controls the system''s harms
        require before content reaches a person or a downstream action: content filtering
        scaled to what the system can emit, groundedness or citation checks where
        the system answers from a source, and a defined refusal or escalation behavior
        for out-of-policy requests. The controls are tested with adversarial and edge-case
        prompts. The input-boundary defense against prompt injection is owned by input-validation
        and agentic-systems; this rule owns the output side. The controls are reviewed
        when a new output path or capability is introduced.'
    - id: responsible-ai.output-safety_rationale
      name: rationale
      prose: The output is the point where a model's latent risk becomes a person's
        concrete harm, and it is the last place to intervene, which is why the output-safety
        controls are load-bearing. Content filtering bounds what can be emitted, groundedness
        checks bound how confidently the system can assert something it cannot support,
        and a refusal behavior bounds what the system will do with a request it should
        decline. The substrate scopes the controls to the system's actual harms rather
        than prescribing a fixed filter, keeps the rule at L2 because the adequacy
        judgment requires knowing what the system can output, and is explicit that
        the input side is a different concern's job.
    links:
    - rel: authoritative-source
      text: NIST AI Risk Management Framework (the MANAGE and MEASURE functions, managing
        AI risks that manifest in outputs, referenced as a concept)
      href: https://www.nist.gov/itl/ai-risk-management-framework
    - rel: authoritative-source
      text: OWASP Top 10 for LLM Applications (insecure output handling and related
        output-side weaknesses, referenced as a concept)
      href: https://genai.owasp.org/llm-top-10/
  - id: responsible-ai.responsible-ai-policy
    class: substrate-rule
    title: The system has a documented responsible-AI risk-management policy recording
      its intended and prohibited uses, its risk classification, and the responsible-AI
      commitments it conforms to
    props:
    - name: rule-id
      ns: governance-commons
      value: responsible-ai.responsible-ai-policy
    - name: layer
      ns: governance-commons
      value: judgmental
    - name: characteristic
      ns: governance-commons
      value: safety
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: responsible-ai.responsible-ai-policy_smt
      name: statement
      prose: 'The system has a recorded responsible-AI risk-management policy ADR,
        discoverable from its documentation and current relative to the last significant
        change, covering its sub-decisions: the intended and prohibited uses, the
        risk classification that sets the rigor the system needs, the fairness commitment
        (responsible-ai.fairness-objective), the transparency and disclosure commitment,
        the human-oversight model (responsible-ai.human-oversight), the evaluation
        and acceptance criteria, the monitoring and drift-response commitment (responsible-ai.drift-monitoring),
        the incident and feedback handling, and the roles, ownership, and review cadence.
        The local L1 and L2 choices cohere with the policy. The ADR is revisited on
        a periodic cadence and at significant model, data, or regulatory change.'
    - id: responsible-ai.responsible-ai-policy_rationale
      name: rationale
      prose: 'Responsible AI fails as a pile of locally reasonable decisions that
        do not cohere: a model documented but with no stated prohibited use, evaluated
        but against no agreed criteria, deployed but with an oversight level nobody
        chose for its risk. The policy ADR is where the intended and prohibited uses,
        the risk class, and the commitments on fairness, transparency, oversight,
        evaluation, and monitoring are made explicit and owned, and it is the standard
        the eleven conformance rules check against. The substrate requires it to be
        recorded and complete, not long; a low-risk system''s policy is short, but
        it is written down and updatable rather than rediscovered after a harm. It
        is the GOVERN function made concrete for one system.'
    links:
    - rel: authoritative-source
      text: NIST AI Risk Management Framework (the GOVERN function, establishing an
        AI risk-management policy and culture, referenced as a concept)
      href: https://www.nist.gov/itl/ai-risk-management-framework
    - rel: authoritative-source
      text: ISO/IEC 42001 AI management system (an organizational AI policy and management
        system, referenced as a concept)
      href: https://www.iso.org/standard/81230.html
