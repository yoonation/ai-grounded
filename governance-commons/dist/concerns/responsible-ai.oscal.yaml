  - id: responsible-ai.fitness-evaluation
    class: substrate-rule
    title: The system is evaluated for fitness for its intended use, including disaggregated
      performance across the subgroups that matter, before deployment and on significant
      change
    props:
    - name: rule-id
      ns: governance-commons
      value: responsible-ai.fitness-evaluation
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
