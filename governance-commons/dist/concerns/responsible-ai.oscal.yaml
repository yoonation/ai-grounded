    parts:
    - id: responsible-ai.decision-record-keeping_smt
      name: statement
      prose: 'For each significant AI decision, the system records enough to reconstruct
        and review it: a reference to the input or its hash, the model version, the
        output, and any human override or intervention, at a granularity sufficient
        for review and bounded so the record does not itself become an over-broad
        store of sensitive data. The logging mechanism, retention, and integrity are
        owned by logging; the redaction of classified or personal fields is owned
        by data-classification. The record-keeping is reviewed when a new significant
        decision path is added.'
    - id: responsible-ai.decision-record-keeping_rationale
      name: rationale
      prose: 'An AI decision that left no trace cannot be reviewed, and a decision
        that cannot be reviewed cannot be held to account: the complaint, the incident,
        and the audit all need a record of what the system saw, which model acted,
        what it produced, and whether a human stepped in. The substrate requires the
        record to be sufficient to reconstruct the decision and bounded so it does
        not become its own liability, owns that AI-specific requirement here, and
        defers the writing, retention, and redaction of the record to the logging
        and data-classification concerns. It stays at L2 because the right contents
        and granularity are a judgment about the use.'
