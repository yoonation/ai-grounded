    - id: responsible-ai.data-governance_rationale
      name: rationale
      prose: 'The model inherits the properties of its data: its blind spots are the
        data''s gaps, its biases are the data''s skews, and its legitimacy is bounded
        by the basis on which the data was gathered. Documenting provenance and composition
        is what makes those properties visible; assessing representativeness is what
        turns a hidden gap into a recorded limitation; and checking the use against
        the collection basis is what keeps the model lawful and accountable. The substrate
        keeps this an L2 review because the judgments (is this representative, is
        this an appropriate use) require knowledge of the data and the deployment
        context that source does not carry, and it defers the sensitivity-class handling
        and the personal-data obligations to the concerns that own them.'
