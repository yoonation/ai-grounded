        for the admitted tool's scope, and agentic-systems.tool-use-authorization
        for its call-time authorization. The OWASP Agentic Skills Top 10 threats map
        here.
    - id: agentic-systems.tool-and-skill-trust-policy_rationale
      name: rationale
      prose: A skill admitted to an agent runs with the agent's authority, so the
        decision to trust a tool or skill is a decision to extend the agent's reach
        and its attack surface together; an unvetted or dynamically-loaded third-party
        skill is where a supply-chain compromise becomes an agent compromise from
        the inside. The policy is the deliberate admission and vetting decision that
        keeps the tool set trustworthy. The substrate makes this an L3 ADR because
        admission is a trust judgment, cross-references supply-chain for artifact
        provenance, and is the binding point for the OWASP Agentic Skills Top 10.
    links:
