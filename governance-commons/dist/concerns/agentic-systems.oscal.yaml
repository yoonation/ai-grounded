  - id: agentic-systems.instruction-data-separation
    class: substrate-rule
    title: Untrusted content reaching the agent is not executed as agent instructions
      or goals
    props:
    - name: rule-id
      ns: governance-commons
      value: agentic-systems.instruction-data-separation
    - name: layer
      ns: governance-commons
      value: semantic
