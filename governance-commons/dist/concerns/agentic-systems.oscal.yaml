      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: agentic-systems.instruction-data-separation_smt
      name: statement
      prose: The agent maintains a boundary between its trusted instruction channel
        (system prompt, authenticated user request) and untrusted content it ingests
        (retrieved documents, tool and API outputs, web content, prior memory), so
        that ingested content is reasoned about as data and is not obeyed as instructions,
        and so that ingested content cannot on its own expand the agent's authority
        or trigger a consequential tool. The control is mitigation layered with the
        action-side bounds and gate, not a claim that injection is solved. The surrounding
        service input boundary is owned by input-validation and the output-side harm
        controls by responsible-ai, cross-referenced here.
    - id: agentic-systems.instruction-data-separation_rationale
      name: rationale
      prose: 'The agentic loop''s signature vulnerability is that the same channel
        carries both the instructions the agent should follow and the content it should
        merely analyze, so an attacker who controls a retrieved document or a tool
        result can write instructions the agent then follows with its own authority.
        Goal integrity is foundational: subvert it and every downstream control serves
        the attacker. The substrate makes this an L2 review-and-probe rule rather
        than a test because the input space is open-ended and separation is a mitigation,
        and it leans deliberately on the action-side rules as defense in depth. It
        cross-references input-validation and responsible-ai rather than restating
        their boundaries.'
    links:
    - rel: authoritative-source
      text: OWASP Agentic Security Initiative, agentic threats and mitigations (goal
        manipulation and prompt injection in the agent loop, referenced as a concept)
      href: https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/
