      name: statement
      prose: The agent has a recorded tool and skill trust policy ADR, current relative
        to the last significant change, setting which tools and skills it may load
        and invoke, how a tool or skill is vetted before admission (source and provenance,
        declared scope, behavior), the stance on third-party and dynamically-discovered
