      name: rationale
      prose: 'An agent fails as a pile of locally reasonable capability choices that
        do not cohere: tools added one at a time, autonomy extended for convenience,
        a trust boundary nobody drew, until the agent can do far more than anyone
        decided it should. The policy ADR is where the purpose, the authority, the
        trust boundary, and the autonomy bounds are made explicit and owned, and it
        is the standard the conformance rules check against. The substrate requires
        it recorded and complete, not long; a narrow agent''s policy is short, but
        written down and updatable rather than rediscovered after an incident. It
        is the agent-side anchor parallel to the responsible-ai policy for the model.'
