        empty scope rather than omitting the declaration. The presence of a scope
        declaration is the finding; whether the scope is genuinely least-privilege
        is assessed in review (agentic-systems.tool-use-authorization).'
    - id: agentic-systems.tool-authorization-scope_rationale
      name: rationale
      prose: 'Least privilege at the tool-call boundary is a function of a declared
        scope, so a tool with no declared scope is a tool the authorization rule cannot
        constrain. The dominant first failure is not a wrong scope but a missing one:
        a tool registered to an agent during development with full ambient authority
        and never scoped down. The substrate makes the presence of a scope declaration
        a mechanical floor because the absence is statically visible and almost always
        an oversight, while the correctness of the scope is a judgment. The rule is
        deliberately modest about what it proves (a scope is declared, not that it
        is tight) and explicit that the tool-versus-ordinary-function distinction
        makes it heuristic.'
    links:
    - rel: authoritative-source
      text: OWASP Agentic Security Initiative, agentic threats and mitigations (tool
        misuse and excessive agency, referenced as a concept)
      href: https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/
    - rel: authoritative-source
      text: Cloud Security Alliance MAESTRO threat-modeling for agentic systems (tool
        and action layer, referenced as a concept)
      href: https://cloudsecurityalliance.org/research/topics/maestro
  - id: agentic-systems.tool-use-authorization
    class: substrate-rule
    title: Tool-use authorization is enforced at call time against the authority the
      agent was granted
    props:
    - name: rule-id
      ns: governance-commons
      value: agentic-systems.tool-use-authorization
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: safety
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: agentic-systems.tool-use-authorization_smt
      name: statement
      prose: The agent's calls to tools are authorized at call time against the authority
        the agent was granted, the grant is least-privilege for the agent's purpose,
        and where the agent acts on behalf of a user its effective authority does
        not exceed that user's own permissions. The declared tool scope (agentic-systems.tool-authorization-scope)
        is enforced on the call path rather than merely documented. The underlying
        user permissions are owned by authorization and the tool credential by secrets-management,
        cross-referenced here.
    - id: agentic-systems.tool-use-authorization_rationale
      name: rationale
      prose: An agent is dangerous in proportion to what its tools can do, so the
        authority behind each tool call is the control that bounds the blast radius
        when the agent is wrong or subverted. Excessive agency is repeatedly the difference
        between a contained mistake and a destructive one. The substrate makes this
        an L2 review because least privilege for an agent is contextual (it depends
        on the agent's purpose and the systems it touches) and because a declared
        scope that is not enforced at call time gives false assurance. The rule draws
        on the L1 scope-declaration floor and cross-references authorization rather
        than restating the user permission model.
    links:
    - rel: authoritative-source
      text: OWASP Agentic Security Initiative, agentic threats and mitigations (excessive
        agency, tool misuse, and privilege compromise, referenced as a concept)
      href: https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/
    - rel: authoritative-source
      text: Cloud Security Alliance MAESTRO threat-modeling for agentic systems (the
        tool and action layer, referenced as a concept)
      href: https://cloudsecurityalliance.org/research/topics/maestro
