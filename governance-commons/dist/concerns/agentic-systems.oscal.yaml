    parts:
    - id: agentic-systems.delegation-authority_smt
      name: statement
      prose: When an agent delegates to a sub-agent or an agent-backed tool, the delegated
        authority is a subset of the caller's authority and never an expansion, the
        caller's identity and delegation context propagate so the action stays attributable,
        and the tool-use, bounds, and gating controls that applied to the caller are
        preserved across the boundary. The trust model framing who may delegate to
        whom is agentic-systems.multi-agent-trust and the authority being constrained
        is agentic-systems.tool-use-authorization, cross-referenced here.
    - id: agentic-systems.delegation-authority_rationale
      name: rationale
      prose: 'Delegation is where multi-agent systems leak authority: a sub-agent
        spun up with its own broad credentials, or a chain of hand-offs that ends
        with more authority than it began, routes around the controls the originating
        request was subject to. Constraining delegated authority to a subset and carrying
        caller identity is what keeps the controls and the accountability intact across
        the boundary. The substrate makes this an L2 review because the topology and
        authority model are contextual, and it cross-references the trust-model decision
        and the tool-use authority rather than restating them.'
    links:
