        and reversibility that no tool can make. The policy is what turns the gate
        implementation into the right gate. The substrate makes this an L3 ADR because
        the consequential-action line is contextual and consequential to get wrong,
        and pairs it with the gate-implementation rule it drives and the responsible-ai
