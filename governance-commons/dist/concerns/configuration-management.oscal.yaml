    - id: configuration-management.startup-validation_smt
      name: statement
      prose: 'Before the workload begins serving, it validates its configuration:
        every required key is present, every value parses to its declared type, and
        values with constraints (numeric ranges, enumerated choices, URL or host well-formedness,
        mutually-required groups) satisfy them. On any failure the workload refuses
        to start and emits a single aggregated, actionable error that names the offending
        keys, rather than starting and failing later. The validation covers the full
        required set, runs in every environment, and is part of the bootstrap path
        so it cannot be skipped in production.'
    - id: configuration-management.startup-validation_rationale
      name: rationale
      prose: 'The value of validating at startup is locality in time: the failure
        happens at the moment and place the configuration is wrong, not at some later
        request that happens to exercise the unconfigured path. Aggregating the errors
        matters because configuration mistakes cluster (a forgotten environment file
        omits several keys at once), and reporting them one boot at a time turns a
        single fix into a frustrating sequence. Validation also documents the contract:
        the required set and its constraints, expressed as code that runs, are the
        authoritative statement of what the workload needs, which is why configuration-management.no-swallowing-default
        defers the definition of requiredness to this rule.'
    links:
    - rel: authoritative-source
