    parts:
    - id: configuration-management.layering-and-parity_smt
      name: statement
      prose: The configuration system defines and documents the precedence order across
        its sources (for example built-in defaults, then a base configuration file,
        then an environment-specific file, then environment variables, then explicit
        runtime overrides), so the effective source of any value is predictable. The
        set of required configuration keys is the same across all deployment environments,
        enforced by a shared schema or required-key list so a key cannot exist in
        one environment and silently be absent in another. Secrets are never inlined
        into configuration that is committed to source or baked into images; they
        are referenced by indirection (a secret reference, a vault path, or a runtime
        injection handle) and resolved at runtime, with the handling rules owned by
        secrets-management.
    - id: configuration-management.layering-and-parity_rationale
      name: rationale
      prose: 'Implicit precedence is a defect waiting for a coincidence: two sources
        set the same key, and which one wins depends on load order no one wrote down.
        Documenting precedence makes overrides intentional. Environment parity attacks
        the most common configuration incident directly: a value that was only ever
        set in the environment where it was first needed, then missing the day a new
        environment or a failover brings up the workload elsewhere. Requiring secrets
        by reference keeps the configuration surface safe to commit and keeps the
        secrets-management boundary from eroding one convenient paste at a time.'
    links:
    - rel: authoritative-source
      text: 'The Twelve-Factor App, Factor III (Config): one codebase, many deploys
        parameterized by environment-specific config'
      href: https://12factor.net/config
    - rel: authoritative-source
