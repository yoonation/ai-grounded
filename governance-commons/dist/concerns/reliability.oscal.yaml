      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: reliability.failure-isolation_smt
      name: statement
      prose: Shared, finite resources (connection pools, thread pools and executors,
        worker concurrency, rate-limit budgets) are partitioned so that demand from
        one dependency or class of work cannot consume the capacity another class
        needs. Each bounded resource reliability.bounded-buffers requires is sized
        against its workload, and the partitioning ensures that a dependency which
        becomes slow holds only its own partition's capacity while it waits, leaving
        unrelated paths their own. The rule covers the bulkhead boundary (separate
        pools or concurrency limits per dependency or per work class), the sizing
        of each partition, and the producer-side bound (backpressure or admission
        control) that keeps intake within the partition's capacity. The rule does
        not mandate a fixed number of partitions; it requires that the partitioning
        reflect the actual blast-radius boundaries the system needs and that no single
        dependency can drain a pool shared with unrelated work.
    - id: reliability.failure-isolation_rationale
      name: rationale
      prose: 'A ship survives a hull breach because its hold is divided into watertight
        compartments; one flooded compartment does not sink the ship. Shared resource
        pools are the undivided hold: when one dependency floods the pool by holding
        connections through its slow responses, every caller of that pool goes down
        with it, including callers that have nothing to do with the slow dependency.
        The bulkhead pattern restores the compartments. The substrate places this
        at L2 because the right partitioning is contextual: which dependencies deserve
        their own pool, how large each should be, and where the backpressure boundary
        belongs depend on the system''s load shape and criticality map, which a tool
        cannot read. This rule is also where the mechanical bounds of reliability.bounded-buffers
        are reviewed for correct sizing and where the supervision structure of reliability.tracked-async-tasks
        is checked for correct isolation, so the L1 floors and the L2 design meet
        here.'
    links:
    - rel: authoritative-source
      text: The Bulkhead pattern (partition resources so a failure in one partition
        does not exhaust the others; concept reference)
      href: https://learn.microsoft.com/en-us/azure/architecture/patterns/bulkhead
    - rel: authoritative-source
      text: Backpressure (bounding intake to match capacity; the producer-side complement
        to bounded pools; concept reference)
      href: https://en.wikipedia.org/wiki/Backpressure
  - id: reliability.graceful-degradation
    class: substrate-rule
    title: Failure of a non-critical dependency degrades the affected feature gracefully
      rather than failing the whole request or system
    props:
    - name: rule-id
      ns: governance-commons
      value: reliability.graceful-degradation
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: reliability
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: reliability.graceful-degradation_smt
      name: statement
      prose: 'Outbound dependencies are classified by criticality, and the failure
        of a non-critical dependency degrades only the feature it supports rather
        than failing the whole request or system. A critical dependency is one without
        which the operation has no correct result (the primary datastore for a write,
        the payment processor for a purchase); its failure correctly fails the operation.
        A non-critical dependency enriches or decorates but is not essential to the
        core result (recommendations on a product page, avatars in a comment list,
        an analytics or audit-sink emission on a success path); its failure must be
        absorbed with a defined fallback: serve cached or default content, omit the
        optional element, queue the deferred work, or disable the feature, while the
        core operation completes. The rule requires that each dependency''s criticality
        be a deliberate, documented classification and that every non-critical dependency
        have a defined fallback exercised by a test.'
    - id: reliability.graceful-degradation_rationale
      name: rationale
      prose: 'The default behavior of code that calls a dependency and propagates
        its error is to make every dependency critical by omission. That is almost
        never what the product intends: a user who cannot see recommendations can
        still buy, a reader who cannot load an avatar can still read. Graceful degradation
        is the discipline of making the criticality of each dependency an explicit
        decision and giving every non-critical one a fallback, so that the system''s
        failure surface matches its actual essential dependencies rather than its
        incidental ones. The rule is semantic because only a human who understands
        the product can say whether a dependency is essential to a given operation;
        a tool can list the outbound calls but cannot judge which ones the result
        truly needs. It is distinct from the circuit breaker of error-handling.retry-and-circuit-breaker:
        the breaker is the mechanism that detects a failing dependency and stops calling
        it; degradation is the behavior the product exhibits while the breaker is
        open. A breaker with no degradation path still fails the request, just faster.'
    links:
    - rel: authoritative-source
      text: Azure Well-Architected guidance on graceful degradation and self-preservation
        (degrade functionality rather than fail entirely; concept reference)
      href: https://learn.microsoft.com/en-us/azure/well-architected/reliability/self-preservation
    - rel: authoritative-source
      text: Fault tolerance and graceful degradation (a system continuing at reduced
        capability when a part fails; concept reference)
      href: https://en.wikipedia.org/wiki/Fault_tolerance
  - id: reliability.health-signaling
    class: substrate-rule
    title: The service exposes distinct liveness and readiness signals with correct
      semantics, so the orchestrator restarts and routes traffic correctly
    props:
    - name: rule-id
      ns: governance-commons
      value: reliability.health-signaling
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: reliability
    - name: severity
      ns: governance-commons
      value: medium
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: orchestrated
    parts:
    - id: reliability.health-signaling_smt
      name: statement
      prose: 'A service deployed under an orchestrator exposes liveness and readiness
        as distinct signals with distinct semantics. Liveness answers "is this process
        irrecoverably broken and in need of a restart": it reflects only conditions
        a restart can fix (a deadlocked process, an unrecoverable internal state)
        and does not reflect the health of external dependencies, because restarting
        an instance cannot fix a downstream outage and doing so en masse causes a
        restart storm. Readiness answers "can this instance serve traffic right now":
        it reflects whether the instance has completed startup and whether its critical
        dependencies are reachable, so the orchestrator removes an instance from rotation
        when it cannot serve and returns it when it can. Where the platform provides
        a startup signal, slow initialization uses it rather than loosening liveness.
        The rule requires the two signals exist, are separate, and carry these semantics;
        the metrics and alerts derived from them are governed by the observability
        concern, not here.'
    - id: reliability.health-signaling_rationale
      name: rationale
      prose: 'The orchestrator makes two different decisions from health signals (restart
        this instance, route traffic to this instance) and they require opposite responses
        to a dependency outage. If a shared dependency goes down, every instance should
        stop receiving traffic for the affected paths (readiness false) but none should
        be restarted (liveness true), because restarting them cannot help and restarting
        all of them at once removes whatever degraded capacity remained. Wiring dependency
        health into liveness inverts this: a dependency blip triggers a fleet-wide
        restart that converts a recoverable degradation into a self-inflicted outage.
        The substrate places this at L2 because what counts as a restart-worthy condition
        versus a route-away condition, and which dependencies readiness should reflect,
        are judgments about the service''s role that a tool cannot make. The boundary
        with observability is deliberate and stated: this rule governs the probe contract
        and its control-plane effect; the dashboards and alerts on probe state are
        observability.alerting-discipline and observability.dashboard-discipline.'
    links:
    - rel: authoritative-source
      text: 'Kubernetes liveness, readiness, and startup probes (the canonical statement
        of the distinct probe semantics: liveness governs restart, readiness governs
        traffic)'
      href: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
    - rel: authoritative-source
      text: Health Endpoint Monitoring pattern (a service exposes a health endpoint
        a control plane consults; concept reference)
      href: https://learn.microsoft.com/en-us/azure/architecture/patterns/health-endpoint-monitoring
  - id: reliability.idempotency
    class: substrate-rule
    title: Operations that may be retried or redelivered are idempotent or guarded
      by an idempotency key, so a repeat does not double-apply effects
    props:
    - name: rule-id
      ns: governance-commons
      value: reliability.idempotency
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: reliability
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: reliability.idempotency_smt
      name: statement
      prose: 'Any operation that may be applied more than once for a single logical
        intent is idempotent in effect: applying it again with the same inputs produces
        the same end state and does not duplicate side effects. The operations in
        scope are those reachable by a retry (the bounded retries error-handling.retry-and-circuit-breaker
        mandates), by an at-least-once message consumer, by a webhook or callback
        receiver that the sender redelivers, or by a client that may resubmit a request
        whose response it did not receive. Idempotency is achieved by design (the
        operation is naturally idempotent, such as a set-to-value write) or by guard
        (an idempotency key or deduplication token recorded so a repeat is recognized
        and the original outcome returned). Read-only operations and operations provably
        unreachable by any redelivery path are out of scope; the rule does not require
        every function to be idempotent, only those a retry can reach.'
    - id: reliability.idempotency_rationale
      name: rationale
      prose: 'Retries and at-least-once delivery exist because the alternative (giving
        up on the first transient failure, or at-most-once delivery that loses messages)
        is worse. Their price is duplicate application, and that price is only acceptable
        if the operations they target are idempotent. The substrate places this rule
        at L2 rather than L1 because idempotency cannot be detected statically: whether
        an operation is safe to repeat depends on what it does to external state,
        which a tool cannot read. A reviewer must trace each mutating operation to
        the redelivery paths that can reach it and confirm that either the operation
        is naturally idempotent or a key-based guard makes it so. The rule is the
        necessary complement to error-handling.retry-and-circuit-breaker: that rule
        ensures cross-process calls retry safely from the caller''s side; this rule
        ensures the callee survives the retry. Without it, the substrate would be
        mandating a mechanism (retry) whose precondition (idempotency) it never checked.'
    links:
    - rel: authoritative-source
      text: Idempotence (an operation that has the same effect whether applied once
        or many times; concept reference)
      href: https://en.wikipedia.org/wiki/Idempotence
    - rel: authoritative-source
      text: RFC 9110 idempotent HTTP methods (the semantics clients and intermediaries
        rely on when retrying requests)
      href: https://datatracker.ietf.org/doc/html/rfc9110#name-idempotent-methods
  - id: reliability.no-blocking-in-async
    class: substrate-rule
    title: Synchronous blocking calls are not made on an async or single-threaded
      event-loop execution path; blocking work is offloaded to an executor or thread
    props:
    - name: rule-id
      ns: governance-commons
      value: reliability.no-blocking-in-async
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
      ns: governance-commons
      value: reliability
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: reliability.no-blocking-in-async_smt
      name: statement
      prose: 'On an async or single-threaded event-loop execution path, code does
        not invoke synchronous blocking operations: blocking network or file I/O,
        blocking sleeps, blocking subprocess waits, or unbounded CPU-bound computation.
        I/O uses the ecosystem''s async-native client (the await-able HTTP client,
        the async file API); unavoidable blocking or CPU-bound work is dispatched
        to a thread or process executor (Python asyncio.to_thread or run_in_executor,
        a Node worker thread, an offloaded goroutine on a separate pool) so the event
        loop remains free to serve other work. The rule applies to code reachable
        on an async path; it does not apply to synchronous code in a synchronous program,
        to startup or shutdown paths that run before the loop serves traffic, or to
        a CPU-bound step short and bounded enough that offloading would cost more
        than it saves (a tuning exemption, documented).'
    - id: reliability.no-blocking-in-async_rationale
      name: rationale
      prose: 'An event loop achieves concurrency by interleaving many operations on
        one thread, which works precisely because each operation yields the thread
        while it waits. A blocking call breaks that contract: it holds the thread
        through the wait, so every other operation the loop is cooperatively scheduling
        is frozen until the blocking call returns. The damage is not local to the
        slow operation; it is borne by all the traffic sharing that loop, which is
        why the symptom is diffuse tail latency and periodic stalls rather than a
        clean failure of one request. The substrate treats the presence of a known
        blocking call on an async path as a mechanical floor because the linters detect
        the common forms directly and the fix is well understood. The judgment the
        mechanical rule defers to L2 is the offload strategy and the recognition of
        blocking hidden inside a synchronous dependency, which a tool cannot see and
        a reviewer must.'
    links:
    - rel: authoritative-source
      text: Ruff flake8-async (ASYNC) rule family, including blocking-open-call-in-async-function,
        blocking-sleep-in-async-function, and blocking-http-call-in-async-function
      href: https://docs.astral.sh/ruff/rules/#flake8-async-async
    - rel: authoritative-source
      text: ESLint no-sync rule (flags the synchronous filesystem and other *Sync
        methods that block the Node event loop)
      href: https://eslint.org/docs/latest/rules/no-sync
    - rel: authoritative-source
      text: Python asyncio developer guidance on running blocking code in an executor
        (loop.run_in_executor, asyncio.to_thread) rather than on the event loop
      href: https://docs.python.org/3/library/asyncio-dev.html#running-blocking-code
  - id: reliability.reliability-strategy
    class: substrate-rule
    title: The service has an explicitly documented reliability strategy covering
      which failures it is designed to survive, how dependencies are classified by
      criticality, and the delivery, isolation, health, and degradation models that
      follow from those choices
    props:
    - name: rule-id
      ns: governance-commons
      value: reliability.reliability-strategy
    - name: layer
      ns: governance-commons
      value: judgmental
    - name: characteristic
      ns: governance-commons
      value: reliability
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: reliability.reliability-strategy_smt
      name: statement
      prose: 'The service has an explicitly documented decision on its reliability
        strategy, recorded in a MADR following the substrate''s decision-framework
        template and stored in the service''s decision-record location (substrate-recommended
        path: /docs/decisions/ADR-XXX-reliability-strategy.md), referenced from the
        architectural documentation. The MADR addresses every sub-decision the substrate
        template requires: the failure-mode catalog (which failures the service is
        designed to survive and which it explicitly is not); the dependency-criticality
        classification (each cross-process dependency labeled critical, degradable,
        or optional, with the request-level consequence of its loss); the delivery
        and idempotency semantics (at-least-once, at-most-once, or exactly-once-in-effect,
        and how idempotency is achieved where redelivery is possible); the resource-isolation
        model (which failure domains are separated by bulkheads, pools, or concurrency
        limits so a slow dependency cannot starve unrelated paths); the health-and-recovery
        model (what liveness and readiness each gate on, and how the service recovers
        after a dependency returns); and the degradation policy (what the service
        does, from the user''s point of view, when each degradable dependency is unavailable).'
    - id: reliability.reliability-strategy_rationale
      name: rationale
      prose: 'The reliability strategy is to this concern what the SLO policy is to
        observability and the organization strategy is to code organization: the anchoring
        decision the rest of the concern cascades from. Each L2 rule is a conformance
        check against an intended reliability behavior, and the intended behavior
        is precisely what this decision records. Idempotency (reliability.idempotency)
        is judged against the chosen delivery semantics; graceful degradation (reliability.graceful-degradation)
        is judged against the criticality classification that says which dependencies
        may fail without failing the request; failure isolation (reliability.failure-isolation)
        is judged against the failure-domain map; and health signaling (reliability.health-signaling)
        is judged against the recovery model that says what readiness must reflect.
        The L1 rules are sized by the same decision: the bound on a queue (reliability.bounded-buffers)
        follows from how much in-flight work the chosen degradation behavior tolerates,
        and the supervision of background tasks (reliability.tracked-async-tasks)
        follows from whether their loss is survivable. Without the decision, the rules
        degrade into reflexes applied unevenly across dependencies, and the system''s
        true reliability is whatever the sum of those reflexes happened to produce.
        The substrate does not prescribe a single reliability target; it requires
        that the target be chosen, written down, and propagated into the rules that
        hold the service to it, because a service designed to survive a named set
        of failures beats one whose resilience is the accident of what its authors
        remembered to handle.'
  - id: reliability.tracked-async-tasks
    class: substrate-rule
    title: Asynchronously spawned tasks, goroutines, and promises are retained, awaited,
      or supervised rather than detached and forgotten
    props:
    - name: rule-id
      ns: governance-commons
      value: reliability.tracked-async-tasks
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
      ns: governance-commons
      value: reliability
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: reliability.tracked-async-tasks_smt
      name: statement
      prose: 'Tasks scheduled to run concurrently and outlive the statement that created
        them (asyncio tasks, JavaScript promises spawned without await, goroutines,
        futures submitted to an executor) have their lifecycle managed: the handle
        is retained in a structure that outlives the task, the task is awaited or
        joined, or it is registered with a task group, structured-concurrency scope,
        or supervisor that observes its completion and surfaces its failures. Deliberate
        fire-and-forget is permitted only when it is explicitly marked (an intentional
        void of a promise, a documented detached best-effort task) so that the detachment
        is a visible decision rather than an accident. The rule applies to concurrency
        primitives that can outlive their creating scope; it does not apply to awaited
        calls or to synchronous helper calls.'
    - id: reliability.tracked-async-tasks_rationale
      name: rationale
      prose: 'Detached concurrent work fails in two silent ways. First, its errors
        are unobserved: no awaiter receives the exception, so a failure inside the
        task neither logs nor propagates, defeating the error-handling concern''s
        logging rule (error-handling.no-exception-swallow) at the point where it matters
        most. Second, in runtimes that retain only a weak reference to a scheduled
        task (notably Python asyncio, which is the explicit motivation for Ruff RUF006),
        a task with no strong reference can be garbage-collected before it finishes
        and simply vanish, so the work never completes and nothing records that it
        did not. Requiring a retained handle fixes both: a held reference keeps the
        task alive, and an await or a task-group join provides a place for its failure
        to surface. The substrate treats this as a mechanical floor because the discarded-handle
        pattern is statically visible and the native linters detect it directly; the
        judgment of whether a particular detachment is safe is the L2 layer''s concern,
        and the shape of the supervising structure is reviewed under reliability.failure-isolation.'
    links:
    - rel: authoritative-source
      text: Ruff RUF006 asyncio-dangling-task (flags asyncio.create_task and ensure_future
        whose return value is not stored, which the runtime may garbage-collect before
        completion)
      href: https://docs.astral.sh/ruff/rules/asyncio-dangling-task/
    - rel: authoritative-source
      text: typescript-eslint no-floating-promises (flags a Promise that is neither
        awaited, returned, nor explicitly voided, so its rejection is unhandled and
        its completion unobserved)
      href: https://typescript-eslint.io/rules/no-floating-promises/
    - rel: authoritative-source
      text: Go concurrency-pipeline guidance on goroutine lifecycle and ensuring spawned
        goroutines have a termination path (concept reference; goroutine-leak detection
        in Go is primarily a test-time concern, see the binding)
      href: https://go.dev/blog/pipelines
