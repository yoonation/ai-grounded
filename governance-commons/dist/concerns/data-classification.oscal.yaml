    - id: data-classification.data-classification-policy_rationale
      name: rationale
      prose: 'Classification fails as a pile of locally reasonable decisions that
        do not cohere: one team''s labels differ from another''s, a class is encrypted
        in one store and not the next, an aggregate is classified by guess. The policy
        ADR is where the scheme, the determination rule, the handling matrix, and
        the propagation rules are made explicit and owned, and where the application''s
        labels are bound to the infrastructure tags so the two layers agree. The substrate
        requires it to be recorded and complete, not long; a small application''s
        policy is short, but it is written down and updatable rather than rediscovered
        after an exposure. The six sub-decisions are the minimum that make the eight
        conformance rules meaningful.'
