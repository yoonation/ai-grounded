    parts:
    - id: data-classification.encryption-per-class_smt
      name: statement
      prose: Classified data is encrypted at rest and in transit to the standard its
        class requires. Stores holding confidential or restricted data have at-rest
        encryption enabled with keys managed per policy, and classified data crosses
        only encrypted transport. The per-class encryption standard is recorded in
        the classification policy. The control is reviewed when a new classified store
        or transport path is introduced; the provision-time enforcement of at-rest
        encryption is owned by infrastructure-misconfiguration.
    - id: data-classification.encryption-per-class_rationale
      name: rationale
      prose: 'Encryption is the control that decouples the confidentiality of classified
        data from the security of the medium that holds or carries it: with it, a
        leaked backup or a sniffed connection yields ciphertext; without it, the data
        is read in the clear. The requirement scales with the class, which is why
        this concern owns the per-class standard while the security concerns own the
        cryptographic mechanism and infrastructure-misconfiguration owns enforcing
        the at-rest setting at provision time. The substrate keeps this as an L2 review
        because the in-force state lives in datastore and transport configuration
        that the application source does not express.'
    links:
