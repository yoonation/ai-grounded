      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: data-classification.propagation-inheritance_smt
      name: statement
      prose: 'Classification travels with data: a copy, a derived view, an export,
        a message on a bus, or a cached value carries at least the class of its source,
        and combinations take the most restrictive input class. A destination that
        cannot meet a class''s handling requirements does not receive data of that
        class. Whether a value may be cached in a given tier is this rule''s call;
        how it is cached is performance-caching''s. The propagation is reviewed when
        a new copy, derivation, export, or cache of classified data is introduced.'
    - id: data-classification.propagation-inheritance_rationale
      name: rationale
      prose: 'A classification scheme that stops at the system of record is a scheme
        that protects data only until it moves, which is exactly when it is most exposed.
        The class is a property of the data itself, so it must be inherited by every
        destination the data reaches, and a destination that cannot honor the class
        must not receive the data. This rule is the connective tissue of the concern:
        it keeps data-classification.encryption-per-class and data-classification.access-least-privilege
        from being bypassed by a copy that drops the class, and it owns the boundary
        the performance-caching concern points to for what may be cached where. The
        substrate keeps it at L2 because tracing where data flows and what each destination
        can protect is a review judgment.'
    links:
    - rel: authoritative-source
      text: NIST SP 800-60 (the aggregation and propagation of security categories
        through derived information)
      href: https://csrc.nist.gov/pubs/sp/800/60/v1/r1/final
    - rel: authoritative-source
      text: ISO/IEC 27001 information classification (maintaining classification as
        information is handled, referenced as a concept)
      href: https://www.iso.org/standard/27001
  - id: data-classification.retention-disposal
    class: substrate-rule
    title: Classified data is retained and disposed of according to the per-class
