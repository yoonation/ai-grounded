    - id: data-classification.data-classification-policy_smt
      name: statement
      prose: 'The application has a recorded data-classification policy ADR, discoverable
        from its documentation and current relative to the last significant change,
        covering six sub-decisions: the scheme (the closed class vocabulary), the
        determination rule (how a datum''s class is decided, including aggregation),
        the per-class handling matrix (encryption, access, retention, logging, masking),
        the propagation rules, the tag-and-label binding (to application labels and
        to the infrastructure tags infrastructure-misconfiguration.governance-tagging
