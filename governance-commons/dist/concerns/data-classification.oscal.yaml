    parts:
    - id: data-classification.access-least-privilege_smt
      name: statement
      prose: 'Access to classified data is restricted to need-to-know for its class:
        the set of principals with read access to confidential or restricted data
        is minimized and justified by role and purpose, access to the higher classes
        is logged to an audit trail, and grants are reviewed on a cadence. Broad default
        grants are not used for the higher classes. The requirement is reviewed when
        a new principal is granted access to classified data; the authorization concern
        owns the enforcement mechanism.'
