  - id: data-classification.propagation-inheritance
    class: substrate-rule
    title: Classification propagates through data flows so that copies, derivations,
      exports, and caches carry at least the source class
    props:
    - name: rule-id
      ns: governance-commons
      value: data-classification.propagation-inheritance
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
