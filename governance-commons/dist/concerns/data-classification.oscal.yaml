      name: rationale
      prose: The class of a datum is a statement about who should see it, and least-privilege
        access is how that statement is enforced. Every principal granted access to
        high-class data is an additional way that data can leak through a compromised
        credential or a misused one, so minimizing the grant set is the control, and
        auditing it is what makes misuse detectable. The substrate owns the per-class
        requirement (minimize and audit) and defers the enforcement mechanism to the
        authorization concern, keeping this an L2 review because whether a grant is
        truly need-to-know is a judgment about roles and purposes rather than a syntactic
        fact.
