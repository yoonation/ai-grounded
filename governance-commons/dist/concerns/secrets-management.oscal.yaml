    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: secrets-management.sensitive-files-gitignored_smt
      name: statement
      prose: The project's .gitignore file (and equivalents for other version control
        systems and pre-commit tooling) excludes file patterns that commonly carry
        secret material. The substrate-recommended minimum patterns are enumerated
        in the guidance section below. CI enforces that no commit introduces a file
        matching these patterns regardless of whether the file is tracked or untracked
        at the time of the change. Where a sensitive file genuinely belongs in version
        control (e.g., a public certificate, a signed but non-secret manifest), the
        file is committed in a path that does not match the sensitive pattern set,
        and the exception is documented in the repository's README or in a SECURITY.md.
    - id: secrets-management.sensitive-files-gitignored_rationale
      name: rationale
      prose: 'Many real-world credential disclosures result from files reaching commit
        history that the developer did not intend to commit. The dominant causes:
        developer creates a credential locally for testing (file named .env, id_rsa,
        deploy.key); git status reports it as untracked; developer runs ''git add
        .'' or ''git commit -a'' without inspecting the staging area; the file enters
        history. A mechanical guard at the commit step catches this category of mistake
        before history is written. Comprehensive .gitignore plus pre-commit hook blocks
        the path entirely; the developer cannot accidentally commit the file. The
        substrate requires both because each addresses a different failure mode: .gitignore
        prevents ''git add''; pre-commit blocks the cases where ignore is overridden
        with ''git add -f'' or manually staged content.'
    links:
    - rel: authoritative-source
      text: OWASP Secrets Management Cheat Sheet (sections on secret storage and version
        control hygiene)
      href: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    - rel: authoritative-source
