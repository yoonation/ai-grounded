  - id: secrets-management.runtime-retrieval
    class: substrate-rule
    title: Application secrets are retrieved at runtime from a dedicated secrets management
      platform; secrets are not persisted to disk in plaintext, not embedded in container
      images, and not passed via untyped environment variables that leak through process
      introspection
    props:
    - name: rule-id
      ns: governance-commons
      value: secrets-management.runtime-retrieval
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
