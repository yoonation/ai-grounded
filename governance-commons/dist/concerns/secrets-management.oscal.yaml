      value: any-handling-secrets
    parts:
    - id: secrets-management.rotation-policy_smt
      name: statement
      prose: 'Every secret managed by the application has a documented rotation policy
        stating: the rotation interval; whether rotation is automatic or manual; the
        owner responsible for executing manual rotation; the runbook reference for
        manual rotation; the response procedure when a compromise indicator triggers
        off-schedule rotation. Secrets that the platform supports for automatic rotation
        (dynamic database credentials, IAM access keys, cloud-managed certificates)
        are configured for automatic rotation. Secrets that require coordination with
        a third party (vendor API keys, partner-issued credentials) have a manual
        rotation runbook and a calendar-tracked schedule.'
    - id: secrets-management.rotation-policy_rationale
      name: rationale
      prose: A secret that is never rotated remains exploitable indefinitely after
        any past disclosure. Disclosure events are not always detected, and a static
        secret outlives the disclosure-detection window. Periodic rotation bounds
        the exploitable window regardless of detection efficacy; emergency rotation
        on indicators caps the window when detection does occur. The substrate distinguishes
        scheduled rotation from compromise rotation because they operate on different
        cadences and require different automation. Scheduled rotation runs on calendar
        (e.g., 90 days for long-lived API keys, 24 hours for dynamic database credentials,
        on session for workload identity tokens). Compromise rotation runs on indicator
        (secret scanner finding, security alert, employee separation, vendor breach
        disclosure) within hours.
    links:
    - rel: authoritative-source
      text: OWASP Secrets Management Cheat Sheet (rotation section)
