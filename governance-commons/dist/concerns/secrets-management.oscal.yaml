    - id: secrets-management.encryption-at-rest_smt
      name: statement
      prose: 'The storage layer of the secrets platform (whichever platform is selected
        per secrets-management.platform-selection) encrypts secret material at rest.
        The encryption key is managed separately from the encrypted secret values:
        stored in a different system, under different access policy, with key access
        audited independently of secret access. Where the platform offers customer-managed
        key (CMK) configuration, the substrate-recommended setting is to enable it;
        provider-managed keys are acceptable for non-regulated environments where
        the operational overhead of CMK is not justified. Envelope encryption (data
        encryption key encrypted by a key encryption key) is preferred when the platform
        supports it.'
    - id: secrets-management.encryption-at-rest_rationale
      name: rationale
      prose: 'The substrate''s bet on encryption at rest is bounding the blast radius
        of storage-level compromise. Snapshot theft, backup exposure, misconfigured
        replication, and storage-tier misconfiguration are real disclosure vectors
        that bypass application-level access control. Encryption at rest with a separated
        key means storage-level exposure produces ciphertext, not plaintext. Key separation
        is essential: an encryption key co-located with its ciphertext provides defense
        in depth zero (both leak together). Customer-managed keys (CMK) add audit
        independence: the consumer sees every key use, including platform operations.
        Provider-managed keys are acceptable when audit independence is not required
        and operational overhead matters; they still satisfy the key-separation requirement
        because the provider holds the key in a system separate from the secret store.'
