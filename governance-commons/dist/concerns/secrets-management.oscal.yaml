      ns: governance-commons
      value: any-producing-logs-or-telemetry
    parts:
    - id: secrets-management.no-secrets-in-logs_smt
      name: statement
      prose: Application code does not interpolate secret values into log statements,
        span attributes, metric labels, error messages returned to API clients, analytics
        events, or any other observability or telemetry emission. When a code path
        operates on a secret value (e.g., a key for a cryptographic operation, an
        API token for an outbound request), the secret is held in a wrapper or context
        that masks its content under string conversion. Stack traces and debug dumps
        are configured so that local variable values are not included by default;
        where introspection is enabled (developer environments), the masking wrapper
        still applies.
    - id: secrets-management.no-secrets-in-logs_rationale
      name: rationale
      prose: 'Modern observability stacks fan out logs and traces to many destinations:
        application log aggregator, security information and event management platform,
        error monitoring service, cold storage archive, observability vendor backend,
        downstream analytics. Each destination has its own access control, retention
        policy, and exfiltration surface. A secret that reaches the producer''s log
        line is replicated to all of these by default. Redaction at the producer is
        the only control that works uniformly across destinations. Per-destination
        redaction (sanitizing at the aggregator, masking at the SIEM, etc.) is fragile:
        a single misconfigured downstream emits the secret. Producer-side masking,
        applied by the secrets manager client and the logging framework, is the substrate-recommended
        approach.'
    links:
    - rel: authoritative-source
      text: OWASP Logging Cheat Sheet (sections on data exclusion from logs)
      href: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V7 Errors, Logs, Auditing (do not log sensitive data;
