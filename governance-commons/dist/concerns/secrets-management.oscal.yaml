      value: any-handling-secrets
    parts:
    - id: secrets-management.runtime-retrieval_smt
      name: statement
      prose: 'Application code retrieves secret values at runtime from a secrets management
        platform (cloud-native: AWS Secrets Manager, AWS KMS, Google Secret Manager,
        Azure Key Vault, GCP KMS; dedicated: HashiCorp Vault, Conjur, Doppler) or
        from a tightly-scoped file-system mount populated by a credential broker (Vault
        Agent sidecar, CSI Secrets Store driver). Plaintext secret values are not
        persisted to writable disk, not baked into container image layers, and not
        passed via environment variables in deployment manifests except where the
        environment variable references a secret value the orchestration platform
        resolves from the secrets platform at container start.'
    - id: secrets-management.runtime-retrieval_rationale
      name: rationale
      prose: 'Runtime retrieval centralizes credential lifecycle under the secrets
        platform. The platform owns: access control (per-identity policy on which
        secrets can be retrieved by which principal); rotation (issuing new credential
        material on schedule); audit (logging every retrieval with identity, timestamp,
        secret reference); revocation (immediate invalidation on compromise indicator).
        These properties cannot be replicated by static files, environment variables
        baked into manifests, or in-source configuration. Container image embedding
        is particularly hazardous because image layers are immutable and distributed
        broadly. A secret baked into a layer is published to the registry; pull access
        to the registry equals access to the secret. Even when the registry is private,
        the secret outlives the registry''s access policy lifetime. Untyped environment
        variables (set by shell scripts that read files, by docker run --env-file
        pointing at production-config files, by CI variable injection without source-tracking)
        leak through process introspection (/proc/PID/environ on Linux, ps -e visibility
        on some configurations) and through accidental dumps in error pipelines. Orchestrator-resolved
        env vars (Kubernetes Secret-backed env, ECS task secrets, Cloud Run secret
        references) are acceptable because the orchestrator integrates with the secrets
        platform and the secret value is not present in the manifest itself.'
    links:
    - rel: authoritative-source
      text: OWASP Secrets Management Cheat Sheet (sections on secrets retrieval, dynamic
        secrets, broker patterns)
      href: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
