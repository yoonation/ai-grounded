    parts:
    - id: error-handling.no-exception-swallow_smt
      name: statement
      prose: Every exception-handling construct that does not immediately re-raise
        emits a log entry before continuation, return, or any other terminating action.
        The log entry includes the exception type, the exception message, sufficient
        context to identify the operation that failed (correlation identifier per
        logging.correlation-ids, operation name, relevant parameter values minus sensitive
