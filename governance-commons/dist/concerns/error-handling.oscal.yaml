    parts:
    - id: error-handling.no-bare-except_smt
      name: statement
      prose: Every exception-handling construct (Python except, Java catch, JavaScript
        catch, Go error checks, Ruby rescue, C# catch, Kotlin catch) specifies the
        exception class or classes it intends to handle. Catching the universal exception
        class (Exception in Python and Java, the bare catch in JavaScript, rescue
        without class in Ruby, catch in C#) is forbidden unless the handler immediately
        re-raises the exception after a bounded action (logging, metric increment,
        resource cleanup) and does not swallow it. The substrate's preferred pattern
        is to catch the narrowest exception class that represents the failure mode
        the handler actually addresses.
    - id: error-handling.no-bare-except_rationale
      name: rationale
      prose: Bare exception catches are the single most common error-handling antipattern
        in production code. The catch-all surface absorbs everything including programming
        defects that should propagate to fail-fast or to an outer handler. The result
        is a system that fails quietly and accumulates corruption over time. The rule
        operates at L1 because the pattern (catch construct with no exception class
        or with the universal class plus no re-raise) is locally detectable; whether
        the chosen narrower class is the semantically correct one for the failure
        mode is L2.
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V7.4 (Error handling does not expose sensitive information
        and handles errors consistently)
