  - id: error-handling.retry-and-circuit-breaker
    class: substrate-rule
    title: Retry logic is bounded with backoff, and cross-process calls are protected
      by timeouts and circuit-breaker patterns where appropriate
    props:
    - name: rule-id
      ns: governance-commons
      value: error-handling.retry-and-circuit-breaker
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: reliability
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-754
    - name: applies-to-environment
      ns: governance-commons
      value: any-with-network-or-rpc-calls
    parts:
    - id: error-handling.retry-and-circuit-breaker_smt
      name: statement
      prose: 'Every cross-process call (HTTP to downstream service, database query,
        message queue publish, cache fetch, RPC call) has a defined timeout shorter
        than the caller''s own timeout. Retry logic on transient failures is bounded:
        a maximum attempt count (substrate-recommended: 3 for idempotent calls, 1
        for non-idempotent), exponential backoff between attempts (substrate-recommended:
        base 100ms doubling per attempt), and jitter applied to spread retry storms
        (substrate-recommended: AWS-pattern equal jitter). Calls to services with
        known degradation modes are protected by circuit-breakers (open after consecutive
        failures, half-open trial after backoff, closed when trial succeeds). The
        retry, timeout, and circuit-breaker parameters are documented per call site
        or per service-class binding.'
    - id: error-handling.retry-and-circuit-breaker_rationale
      name: rationale
      prose: Bounded retry, timeouts, and circuit-breakers are the substrate's resilience
        floor. Without them, the application amplifies downstream degradation into
        outage. The rule is L2 because the specific bounds (timeout duration, retry
        count, circuit-breaker threshold) depend on the application's SLO budget,
        the dependency's known characteristics, and the call's idempotency properties;
        these are review surfaces, not statically checkable patterns.
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V7.4 (Handling of dependency failures)
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x15-V7-Error-Logging.md
  - id: error-handling.typed-error-classification
    class: substrate-rule
    title: Errors distinguish domain (user-actionable) from infrastructure (operational)
      at the type level rather than via string matching
    props:
    - name: rule-id
      ns: governance-commons
      value: error-handling.typed-error-classification
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: reliability
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-703
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: error-handling.typed-error-classification_smt
      name: statement
      prose: The application declares a typed error hierarchy that distinguishes domain
        errors (user-actionable outcomes representing valid business outcomes that
        are not "success") from infrastructure errors (operational failures requiring
        engineer intervention). Domain errors carry information the client uses to
        recover (the conflict that caused the duplicate key, the field that violates
        the constraint, the state machine transition that was rejected). Infrastructure
        errors carry information the operator uses to recover (the downstream service,
        the configuration value, the resource that was unavailable). Error routing
        (HTTP status mapping, retry logic, alerting) uses the type discriminator rather
        than string matching against the message field. The type discriminator may
        be a class hierarchy (typed exceptions), a tagged union (Result types in Rust,
        Either in functional languages), or a sentinel + type assertion (Go errors.Is/As
        against sentinel and typed values).
    - id: error-handling.typed-error-classification_rationale
      name: rationale
      prose: 'Typed error classification is the substrate''s foundation for everything
        downstream. Status code mapping, retry logic, circuit-breaker decisions, alerting
        thresholds, and observability classification all depend on knowing whether
        an error is domain or infrastructure. String matching the message field is
        the antipattern: it works until someone updates the error message and every
        downstream classifier silently misclassifies the error. The rule is L2 because
        the choice of error hierarchy is a structural decision specific to the application''s
        domain. Reviewers verify the hierarchy exists, is documented, and is used
        consistently; the substrate does not prescribe a specific hierarchy.'
