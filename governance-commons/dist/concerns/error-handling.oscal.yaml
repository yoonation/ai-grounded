    parts:
    - id: error-handling.observable-response-discrepancy_smt
      name: statement
      prose: 'Error responses for resource-access endpoints do not differentiate between
        "resource does not exist" and "resource exists but principal is not authorized
        to see it." Both cases produce the same HTTP status code (substrate-recommended:
        404 Not Found for both, treating the response from the unauthorized principal''s
        perspective as "the resource is not visible"), the same response body shape,
        and similar timing characteristics (no fast-path for the nonexistent case,
        no slow-path for the authorization check). Authentication endpoints follow
        the same discipline per authentication.generic-failure-responses: the response
        does not differentiate "user does not exist" from "user exists but credentials
        wrong."'
    - id: error-handling.observable-response-discrepancy_rationale
      name: rationale
      prose: Observable response discrepancy is a direct enumeration vector. The substrate's
        L2 rule covers the broader resource-existence case beyond authentication (which
        is covered at L1 in the authentication catalog). The rule is L2 because the
        response and timing characteristics depend on the application's response pipeline
        and database query characteristics; the substrate cannot detect discrepancies
        via static analysis but reviewers can verify the pipeline shape.
