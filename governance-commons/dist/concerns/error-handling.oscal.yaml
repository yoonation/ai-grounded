    parts:
    - id: error-handling.no-stack-trace-in-response_smt
      name: statement
      prose: Error responses returned to clients across any network surface (HTTP,
        gRPC, GraphQL, message queue reply, WebSocket close frame) carry only the
        response body specified by the application's documented error contract. The
        response body does not include the exception object's message field directly
        (unless the exception is an application error class whose message field is
        deliberately client-facing), does not include any stack trace, does not include
        framework or library version identifiers, does not include internal file paths,
        and does not include internal field names that differ from the client-facing
        contract. Framework debug modes that produce detailed error pages (Flask debug=True,
        Django DEBUG=True, Spring whitelabel error page with trace, Express development
        error handler) are disabled in production.
    - id: error-handling.no-stack-trace-in-response_rationale
      name: rationale
      prose: Information disclosure via error messages is a substrate-classified critical
        issue because the disclosed information is directly actionable input to follow-on
        attacks. The OWASP Top 10 categorizes this under Security Misconfiguration
        (A05:2021) because the most common cause is shipping development-mode framework
        defaults to production. The substrate's L1 mechanical detection catches the
        explicit cases (direct stack-trace serialization); the L2 layer (error-handling.error-response-contract)
        catches the contract cases (framework error pages, custom exception serializers).
        The rule operates at L1 because the direct-serialization patterns (traceback.format_exc
        to response, err.stack to res.send) are locally detectable at the response-construction
        site. The framework-default case requires configuration review at L2.
