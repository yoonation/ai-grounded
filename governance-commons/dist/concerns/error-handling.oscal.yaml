      name: rationale
      prose: 'The "log it and continue" baseline is the substrate''s minimum operational
        visibility bar. Without it, the application can fail in production without
        anyone knowing until users complain or a metric drifts. The rule pairs with
        error-handling.no-bare-except (typed catches): together, they ensure that
        every exception either propagates to a handler that records the event or is
        explicitly acknowledged by an outer typed catch that logs and re-raises. The
        rule operates at L1 because empty catch bodies and err discard patterns are
        syntactically detectable. Whether the log entry''s context is semantically
        sufficient (does the correlation ID flow to the handler? does the parameter
        set capture enough to reproduce the failure?) is L2 review territory.'
