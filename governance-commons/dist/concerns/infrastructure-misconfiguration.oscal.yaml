  - id: infrastructure-misconfiguration.least-privilege-iac-iam
    class: substrate-rule
    title: 'Cloud-IAM declarations in IaC enforce least-privilege: no unjustified
      wildcards, scoped roles, no broad PassRole, no default admin policies'
    props:
    - name: rule-id
      ns: governance-commons
      value: infrastructure-misconfiguration.least-privilege-iac-iam
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-269
    - name: cwe
