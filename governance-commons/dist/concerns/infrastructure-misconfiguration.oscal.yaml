  - id: infrastructure-misconfiguration.iac-sources-version-pinned
    class: substrate-rule
    title: IaC provider, module, and image sources are explicitly version-pinned (no
      floating, no 'latest', no unpinned git refs)
    props:
    - name: rule-id
      ns: governance-commons
      value: infrastructure-misconfiguration.iac-sources-version-pinned
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
      ns: governance-commons
