      value: CWE-732
    - name: applies-to-language
      ns: governance-commons
      value: any-iac
    - name: applies-to-framework
      ns: governance-commons
      value: terraform-cloudformation-pulumi-arm-bicep
    - name: applies-to-environment
      ns: governance-commons
      value: any-cloud-iam-declaration
    parts:
    - id: infrastructure-misconfiguration.least-privilege-iac-iam_smt
      name: statement
      prose: IaC declarations of cloud-IAM constructs (AWS IAM policies, roles, users,
        groups; Azure RBAC role definitions and assignments; GCP IAM bindings and
        custom roles; Kubernetes ClusterRole / Role / ClusterRoleBinding / RoleBinding)
        follow least-privilege. Wildcards in Action / Resource (AWS), Actions / NotActions
        (Azure custom roles), permissions (GCP custom roles), or verbs / resources
        (Kubernetes RBAC) are reviewed and either justified by a documented service-pattern
        or replaced with explicit enumeration. Account-default admin-equivalent managed
        policies (AWS Administrator Access, Azure Owner / Contributor at subscription,
        GCP Owner / Editor at project) are not attached to workload roles. Broad iam:PassRole
        permitting a principal to pass any role to any service is replaced with scoped
        PassRole expressions naming specific role ARNs and service principals. Service
        accounts (Kubernetes service accounts, GCP service accounts, Azure managed
        identities) carry only the roles their workload requires.
    - id: infrastructure-misconfiguration.least-privilege-iac-iam_rationale
      name: rationale
      prose: 'Least-privilege cloud-IAM is the substrate''s defense against the post-compromise
        lateral-movement pattern that dominates published cloud-breach post-mortems.
        A workload with a tightly-scoped role contains a credential compromise to
        the workload''s scope; a workload with a broad role converts the same compromise
        into account-level access via role-chaining and PassRole. The review is contextual:
        some wildcards are part of legitimate platform patterns (a read-only audit
        role with Get*, List*, Describe* on a service; a CI deployer with broad cloudformation:*
        on an isolated CI account). The L2 review distinguishes justified wildcards
        from accidental ones; the test template provides policy-simulation patterns
        that consumers run in CI to detect privilege-creep over time.'
    links:
    - rel: authoritative-source
      text: NIST SP 800-53 Rev. 5 AC-6 Least Privilege
      href: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home
    - rel: authoritative-source
      text: CIS AWS Foundations Benchmark v3.0.0 (Section 1 Identity and Access Management,
        least-privilege review)
      href: https://www.cisecurity.org/benchmark/amazon_web_services
    - rel: authoritative-source
      text: CSA Cloud Controls Matrix v4 IAM-04 Least Privilege
      href: https://cloudsecurityalliance.org/research/cloud-controls-matrix/
  - id: infrastructure-misconfiguration.network-segmentation
    class: substrate-rule
    title: Network architecture in IaC enforces segmentation and defense-in-depth
      across tiers
    props:
    - name: rule-id
      ns: governance-commons
      value: infrastructure-misconfiguration.network-segmentation
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-1390
    - name: cwe
      ns: governance-commons
      value: CWE-285
    - name: applies-to-language
      ns: governance-commons
      value: any-iac
    - name: applies-to-framework
      ns: governance-commons
      value: terraform-cloudformation-pulumi-arm-bicep
    - name: applies-to-environment
      ns: governance-commons
      value: any-cloud-network-topology
    parts:
    - id: infrastructure-misconfiguration.network-segmentation_smt
      name: statement
      prose: 'IaC declarations of network topology enforce tiered segmentation: public
        subnets containing only internet-facing load balancers and NAT gateways; application-private
        subnets containing application workloads (compute, containers, serverless);
        data-private subnets containing data-bearing resources (databases, caches
        with persistence, file systems). Cross-tier reachability is via explicit security-group,
        NSG, or firewall-rule references rather than CIDR-based allow-list of the
        broader subnet. Egress from private subnets is via NAT Gateway or cloud-native
        equivalent with egress controls; egress to managed services uses VPC endpoints
        / Private Endpoints / Private Service Connect rather than internet egress.
        Where a flat network is intentional (isolated CI account, ephemeral test environment),
        the IaC declares the exception with a documented justification that the L3
        MADR''s exception-governance process covers.'
    - id: infrastructure-misconfiguration.network-segmentation_rationale
      name: rationale
      prose: The substrate's design choice is to treat network topology as L2 (review-required)
        rather than L1 (mechanically-enforced) because the topology is a composition
        of resources, not a single attribute. A tool can detect that subnets exist
        and routing tables exist, but the semantic question "do the subnets enforce
        segmentation" requires reasoning about the relationships among security groups,
        NACLs, route tables, and the workload placement. The L2 review confirms the
        topology meets the substrate's tiered-segmentation pattern or documents the
        deviation.
    links:
    - rel: authoritative-source
      text: NIST SP 800-53 Rev. 5 SC-7 Boundary Protection, SC-32 Information System
        Partitioning
      href: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home
    - rel: authoritative-source
      text: NIST SP 800-207 Zero Trust Architecture
      href: https://csrc.nist.gov/pubs/sp/800/207/final
    - rel: authoritative-source
      text: CSA Cloud Controls Matrix v4 IVS-03 Network Architecture, IVS-09 Segmentation
        and Segregation
      href: https://cloudsecurityalliance.org/research/cloud-controls-matrix/
  - id: infrastructure-misconfiguration.no-public-access-without-tag
    class: substrate-rule
    title: Storage and managed resources are not publicly accessible unless explicitly
      tagged as intentionally public
    props:
    - name: rule-id
      ns: governance-commons
      value: infrastructure-misconfiguration.no-public-access-without-tag
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: critical
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-732
    - name: cwe
      ns: governance-commons
      value: CWE-284
    - name: applies-to-language
      ns: governance-commons
      value: any-iac
    - name: applies-to-framework
      ns: governance-commons
      value: terraform-cloudformation-pulumi-kubernetes-arm-bicep
    - name: applies-to-environment
      ns: governance-commons
      value: any-cloud-managed-resource
    parts:
    - id: infrastructure-misconfiguration.no-public-access-without-tag_smt
      name: statement
      prose: 'IaC declarations of managed resources do not permit public (anonymous-internet)
        access unless the resource carries the substrate-recognized intentional-public
        tag (governance-commons.intent = "public-by-design" plus a justification field).
        The substrate''s public-by-default failure surface includes: AWS S3 buckets
        without a public-access-block resource and with block_public_acls or block_public_policy
        set false; AWS RDS and Aurora instances with publicly_accessible = true; AWS
        ElastiCache, OpenSearch, Redshift, MSK, and similar managed services with
        public endpoints enabled; AWS ECR and ECR Public repositories with public
        policies; AWS Lambda function URLs configured for AWS_IAM = "NONE"; AWS API
        Gateway without authorization on protected routes; Azure Storage accounts
        with allow_blob_public_access = true and containers with anonymous access;
        Azure Cosmos DB with public_network_access_enabled = true; Azure SQL with
        public_network_access_enabled = true; Azure Container Registry with anonymous_pull_enabled
        = true; GCP Cloud Storage buckets without uniform bucket-level access and
        with legacy ACL granting allUsers or allAuthenticatedUsers; GCP Cloud SQL
        with authorized_networks containing 0.0.0.0/0; GCP Bigtable, Spanner, Pub/Sub
        with public IAM bindings; GCP Artifact Registry with public reader IAM; Kubernetes
        Services of type LoadBalancer with no annotations restricting source ranges
        (cross-references infrastructure-misconfiguration.no-unrestricted-ingress
        for the network-level rule); Kubernetes Ingress resources without authentication
        annotations on routes the substrate marks protected. The intentional-public
        tag converts the rule from a violation to a documented choice; the tag''s
        justification field is reviewed at L2 review time (infrastructure-misconfiguration.governance-tagging
        covers the tagging governance, and infrastructure-misconfiguration.network-segmentation
        covers the architectural review of why the resource is public).'
    - id: infrastructure-misconfiguration.no-public-access-without-tag_rationale
      name: rationale
      prose: 'The substrate''s design choice mirrors the same rationale as the authorization
        concern''s deny-by-default rule (authorization.protected-route-declares-authz):
        inverting the default changes the failure mode from "silently exposed" to
        "loudly flagged at provisioning." A legitimately public resource (a marketing-asset
        CDN-origin bucket, a public artifact registry for an open-source project)
        carries the intent tag with a one-line justification; an accidental public
        exposure fails the mechanical check at scan time. The cost of the rule is
        the tag annotation on legitimately public resources; the cost of omission
        is the "public S3 bucket" archetype.'
    links:
    - rel: authoritative-source
      text: CIS AWS Foundations Benchmark v3.0.0 (Section 2 S3 public-access-block,
        Section 2 RDS publicly_accessible)
      href: https://www.cisecurity.org/benchmark/amazon_web_services
    - rel: authoritative-source
      text: CIS Azure Foundations Benchmark v2.1.0 (Section 3 Storage public access)
      href: https://www.cisecurity.org/benchmark/azure
    - rel: authoritative-source
      text: CIS GCP Foundation Benchmark v2.0.0 (Section 5 Storage uniform bucket-level
        access)
      href: https://www.cisecurity.org/benchmark/google_cloud_computing_platform
    - rel: authoritative-source
      text: CWE-732 Incorrect Permission Assignment for Critical Resource
      href: https://cwe.mitre.org/data/definitions/732.html
  - id: infrastructure-misconfiguration.no-unrestricted-ingress
    class: substrate-rule
    title: Network security rules do not declare unrestricted ingress (0.0.0.0/0,
      ::/0) to sensitive ports
    props:
    - name: rule-id
      ns: governance-commons
      value: infrastructure-misconfiguration.no-unrestricted-ingress
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: critical
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-284
    - name: cwe
      ns: governance-commons
      value: CWE-668
    - name: cwe
      ns: governance-commons
      value: CWE-749
    - name: applies-to-language
      ns: governance-commons
      value: any-iac
    - name: applies-to-framework
      ns: governance-commons
      value: terraform-cloudformation-pulumi-kubernetes-arm-bicep
    - name: applies-to-environment
      ns: governance-commons
      value: any-cloud-network-security-construct
    parts:
    - id: infrastructure-misconfiguration.no-unrestricted-ingress_smt
      name: statement
      prose: 'IaC declarations of network security constructs (AWS security groups
        and security-group rules, AWS Network Firewall rule groups, AWS WAF rules;
        Azure network security groups and NSG rules, Azure Firewall rules; GCP firewall
        rules; Kubernetes NetworkPolicy ingress rules; cloud-provider load-balancer
        listener rules) do not declare ingress from 0.0.0.0/0 or ::/0 to the substrate''s
        sensitive-port list. The sensitive-port list at this substrate version: SSH
        (22), RDP (3389), Telnet (23), VNC (5900), Kubernetes API (6443), Kubelet
        (10250), etcd (2379, 2380), Docker daemon (2375, 2376), Redis (6379), Memcached
        (11211), MongoDB (27017, 27018, 27019), MySQL / MariaDB (3306), PostgreSQL
        (5432), Microsoft SQL Server (1433), Oracle Database (1521, 1830), Cassandra
        (7000, 7001, 7199, 9042, 9160), Elasticsearch / OpenSearch (9200, 9300), Kibana
        (5601), RabbitMQ management (15672), and the cloud-administrative endpoints
        (AWS IMDS replacement reachability via 169.254.169.254 is out of L1 scope
        but is an L2 concern; the cloud control-plane is not directly IaC-declarable).
        Consumers extend the sensitive-port list via profile annotation when their
        application stack uses additional administrative protocols. The rule applies
        symmetrically to IPv4 (0.0.0.0/0) and IPv6 (::/0).'
    - id: infrastructure-misconfiguration.no-unrestricted-ingress_rationale
      name: rationale
      prose: 'The substrate''s design choice is to make "internet-exposed administrative
        access" a bright-line failure rather than a review-time judgment. The pattern
        across published incident reports is consistent: a security group is opened
        to 0.0.0.0/0 for a debugging session and not closed; a copy-paste from a tutorial
        leaves 0.0.0.0/0 on a production resource; a new database is provisioned without
        explicit network restrictions because the consumer relied on the cloud provider''s
        default-deny posture that the consumer''s IaC scaffold overrode. The substrate
        treats all three patterns identically: the IaC declares 0.0.0.0/0 to a sensitive
        port, or it does not. The cost of the rule is one line of IaC restricting
        the CIDR; the cost of omission is that the resource is internet-attackable
        from provisioning forward, and most incident-response paths begin with discovery
        of the open port via Shodan or Censys.'
    links:
    - rel: authoritative-source
      text: CIS AWS Foundations Benchmark v3.0.0 (Section 5 Networking, security-group
        ingress rules)
      href: https://www.cisecurity.org/benchmark/amazon_web_services
    - rel: authoritative-source
      text: CIS Azure Foundations Benchmark v2.1.0 (Section 6 Networking, network
        security group rules)
      href: https://www.cisecurity.org/benchmark/azure
    - rel: authoritative-source
      text: CIS GCP Foundation Benchmark v2.0.0 (Section 3 Networking, firewall-rule
        restrictions)
      href: https://www.cisecurity.org/benchmark/google_cloud_computing_platform
    - rel: authoritative-source
      text: NIST SP 800-53 Rev. 5 SC-7 Boundary Protection
      href: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home
    - rel: authoritative-source
      text: CWE-284 Improper Access Control
      href: https://cwe.mitre.org/data/definitions/284.html
  - id: infrastructure-misconfiguration.state-backend-hardening
    class: substrate-rule
    title: 'Terraform state and IaC backend are hardened: remote, encrypted, locked,
      access-restricted'
    props:
    - name: rule-id
      ns: governance-commons
      value: infrastructure-misconfiguration.state-backend-hardening
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-312
    - name: cwe
      ns: governance-commons
      value: CWE-922
    - name: applies-to-language
      ns: governance-commons
      value: terraform-pulumi
    - name: applies-to-framework
      ns: governance-commons
      value: terraform-pulumi-crossplane
    - name: applies-to-environment
      ns: governance-commons
      value: iac-with-external-state
    parts:
    - id: infrastructure-misconfiguration.state-backend-hardening_smt
      name: statement
      prose: Terraform state is stored in a remote backend (AWS S3 with DynamoDB locking,
        Azure Storage with blob lease locking, GCS with object versioning, HCP Terraform
        / Terraform Enterprise managed state, Pulumi Cloud, or self-hosted HTTP backend
        with equivalent properties). The backend is encrypted at rest (cross-references
        infrastructure-misconfiguration.data-resource-encryption-at-rest for the resource-level
        rule); locking is enabled and tested; access to the backend is restricted
        to the principals legitimately running plan and apply (the CI runner's role,
        the on-call substrate-author's role for break-glass); versioning is enabled
        (S3 versioning, GCS versioning, Azure Storage blob versioning) so state history
        is recoverable; access logging is enabled (cross-references infrastructure-misconfiguration.audit-and-flow-logging-enabled);
        the backend resources are themselves declared in a bootstrap IaC module whose
        own state is in the same backend or in a documented secondary backend. Local-state
        IaC is not committed to source control. Pulumi state backends follow the same
        pattern in the Pulumi-equivalent constructs.
    - id: infrastructure-misconfiguration.state-backend-hardening_rationale
      name: rationale
      prose: Terraform state is the IaC's authoritative record of what infrastructure
        exists; an attacker who can modify state can inject phantom resources, alter
        attribute values to bypass other controls, or exfiltrate credentials that
        exist in state attributes. The substrate's L2 review confirms the backend's
        hardening posture; the test template exercises the locking and access-restriction
        properties so they do not silently regress.
    links:
    - rel: authoritative-source
      text: NIST SP 800-53 Rev. 5 SC-28 Protection of Information at Rest, AC-3 Access
        Enforcement
      href: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home
