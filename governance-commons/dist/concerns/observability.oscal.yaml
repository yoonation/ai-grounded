    - name: applies-to-environment
      ns: governance-commons
      value: any-production
    parts:
    - id: observability.metric-naming-convention_smt
      name: statement
      prose: 'Metric registration calls use names that match the substrate''s default
        naming convention: lowercase snake_case characters only; a measurement-semantic
        suffix indicating the unit and aggregation kind (_total for monotonic counters,
        _seconds for duration histograms, _bytes for size measurements, _ratio for
        unit-bounded ratios, _count for monotonic event counters where _total is inappropriate);
        no customer-identifier or other high-cardinality value embedded in the metric
        name (those are label keys, governed by observability.cardinality-discipline).
        The convention is the substrate default; consumers may select an alternative
        consistent convention through profile tailoring and the binding''s rule-format-override
        hook.'
    - id: observability.metric-naming-convention_rationale
      name: rationale
      prose: Inconsistent metric naming defeats cross-service discovery. An operator
        investigating an incident searches metrics by name fragment; finding api_request_total
        in service A but APIRequestsCount in service B and request_count in service
        C forces the operator to learn each service's convention instead of relying
        on naming as a navigation tool. Stored queries (PromQL, Datadog queries) that
        aggregate across services break when names diverge. Dashboards that rely on
        naming patterns to fill rows automatically fail silently. The Prometheus convention
        is the substrate default because it is the most widely adopted, has explicit
        guidance from the Prometheus project, and aligns with OpenTelemetry semantic
        conventions (which themselves reference Prometheus practice). Consumers using
        a different metric backend may inherit a different convention through profile
        tailoring; substrate provides the regex hook for the binding to accept the
        consumer's alternative.
    links:
    - rel: authoritative-source
      text: Prometheus Metric and Label Naming Best Practices (substrate default convention
        base)
      href: https://prometheus.io/docs/practices/naming/
    - rel: authoritative-source
