        a worse on-call experience than a less-instrumented service whose alerts are
        crisp. Alert discipline is therefore the highest-leverage L2 check in observability:
        it is what operators actually consume during incidents. Substrate-author note:
        many of the concepts substantively informing this rule (alerting on symptoms
        not causes, alerting on burn rate, alert quality as a leading indicator of
        operational maturity) originate from the Google SRE Book and SRE Workbook.
        The substrate paraphrases the concepts and cites the source without reproducing
        the text.'
