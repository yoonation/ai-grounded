      href: https://opentelemetry.io/docs/specs/otel/metrics/api/#instrument-naming-rule
  - id: observability.no-sensitive-data-in-telemetry
    class: substrate-rule
    title: Sensitive data classes (credentials, PII, PHI, payment card data, session
      identifiers, full bearer tokens) do not appear as values in span attributes,
      metric labels, or trace baggage
    props:
    - name: rule-id
      ns: governance-commons
      value: observability.no-sensitive-data-in-telemetry
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: maintainability
    - name: severity
      ns: governance-commons
      value: critical
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-532
    - name: cwe
      ns: governance-commons
      value: CWE-200
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: observability.no-sensitive-data-in-telemetry_smt
      name: statement
      prose: 'Span attributes, metric labels, and trace baggage emitted from production
        code do not contain credentials, PII (including names, emails, addresses,
        government identifiers), PHI, payment card data, full session identifiers,
        or full bearer tokens. The rule applies across all telemetry channels: OpenTelemetry
        span attributes, OpenTelemetry metric attributes, Prometheus label values,
        Datadog tag values, vendor custom attribute setters, and trace baggage propagation.
        Redaction occurs at the telemetry emission boundary, not in downstream pipeline
        stages, because intermediate retention (collector buffers, vendor backend
        ingest queues) can compromise the pipeline before redaction stages execute.'
    - id: observability.no-sensitive-data-in-telemetry_rationale
      name: rationale
      prose: 'Telemetry data is treated by most operational teams as lower-sensitivity
        than logs because metric aggregation appears to anonymize and traces appear
        limited in time. Both assumptions fail at the attribute level: a metric labeled
        with user_email is a per-user lookup table; a span attribute carrying a session
        token is a credential that propagates downstream via baggage. Telemetry backends
        typically retain raw spans for 7 to 30 days at full fidelity, derived aggregates
        for longer; the disclosure surface is the full retention window. Trace baggage
        propagation amplifies the exposure: any downstream service inheriting baggage
        receives the sensitive values without explicitly requesting them. The substrate-recommended
        emission pattern: pass bounded identifiers (tenant_id, account_id, request_id,
        customer_id where customer_id is an internal opaque identifier rather than
        an email or phone number) as attributes; pass aggregated outcomes (response
        status, latency bucket, error class) as metric labels with bounded cardinality;
        never pass request bodies, response bodies, full headers, or framework session
        objects as attributes.'
    links:
    - rel: authoritative-source
      text: 'OpenTelemetry Semantic Conventions: General Attribute Naming (attribute
        hygiene guidance)'
      href: https://opentelemetry.io/docs/specs/semconv/general/attribute-naming/
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V11 Logging and Error Handling (sensitive data exclusion,
        applies to all telemetry channels)
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x20-V11-BusLogic.md
    - rel: authoritative-source
      text: OWASP Logging Cheat Sheet (data-to-exclude section, applied to span attributes
        and metric labels by analogy)
      href: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
    - rel: authoritative-source
      text: CWE-532 Insertion of Sensitive Information into Log File (applied to telemetry
        by analogy)
      href: https://cwe.mitre.org/data/definitions/532.html
    - rel: authoritative-source
      text: CWE-200 Exposure of Sensitive Information to an Unauthorized Actor
      href: https://cwe.mitre.org/data/definitions/200.html
  - id: observability.semantic-convention-coverage
    class: substrate-rule
    title: Spans for HTTP servers, database calls, messaging, and RPC carry the OpenTelemetry
      semantic-convention attributes appropriate to their span kind
    props:
    - name: rule-id
      ns: governance-commons
      value: observability.semantic-convention-coverage
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
