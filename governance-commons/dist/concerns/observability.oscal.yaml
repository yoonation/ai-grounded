    - id: observability.alerting-discipline_smt
      name: statement
      prose: 'Alert rules carry: a severity label drawn from a bounded vocabulary
        appropriate to the consumer''s paging policy (substrate-recommended starting
        set: critical for human-paging conditions, warning for ticket-creating conditions,
        info for record-only conditions); a runbook_url annotation linking to the
