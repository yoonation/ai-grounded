      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-production
    parts:
    - id: observability.slo-policy_smt
      name: statement
      prose: 'The service has an explicitly documented decision on its SLO selection
        and error budget policy. The decision is recorded in a MADR document following
        the substrate''s decision-framework template (see decision-framework link).
        The MADR is stored in the application''s decision-record location (substrate-recommended
        path: /docs/decisions/ADR- XXX-observability-slo-policy.md) and is referenced
        from the application''s architectural documentation. The MADR addresses every
        section the substrate''s template requires: SLI selection (which signals reflect
        customer experience), SLO targets (the numeric reliability commitment), measurement
        window (the rolling period over which SLO is computed), error budget computation
        (how budget consumption is calculated), and budget burndown response (what
        the team does when budget consumption crosses policy thresholds).'
    - id: observability.slo-policy_rationale
      name: rationale
      prose: SLO selection cascades through every other observability rule. Without
        an explicit SLO, the dashboard SLI panels (observability.dashboard-discipline)
        have nothing to anchor to; the alerting discipline (observability.alerting-discipline)
        cannot use burn-rate alerts (the substrate-recommended pattern); the cardinality
        discipline (observability.cardinality-discipline) cannot prioritize which
        metrics are load-bearing for SLO computation versus discretionary. The error
        budget policy operationalizes the SLO. Without an explicit error budget policy,
        the SLO becomes a number on a dashboard rather than a decision-making input.
        Teams without an error budget policy oscillate between feature work and reliability
        work based on whoever shouts loudest in the latest incident review.
  - id: observability.trace-context-propagation
    class: substrate-rule
    title: Outbound HTTP and gRPC calls in instrumented services propagate W3C trace
      context (traceparent header or equivalent) so that downstream spans attach to
      the correct trace
    props:
    - name: rule-id
      ns: governance-commons
      value: observability.trace-context-propagation
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: maintainability
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-production
    parts:
    - id: observability.trace-context-propagation_smt
      name: statement
      prose: Outbound HTTP and gRPC calls from instrumented services propagate the
        active OpenTelemetry context to the downstream service. Propagation occurs
        through W3C Trace Context headers (traceparent and tracestate) for HTTP, through
        gRPC metadata for gRPC, and through explicit propagator.inject calls for any
        transport where auto-instrumentation is unavailable. Calls that construct
        request objects manually without invoking a propagator inject step are detected
        and flagged. The instrumentation entrypoint (HTTPClient wrapper, gRPC interceptor)
        is the substrate-recommended attachment point; per-call manual propagation
        is substrate-acceptable when consistent.
    - id: observability.trace-context-propagation_rationale
      name: rationale
      prose: 'Distributed tracing has value only when traces survive across service
        boundaries. A service that emits spans locally but does not propagate context
        to its callees produces trace fragments: each service appears as a root span,
        no causal chain reconstructs the request flow. During incident investigation
        operators expect to follow a slow request from ingress through every downstream
        call; fragmented traces force the operator to manually correlate by timestamp
        and customer identifier, which is slow and error-prone. The substrate-recommended
        instrumentation pattern is automatic: language-specific OpenTelemetry instrumentation
        packages (opentelemetry-instrumentation-requests, opentelemetry-instrumentation-httpx,
        opentelemetry-instrumentation-aiohttp, equivalents across languages) wrap
        the most-used client libraries so context propagation is automatic. Manual
        propagation is reserved for: custom transports not covered by auto-instrumentation;
        integrations where wrapping is impractical (a legacy HTTP client passed across
        an internal abstraction boundary); cases where the propagation point is structurally
        separate from the call site.'
    links:
    - rel: authoritative-source
      text: W3C Trace Context Recommendation (traceparent header format and propagation
        requirements)
      href: https://www.w3.org/TR/trace-context/
    - rel: authoritative-source
      text: 'OpenTelemetry Specification: API Propagators (propagator API and inject/extract
        semantics)'
      href: https://opentelemetry.io/docs/specs/otel/context/api-propagators/
    - rel: authoritative-source
      text: 'OpenTelemetry: Instrumenting Libraries (auto-instrumentation and manual
        propagation patterns)'
      href: https://opentelemetry.io/docs/concepts/instrumentation/libraries/
