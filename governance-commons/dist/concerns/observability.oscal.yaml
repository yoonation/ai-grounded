      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-production
    parts:
    - id: observability.cardinality-discipline_smt
      name: statement
      prose: 'Metric label values are drawn from bounded vocabularies whose cardinality
        is predictable at service design time and verifiable in cardinality audits.
        The substrate-recommended bounded vocabularies are: tenant_id (where the tenant
        set is bounded by business unit count), region (the deployment region list),
        environment (production, staging, development), service version, endpoint
        template (the routed path pattern not the substituted URL), HTTP status code,
        error class. The substrate-recognized unbounded vocabularies that must NOT
        be label values are: user_id, customer email, session identifier, request
        identifier, raw URL with substituted parameters, arbitrary user input, free-form
        error messages, full timestamps. Each metric carries documentation of the
        bounded vocabulary for each of its labels.'
    - id: observability.cardinality-discipline_rationale
      name: rationale
      prose: Cardinality is the dominant cost driver for time-series metric backends.
        Prometheus tsdb storage cost grows linearly with active series count; vendor
        SaaS billing typically charges per custom metric (defined as a name plus label
        combination). A metric with a user_id label in a service with 100,000 active
        users produces 100,000 series for that one metric, multiplying for each additional
        value of every other label dimensionally. The substrate-recommended pattern
        lifts identity questions out of metrics and into traces (where per-request
        identity is captured in span attributes governed by observability.no-sensitive-data-in-telemetry
        and bounded by retention rather than continuously growing) or into logs (where
        structured fields carry identity with retention-based cost discipline).
    links:
    - rel: authoritative-source
      text: 'Prometheus Instrumentation Practices: Do Not Overuse Labels (cardinality
        guidance)'
      href: https://prometheus.io/docs/practices/instrumentation/#do-not-overuse-labels
    - rel: authoritative-source
      text: 'OpenTelemetry Semantic Conventions: Attribute Naming (cardinality consideration
        for attribute selection)'
      href: https://opentelemetry.io/docs/specs/semconv/general/attribute-naming/
  - id: observability.dashboard-discipline
    class: substrate-rule
    title: Dashboards are organized by an established methodology (RED, USE, or Four
      Golden Signals) appropriate to the service type, with SLI panels distinguished
      from operational panels
    props:
    - name: rule-id
      ns: governance-commons
      value: observability.dashboard-discipline
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: maintainability
    - name: severity
      ns: governance-commons
      value: medium
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-production
    parts:
    - id: observability.dashboard-discipline_smt
      name: statement
      prose: 'Dashboards are authored using an established methodology appropriate
        to the service type. For request-driven services (HTTP servers, gRPC servers,
        API gateways): the RED methodology (rate, errors, duration) or Four Golden
        Signals (latency, traffic, errors, saturation) is the substrate-default. For
        resource-constrained components (databases, queues, caches, storage systems):
        the USE methodology (utilization, saturation, errors) is the substrate-default.
        For services with both profiles: a composite dashboard with sections for each
        methodology applies. SLI panels (answering "is the service meeting its SLO?")
        are placed on a separate, pinned dashboard; operational panels live on subsidiary
        dashboards organized by the methodology.'
    - id: observability.dashboard-discipline_rationale
      name: rationale
      prose: 'Established dashboard methodologies (RED, USE, Four Golden Signals)
        exist because incident-response research has surfaced the consistent set of
        questions operators ask first: how much traffic, how many errors, how slow.
        A dashboard organized by an established methodology is immediately navigable
        to any operator who has learned the methodology; a dashboard organized by
        ad-hoc authoring vocabulary forces each operator to learn the local convention.
        SLI separation is operational hygiene at a different layer. The SLI dashboard
        answers the question executives, on-call responders, and product owners share:
        is the service still meeting its commitments? Mixing this question with the
        engineering question (what is the service doing right now?) produces a dashboard
        that is noisy for the executive audience and slow for the engineering audience.'
    links:
    - rel: authoritative-source
      text: 'Brendan Gregg: The USE Method (utilization, saturation, errors)'
      href: https://www.brendangregg.com/usemethod.html
