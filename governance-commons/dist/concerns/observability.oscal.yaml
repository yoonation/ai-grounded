      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-production
    parts:
    - id: observability.semantic-convention-coverage_smt
      name: statement
      prose: Spans emitted from instrumented services attach the OpenTelemetry semantic-convention
        attributes appropriate to the span's kind. HTTP server spans carry http.request.method,
        http.route (the templated route pattern, not the substituted URL), http.response.status_code,
        and server.address. HTTP client spans carry the equivalent client-side attributes.
        Database spans carry db.system, db.operation, and db.namespace where applicable.
        Messaging spans carry messaging.system, messaging.destination.name, and messaging.operation
        kind. RPC spans carry rpc.system, rpc.service, and rpc.method. Substrate-recommended
        additional attributes are documented in the review checklist; deviations from
        the standard attribute set are documented in the consumer's instrumentation
        ADR.
    - id: observability.semantic-convention-coverage_rationale
      name: rationale
      prose: 'The OpenTelemetry semantic conventions exist specifically so that cross-service
        tooling (vendor backends, open-source collectors, query engines, exemplar
        correlation) can ask uniform questions across services that may be authored
        by different teams in different languages. The convention is substantive only
        when services follow it: a service that emits HTTP spans with attribute name
        "url" instead of "http.route" is invisible to a query that asks about http.route
        latency. The L2 review ensures the consumer''s services agree on the convention''s
        vocabulary so that operational tooling produces a coherent cross-service view.'
    links:
    - rel: authoritative-source
      text: 'OpenTelemetry Semantic Conventions: HTTP Spans (server, client, request,
        response attribute set)'
      href: https://opentelemetry.io/docs/specs/semconv/http/http-spans/
    - rel: authoritative-source
      text: 'OpenTelemetry Semantic Conventions: Database Spans (db.system, db.operation,
        db.statement guidance)'
      href: https://opentelemetry.io/docs/specs/semconv/database/database-spans/
    - rel: authoritative-source
      text: 'OpenTelemetry Semantic Conventions: Messaging Spans (messaging.system,
        messaging.destination, messaging.operation)'
      href: https://opentelemetry.io/docs/specs/semconv/messaging/messaging-spans/
    - rel: authoritative-source
      text: 'OpenTelemetry Semantic Conventions: RPC Spans (rpc.system, rpc.service,
        rpc.method)'
      href: https://opentelemetry.io/docs/specs/semconv/rpc/rpc-spans/
  - id: observability.slo-policy
    class: substrate-rule
    title: The service has an explicitly documented SLO selection and error budget
      policy covering SLI choice, SLO targets, error budget computation, and burndown
      response
    props:
    - name: rule-id
      ns: governance-commons
      value: observability.slo-policy
    - name: layer
