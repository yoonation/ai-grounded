    - id: input-validation.path-traversal-prevention_smt
      name: statement
      prose: Every file system access (open, read, write, stat, delete, mkdir) whose
        path is constructed from a value crossing the trust boundary resolves the
        path to its canonical form and confirms that the resolved path is inside a
        designated base directory. The resolution uses the platform's canonical-path
        function (Python os.path.realpath, Node.js fs.realpathSync, Java File.getCanonicalPath,
        Go filepath.Clean plus filepath.Abs, Ruby File.expand_path). The containment
        check compares the canonical path's prefix against the canonical base directory.
    - id: input-validation.path-traversal-prevention_rationale
      name: rationale
      prose: 'Path traversal exploits combine the path-separator characters (../ and
        \..\) with the platform''s path-joining function: a user-supplied component
        like "../../etc/passwd" joined onto "/var/app/uploads/" produces a path outside
        the upload directory. The substrate''s L1 defense is structural: canonicalize
        first (which resolves the .. components), then confirm containment in the
        allowed scope. Both steps are required; canonicalization without containment
        check accepts paths anywhere on the file system, and containment check without
        canonicalization can be bypassed by encoded traversal sequences.'
