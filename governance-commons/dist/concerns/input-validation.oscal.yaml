      prose: Contextual output encoding is the structural defense against the XSS
        family. Modern template engines and view libraries default to context-aware
        escaping; vulnerabilities typically arise from explicit opt-out rather than
        from the default path. The L1 rule catches the opt-out call sites mechanically
        so that their presence forces deliberate review. The rule does not require
        that ALL user input be escaped (some content is intentionally HTML, such as
        user-authored blog posts or rich text fields). Instead, the rule requires
        that the escape opt-out be visible, reviewed, and accompanied by a substantive
        sanitization step (DOMPurify, bleach, an HTML sanitizer with an allowlist
