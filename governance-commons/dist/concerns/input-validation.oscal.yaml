    - name: applies-to-environment
      ns: governance-commons
      value: any-with-database-access
    parts:
    - id: input-validation.parameterized-queries_smt
      name: statement
      prose: Every database query that incorporates a value from outside the application's
        trust boundary uses the database driver's parameterized-query mechanism. The
        parameterized mechanism keeps query text and parameter values as separate
        transport-layer elements; the database server treats parameters as data values
        regardless of their content. String concatenation, string interpolation, f-string
        composition, template rendering, or any other technique that produces a single
        query string with user-supplied substrings embedded is forbidden. The rule
        applies to SQL and to SQL-like languages (HQL, JPQL, Cypher, GraphQL when
        executed against a backend that interprets it, MongoDB query documents constructed
        dynamically).
    - id: input-validation.parameterized-queries_rationale
      name: rationale
      prose: 'SQL injection is the canonical injection vulnerability. Parameterized
        queries solve it structurally: the driver transmits the query template and
        the parameter values over separate channels and the database server applies
        the parameters at execution time without re-parsing. Application-layer escaping
        is fragile: edge cases in character encoding, quoting conventions, and database-specific
        syntax escape the escape. Parameterized queries do not have these failure
        modes because the parameter never re-enters the SQL parser. The rule operates
        at L1 because the pattern (string concatenation in a database call) is locally
        detectable; semantic correctness (does the parameter represent the right value?)
        is L2.'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V5.3.4 (Parameterized queries or properly contextually
        escaped output prevent injection)
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x13-V5-Validation-Sanitization-Encoding.md
