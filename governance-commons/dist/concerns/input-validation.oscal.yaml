  - id: input-validation.no-unsafe-deserialization
    class: substrate-rule
    title: Deserialization of data crossing the trust boundary uses safe loaders that
      do not execute embedded code
    props:
    - name: rule-id
      ns: governance-commons
      value: input-validation.no-unsafe-deserialization
    - name: layer
