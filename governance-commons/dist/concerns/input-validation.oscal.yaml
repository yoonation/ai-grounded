  - id: input-validation.parameterized-queries
    class: substrate-rule
    title: Database queries use parameterized statements rather than string concatenation
      or interpolation with user-supplied values
    props:
    - name: rule-id
      ns: governance-commons
      value: input-validation.parameterized-queries
    - name: layer
      ns: governance-commons
      value: mechanical
