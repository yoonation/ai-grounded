    parts:
    - id: testing-strategy.no-empty-test-body_smt
      name: statement
      prose: Every test function (a function recognized by the project's test framework
        as a test, including pytest functions matching the test_* pattern, Jest test()
        and it() callbacks, JUnit @Test methods, Go Test* functions, RSpec describe/it
        blocks) contains at least one assertion invocation that verifies behavior.
        Acceptable forms include framework assertions (assert, assertEqual, assertThat,
        expect().toEqual, should.equal), library matchers (Hamcrest, AssertJ, Chai),
        and custom assertion helpers that ultimately invoke a framework assertion.
        Test functions whose body is empty, contains only setup code, or only invokes
        the system under test without verifying the result are forbidden.
    - id: testing-strategy.no-empty-test-body_rationale
      name: rationale
      prose: 'Empty test bodies (or assertion-free test bodies) are tests that cannot
        fail. They produce green signal regardless of the system''s actual behavior;
        they contribute to coverage metrics while providing no verification. The pattern
        arises three ways: from "I''ll write the assertions later" placeholders that
        never get filled in, from copy-paste of scaffolding without filling in the
        body, and from refactoring that removes the assertion but leaves the test
        in place. The rule operates at L1 because the absence of any assertion call
        is statically detectable via AST analysis. Whether the assertions are meaningful
        (test the right thing, distinguish behavior changes, exercise edge cases)
        is L2 review territory.'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V14.1 (test execution evidence requires substantive
