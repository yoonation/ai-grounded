      value: CWE-1006
    - name: applies-to-environment
      ns: governance-commons
      value: any
    parts:
    - id: testing-strategy.test-pyramid-composition_smt
      name: statement
      prose: 'The application''s test suite has a documented pyramid composition (or
        alternative shape: trophy, diamond, custom) declared in the testing-strategy.testing-strategy
        strategy ADR. The composition specifies the substrate-acceptable ratios across
        test tiers (unit / integration / contract / end-to-end) and the application''s
        actual ratios. The ratios are monitored: CI tooling reports test counts per
        tier; a periodic review (or PR-time check) confirms the actual ratios stay
        within tolerance of the documented target.'
    - id: testing-strategy.test-pyramid-composition_rationale
      name: rationale
      prose: Pyramid composition is the substrate's foundation for the test suite's
        cost-to-value ratio. Unit tests are fast and produce localized failure signals;
        integration tests catch boundary defects but at higher cost; end-to-end tests
        verify the full user-facing system but are slow, flaky, and diagnostically
        poor. The pyramid metaphor (broad base of unit tests, narrower mid-tier of
        integration tests, narrow top of end-to-end tests) optimizes this trade-off
        for many applications. Alternative shapes (Kent C. Dodds' testing trophy,
        Google's small/medium/large), suit different architectures. The substrate's
        L2 review confirms that the application has chosen a shape, documented it
        in the ADR, and is operating consistently with that choice. The rule is L2
        because the choice of shape and the acceptable ratios are application-specific.
        The substrate cannot prescribe; reviewers verify the application has made
        an explicit choice and is operating accordingly.
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V14.1 (substrate-relevant testing coverage)
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x22-V14-Config.md
    - rel: authoritative-source
      text: ISO/IEC/IEEE 29119-2:2021 (test process specification including test architecture
        decisions)
