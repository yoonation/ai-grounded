  - id: testing-strategy.deterministic-execution
    class: substrate-rule
    title: Tests execute deterministically across runs and environments, independent
      of order, time, external state, and concurrency
    props:
    - name: rule-id
      ns: governance-commons
      value: testing-strategy.deterministic-execution
    - name: layer
