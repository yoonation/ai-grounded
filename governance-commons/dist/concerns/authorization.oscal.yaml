  - id: authorization.least-privilege-role-design
    class: substrate-rule
    title: Roles and permissions are designed to grant the minimum access needed for
      the role's function; privilege creep is reviewed and pruned periodically
    props:
    - name: rule-id
      ns: governance-commons
      value: authorization.least-privilege-role-design
    - name: layer
