    parts:
    - id: authorization.authorization-model-selection_smt
      name: statement
      prose: 'Applications subject to this rule have an explicitly documented decision
        on their authorization model. The decision is recorded in a MADR document
        following the substrate''s decision-framework template (see decision-framework
        link). The MADR is stored in the application''s decision-record location (substrate-recommended:
        /docs/decisions/ADR-XXX-authorization-model.md) and is referenced from the
        application''s architectural documentation. The MADR addresses every section
        the substrate''s template requires; deviations from substrate-recommended
        choices are explicitly justified.'
    - id: authorization.authorization-model-selection_rationale
      name: rationale
      prose: 'The authorization model choice is the structural decision that propagates
        through every authz-related code path. RBAC encodes "the principal has a role;
        the role grants permissions; the permissions allow actions." ABAC encodes
        "the principal''s attributes, evaluated against the resource''s attributes
        and the environmental attributes, evaluate to a decision under a policy expression."
        ReBAC encodes "the principal stands in a documented relationship to the resource;
        the relationship grants actions per a graph of permissions." Each model fits
        some applications well and others poorly. RBAC fits applications where user
        populations divide cleanly into job functions with stable permission grants.
        ABAC fits applications where authorization depends on context that varies
        per request (department, clearance level, time of day, request origin). ReBAC
        fits applications where the authorization graph is the dominant structure
        (file sharing, social-graph access, document collaboration). Hybrid composition
        fits applications whose authorization concerns span multiple patterns. The
        wrong-model failure mode is consistent: authorization code that fights the
        chosen model accretes complexity. RBAC encoding of attribute-based requirements
        produces explosive role proliferation (one role per attribute combination).
        ABAC encoding of simple role requirements produces policy expressions that
        replicate what a role lookup would have expressed in one line. ReBAC encoding
        of role-based access produces relationship graphs that flatten back into roles.
        The substrate''s stance: make the choice deliberately. The MADR captures the
        deliberation. The choice does not commit the application forever (models can
        evolve), but the choice does commit the application''s near-term authorization
        surface to the chosen model''s idioms.'
