  - id: authorization.no-client-side-only-authz
    class: substrate-rule
    title: Privileged actions are not authorized only in client code; server-side
      enforcement is present and observable
    props:
    - name: rule-id
      ns: governance-commons
      value: authorization.no-client-side-only-authz
    - name: layer
      ns: governance-commons
      value: semantic
