    parts:
    - id: authorization.authz-before-resource-access_smt
      name: statement
      prose: In code paths that operate on a resource identified by a client-supplied
        identifier (URL path parameter, query string, request body field), the code
        performs an authorization decision on that specific resource before reading,
        returning, or mutating the resource. The order is authorize-then-act, not
        act-then-authorize. Static analysis flags ORM queries, raw database queries,
        file-system reads, or external-service calls keyed by client-supplied identifier
        that are not preceded by an authorization call in the same code path.
    - id: authorization.authz-before-resource-access_rationale
      name: rationale
      prose: 'The IDOR class of failures is the structural consequence of fetching
        first and authorizing later (or not at all). The attacker pattern is uniform:
        take a legitimate request, change the resource identifier to one belonging
        to another principal, observe whether the application returns the resource.
        When the authorization is missing or applied to the request principal rather
        than the resource principal, the attack succeeds with no other prerequisites.
        Detection at the call-ordering level is mechanical: static analysis can identify
        ORM query expressions that take a request-scoped identifier as input and determine
        whether an authorization call has been made in the same function before the
        query. The full semantic correctness check (does the authorization evaluate
        the right subject and resource pair?) is authorization.object-level-authorization
        review-grade work, not mechanical.'
    links:
    - rel: authoritative-source
      text: 'OWASP ASVS v5.0.0 V8.2.1 (Object-level access control: resource access
        is mediated by an authorization decision specific to the resource)'
