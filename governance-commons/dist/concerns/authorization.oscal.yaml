    parts:
    - id: authorization.centralized-deny-by-default-policy_smt
      name: statement
      prose: 'Authorization decisions in the application flow through a centralized
        policy point. The policy point is a named authorization function, a policy
        engine (Cedar, OPA Rego, Casbin), or a framework-native authorization abstraction
        (Django Guardian, Spring Security, Ruby Pundit, Laravel Gates and Policies)
        that consults a managed policy expressed as data rather than as business code.
        The default decision for any unspecified case is deny: when the policy does
        not explicitly grant the requested action to the principal, the policy point
        returns deny rather than allow. The policy is expressed in a form that can
        be unit tested independently of business logic: tests load the policy and
        assert specific principal-action-resource combinations evaluate to expected
        decisions, without exercising the business handlers that the policy gates.'
    - id: authorization.centralized-deny-by-default-policy_rationale
      name: rationale
      prose: 'Centralization: when authorization logic lives in one place (one function,
        one engine, one policy file set), policy state is auditable from that artifact.
        When authorization logic is scattered across business code (the authorization.no-hardcoded-role-strings
        mechanical anti-pattern), determining what the application currently permits
        requires grepping the codebase and manually reconciling overlapping comparisons.
        Deny-by-default: the failure mode for unspecified cases is critical to the
        policy''s safety property. Allow-by-default means every new action implicitly
        grants access to every principal until an explicit deny is added; the failure
        mode is silent expansion of access. Deny-by-default means every new action
        is initially inaccessible until an explicit allow is added; the failure mode
        is loud (the feature does not work) and is corrected at feature work time.
        Testability: policy that is data can be loaded into a test harness, evaluated
        against test cases, and asserted against expected outputs. Policy that is
        business code can only be tested by exercising the business handlers it gates,
        conflating policy bugs with business-logic bugs. Separable policy testing
        surfaces policy issues independently and supports test-driven development
        of policy changes.'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V8.3.1 (Authorization enforced at trusted service layer)
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x17-V8-Authorization.md
