  - id: authorization.mass-assignment-allowlist
    class: substrate-rule
    title: Request-payload parameter binding uses an explicit allowlist of bindable
      fields; mass assignment is prevented at the binding layer
    props:
    - name: rule-id
      ns: governance-commons
      value: authorization.mass-assignment-allowlist
    - name: layer
