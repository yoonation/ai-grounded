    - name: applies-to-framework
      ns: governance-commons
      value: client-server-architectures
    - name: applies-to-environment
      ns: governance-commons
      value: web-applications-and-mobile-applications
    parts:
    - id: authorization.no-client-side-only-authz_smt
      name: statement
      prose: Privileged actions (state-mutating operations, sensitive-data reads,
        role-changing operations, administrative operations) are not authorized only
        in client code. Client-side authorization mechanisms (JavaScript role-conditional
        UI hiding, mobile-app view-controller branching by role, single-page-app route
        guards, attribute-driven element visibility) are acceptable as UX hints but
        never as the only enforcement layer. The server-side handler for the same
        action independently enforces the same authorization decision; the server-side
        check does not trust client-supplied role assertions, client-supplied permission
        claims, or client-supplied authorization tokens that have not been validated
        against an authoritative source.
    - id: authorization.no-client-side-only-authz_rationale
      name: rationale
      prose: Client code is fully under attacker control. Browser developer tools
        allow runtime modification of any JavaScript variable, override of any conditional,
        and arbitrary fetch invocation. Mobile app binaries are trivially reverse-engineered
        and modified. API calls may be issued directly from curl, Postman, or custom
        scripts that never load the client UI at all. Any authorization decision visible
        only in client code is bypassed by the most basic penetration-test techniques.
        The pattern's frequency in production systems comes from developer assumption
        that hiding the UI hides the capability. Hiding the UI hides the discovery
        path for legitimate users; it does not prevent exploitation by attackers.
        The substrate's stance is that client-side hiding is acceptable as UX (so
        users don't see disabled buttons) but server-side enforcement is mandatory.
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V8.1.4 (Authorization controls fail securely and cannot
        be bypassed by manipulating client-side state)
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x17-V8-Authorization.md
    - rel: authoritative-source
      text: OWASP Top 10 2021 A01:2021 Broken Access Control (client-side enforcement
        examples)
      href: https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    - rel: authoritative-source
      text: CWE-602 Client-Side Enforcement of Server-Side Security
      href: https://cwe.mitre.org/data/definitions/602.html
  - id: authorization.no-hardcoded-role-strings
    class: substrate-rule
    title: Authorization decisions in business logic do not compare against hardcoded
      role or permission literal strings
    props:
    - name: rule-id
      ns: governance-commons
      value: authorization.no-hardcoded-role-strings
    - name: layer
      ns: governance-commons
      value: mechanical
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-547
    - name: cwe
      ns: governance-commons
      value: CWE-732
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-with-authorization
    parts:
    - id: authorization.no-hardcoded-role-strings_smt
      name: statement
      prose: 'Authorization decisions in business-logic code do not compare against
        hardcoded literal role or permission strings. Code expressions of the form
        `principal.role == "admin"` (or the language-equivalent) inside business-logic
        functions are violations. Authorization decisions are made by calling a named
        authorization function (substrate-recommended signature: authorize(principal,
        resource, action)) or by querying a policy engine (Cedar, OPA Rego, Casbin)
        that consults a managed policy expressed as data. Typed enums for role identifiers
        used in policy definition (not in business logic) are acceptable; the prohibition
        is on inline literal-string comparison within business-logic call sites.'
    - id: authorization.no-hardcoded-role-strings_rationale
      name: rationale
      prose: 'When authorization decisions are scattered across the codebase as inline
        role-string comparisons, the application''s policy is the union of every such
        comparison, with no centralized representation that can be audited, changed
        atomically, or tested in isolation. Concrete failure modes: Policy drift:
        role-string comparisons in one code path use "admin", another uses "administrator",
        a third uses "ADMIN". Each works in isolation; together they form a non-deterministic
        policy that fails inconsistently. Typo bypass: a comparison against "adimn"
        (typo) silently never matches, allowing every principal past the check. The
        typo passes code review because role-string literals look interchangeable.
        Audit opacity: when an auditor asks "what does an editor role grant?" the
        answer requires grepping the entire codebase for "editor" comparisons. Policy
        state is not visible from any single artifact. Policy change cost: granting
        a new permission to an existing role requires editing every code path that
        checks against that role, each as a separate code change. Centralized policy
        makes the change one edit to a policy file.'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V8.3.1 (Authorization is enforced at a trusted service
        layer)
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x17-V8-Authorization.md
    - rel: authoritative-source
      text: NIST SP 800-53 AC-3 Access Enforcement and AC-25 Reference Monitor
      href: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home
    - rel: authoritative-source
      text: CWE-547 Use of Hard-coded, Security-relevant Constants
      href: https://cwe.mitre.org/data/definitions/547.html
  - id: authorization.object-level-authorization
    class: substrate-rule
    title: For every endpoint accepting a client-supplied object identifier, the handler
      verifies the calling principal is authorized to access THAT specific object
    props:
    - name: rule-id
      ns: governance-commons
      value: authorization.object-level-authorization
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: critical
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-639
    - name: cwe
      ns: governance-commons
      value: CWE-284
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-with-client-supplied-identifiers
    parts:
    - id: authorization.object-level-authorization_smt
      name: statement
      prose: For every API endpoint that accepts an object identifier from the client
        (URL path parameter, query string field, request body field, GraphQL argument),
        the handler verifies that the calling principal is authorized to access THAT
        SPECIFIC OBJECT. Class-level authorization (the principal can access objects
        of type Document) is necessary but not sufficient; object-level authorization
        (the principal can access this Document with ID 12345) is required. The check
        evaluates the subject-resource pair against the application's authorization
        policy and returns a boolean or raises a denial error before the resource
        is returned, modified, or otherwise acted upon.
    - id: authorization.object-level-authorization_rationale
      name: rationale
      prose: 'BOLA (Broken Object Level Authorization) is the most common API-level
        failure. The pattern is consistent: the endpoint is authenticated and checks
        the principal has the role required to use the endpoint (class-level authz),
        but the endpoint returns whichever object the URL identifier names, regardless
        of whether the principal owns or otherwise should have access to that specific
        object. The attacker enumerates object identifiers (often sequential integers
        or guessable UUIDs) and reads or modifies objects belonging to other principals.
        The mechanical pairing (authorization.authz-before-resource-access) catches
        the worst case (no authz call at all between resource identifier read and
        resource access). The semantic pairing (this rule) confirms that when there
        is an authz call, it evaluates the right pair: the calling principal and the
        specific resource named by the client-supplied identifier.'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V8.2.1 (Object-level access control)
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x17-V8-Authorization.md
    - rel: authoritative-source
      text: OWASP API Security Top 10 2023 API1:2023 Broken Object Level Authorization
      href: https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
    - rel: authoritative-source
      text: CWE-639 Authorization Bypass Through User-Controlled Key
      href: https://cwe.mitre.org/data/definitions/639.html
  - id: authorization.protected-route-declares-authz
    class: substrate-rule
    title: Every protected route handler declares a server-side authorization check
      observable to static analysis
    props:
    - name: rule-id
      ns: governance-commons
      value: authorization.protected-route-declares-authz
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: critical
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-862
    - name: cwe
      ns: governance-commons
      value: CWE-285
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-with-protected-endpoints
    parts:
    - id: authorization.protected-route-declares-authz_smt
      name: statement
      prose: Every route handler whose path is protected (not explicitly public) declares
        a server-side authorization check before processing the request. The check
        is declarative (framework decorator, middleware registration, attribute annotation,
        or controller metadata) or imperative (explicit call to an authorization function
        within the handler body). The check appears in source code observable to static
        analysis. Routes that lack such a check are treated as implicitly public;
        the substrate requires public routes to be tagged explicitly via comment,
        decorator, or framework attribute so that the absence of an authorization
        check is a deliberate, documented choice rather than an omission.
    - id: authorization.protected-route-declares-authz_rationale
      name: rationale
      prose: 'Missing authorization is the most common access-control failure mode
        in production systems. The pattern is consistent across many incident reports:
        a new route handler is added during feature work, the author relies on framework
        conventions or shared middleware that does not cover the new route, and the
        omission is invisible at code review because the route appears to work correctly
        for authorized test users. Static detection of authorization-check presence
        catches the omission before deployment. The deny-by-default principle requires
        that authorization absence be treated as failure, not as success. Tagging
        public routes explicitly inverts the default: the failure mode becomes false-positive
        flagging of legitimately public routes, which surfaces immediately at code
        review and is corrected with a one-line annotation.'
    links:
    - rel: authoritative-source
      text: 'OWASP ASVS v5.0.0 V8.1.1 (General access control: every endpoint enforces
        an access control decision before processing)'
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x17-V8-Authorization.md
    - rel: authoritative-source
      text: OWASP Top 10 2021 A01:2021 Broken Access Control
      href: https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    - rel: authoritative-source
      text: NIST SP 800-53 AC-3 Access Enforcement
      href: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home
    - rel: authoritative-source
      text: CWE-862 Missing Authorization
      href: https://cwe.mitre.org/data/definitions/862.html
  - id: authorization.step-up-and-audit-for-privilege-changes
    class: substrate-rule
    title: Privilege-changing operations require step-up authentication and emit immutable
      audit events; operations affecting other users' privileges follow an approval
      pattern where the context warrants
    props:
    - name: rule-id
      ns: governance-commons
      value: authorization.step-up-and-audit-for-privilege-changes
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
      ns: governance-commons
      value: security
    - name: severity
      ns: governance-commons
      value: high
    - name: lifecycle-status
      ns: governance-commons
      value: stable
    - name: cwe
      ns: governance-commons
      value: CWE-269
    - name: cwe
      ns: governance-commons
      value: CWE-285
    - name: applies-to-language
      ns: governance-commons
      value: any
    - name: applies-to-framework
      ns: governance-commons
      value: any
    - name: applies-to-environment
      ns: governance-commons
      value: any-with-privilege-granting-operations
    parts:
    - id: authorization.step-up-and-audit-for-privilege-changes_smt
      name: statement
      prose: 'Operations that grant, revoke, or modify roles or permissions require
        step-up authentication: the application re-prompts for credentials or a strong
        authentication factor regardless of the current session''s authentication
        recency. Such operations emit structured audit events to an append-only or
        otherwise tamper-evident store. The audit events capture the requesting principal,
        the target principal (if different), the role or permission being changed,
        the direction of change (grant/revoke/modify), timestamp, and request-correlation
        identifier. For applications where the context warrants (regulated industries,
        applications with high-privilege administrative roles), operations affecting
        other users'' privileges follow an approval workflow that requires a second
        principal to authorize the change before it takes effect.'
    - id: authorization.step-up-and-audit-for-privilege-changes_rationale
      name: rationale
      prose: 'Privilege-change operations are the attacker''s escalation path. A compromised
        low-privilege session that can be used to grant administrative roles to attacker-controlled
        accounts becomes a full compromise. Step-up authentication interrupts the
        simple-session-hijack pattern by requiring fresh authenticator evidence at
        the privilege-change moment, not just at session start. Audit events are the
        post-incident investigation surface. An incident response asking "who granted
        this role and when?" requires the audit events to exist. The events must be
        tamper-evident because the attacker''s interest in erasing the trail is high.
        Approval workflow adds a second-principal requirement: even with step-up auth
        on a compromised principal, the privilege change does not take effect without
        a second principal''s approval. Approval workflow is application-context-dependent;
        not every application warrants the operational overhead. The substrate recommends
        approval workflow for applications whose privilege-grants have high blast
        radius (administrative roles in regulated systems, privilege-grants that enable
        financial-impact operations, privilege-grants in multi-tenant systems where
        escalation reaches other tenants).'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V8.4.3 (Privilege-changing operations require step-up
        authentication)
      href: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x17-V8-Authorization.md
    - rel: authoritative-source
      text: NIST SP 800-53 AC-3(7) Role-Based Access Control and AU-2 Event Logging
      href: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home
    - rel: authoritative-source
      text: CWE-269 Improper Privilege Management
      href: https://cwe.mitre.org/data/definitions/269.html
