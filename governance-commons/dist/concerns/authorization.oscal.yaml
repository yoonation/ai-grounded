      ns: governance-commons
      value: any-with-request-to-model-binding
    - name: applies-to-environment
      ns: governance-commons
      value: any-with-persistence
    parts:
    - id: authorization.mass-assignment-allowlist_smt
      name: statement
      prose: 'Endpoints that bind request payloads to domain objects (web forms, JSON
        request bodies, GraphQL input objects, protobuf messages) use an explicit
        allowlist of bindable fields. The allowlist is declared in code at the binding
        layer (form definition, DTO class, schema declaration). Fields not in the
        allowlist cannot be written from the request, regardless of whether the underlying
        model exposes them. Sensitive fields (role, is_admin, permissions, status,
        owner_id, tenant_id, and application-defined privilege markers) are not in
        request-bound allowlists unless explicit authz policy permits the specific
        principal to modify them. Block-list (denylist) approaches are not substrate-approved:
        denylists fail open on every new model field, requiring developers to remember
        to add new fields to the denylist.'
    - id: authorization.mass-assignment-allowlist_rationale
      name: rationale
      prose: 'Mass assignment is the data-layer equivalent of missing authorization.
        The HTTP request reaches a handler that is authorization-checked for the action;
        the handler then bulk-binds the request body to the model and writes whatever
        the request contained, including fields the handler never intended to expose
        for writing. The framework''s convenience method (Model.create(**request.json),
        user.update(**req.body), entity.merge(input)) makes the pattern easy to introduce.
        The allowlist-only requirement inverts the failure mode: forgetting to add
        a field to the allowlist fails closed (the field can''t be written from the
        request), which surfaces immediately at feature work. Forgetting to add a
        field to a denylist fails open (the field IS writable from the request), which
        is silent until exploitation.'
    links:
    - rel: authoritative-source
      text: OWASP ASVS v5.0.0 V8.3.4 (Authorization decisions cover updates to model
