  - id: authorization.multi-tenant-data-layer-isolation
    class: substrate-rule
    title: In multi-tenant systems, data queries enforce tenant isolation at the data-access
      layer, not only at the application layer
    props:
    - name: rule-id
      ns: governance-commons
      value: authorization.multi-tenant-data-layer-isolation
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
