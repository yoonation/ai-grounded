      value: any
    parts:
    - id: privacy.purpose-limitation-and-minimization_smt
      name: statement
      prose: Personal data is collected only for the purposes declared for it and
        is limited to the fields those purposes actually require; data is not collected
        on the chance it may prove useful. A use of personal data for a purpose other
        than the one it was collected for requires a new basis compatible with the
        original purpose, recorded before the secondary use begins. The declared purposes
        come from privacy.personal-data-purpose-annotation and the privacy.lawful-basis-and-consent-policy
        policy, and the fitness of data used to train or evaluate a model is owned
        by responsible-ai; this rule cross-references both. The review is triggered
        when a collection surface is added or changed, or a new use of existing personal
        data is proposed.
    - id: privacy.purpose-limitation-and-minimization_rationale
      name: rationale
      prose: Every personal field a system stores is a field it must protect, justify,
        expose to access and erasure requests, and account for in a breach; minimization
        is therefore not austerity but the direct reduction of obligation and risk.
        The two failures are over-collection (grabbing whatever the client sends because
        the schema is permissive) and function-creep (using data gathered for one
        purpose for a new one because the data is already there). The substrate keeps
        this an L2 review because necessity and compatibility are judgments, and pairs
        it with a test template because the narrower mechanical question, whether
        the accepted field set matches the declared-purpose schema, is concrete. It
        defers the purpose declarations to privacy.personal-data-purpose-annotation
        and the L3 policy and the data-fitness judgment to responsible-ai.
    links:
    - rel: authoritative-source
      text: EU GDPR Regulation 2016/679 (Article 5(1)(b) purpose limitation and Article
