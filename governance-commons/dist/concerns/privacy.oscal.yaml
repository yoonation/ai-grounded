  - id: privacy.no-personal-data-in-url
    class: substrate-rule
    title: Personal data is not placed in URL path segments or query strings, where
      it leaks into logs, history, and referrer headers
    props:
    - name: rule-id
      ns: governance-commons
      value: privacy.no-personal-data-in-url
