  - id: privacy.retention-limitation
    class: substrate-rule
    title: Personal data has a defined retention period per category and is deleted
      or irreversibly anonymized at expiry
    props:
    - name: rule-id
      ns: governance-commons
      value: privacy.retention-limitation
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
