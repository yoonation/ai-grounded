    parts:
    - id: privacy.processor-and-transfer-safeguards_smt
      name: statement
      prose: Personal data shared with a processor acting on the application's behalf
        is bound by a data-processing agreement that limits the processor to documented
        instructions, and personal data transferred outside the home jurisdiction
        relies on a recognized transfer mechanism. Sub-processors are disclosed, and
        onward sharing inherits the same safeguards. This rule is verified by review
        of the agreements and the data-flow configuration rather than by a test, because
        the obligations are contractual and organizational. Where the shared data
        carries a sensitivity class its handling is owned by data-classification,
        and a third-party code dependency rather than a data processor is owned by
        supply-chain; this rule cross-references both. The review is triggered when
        a new processor or cross-border data flow is introduced.
    - id: privacy.processor-and-transfer-safeguards_rationale
      name: rationale
      prose: 'The boundary of a system is not the boundary of its personal-data responsibility:
        the moment data leaves for a processor or another jurisdiction, the safeguards
        that keep it lawful become contractual and configurational rather than coded,
        and the controller stays accountable. The failure is sharing by default, a
        vendor integration wired up without an agreement, a region chosen for latency
        without a transfer mechanism, an onward processor nobody disclosed. The substrate
        keeps this an L2 review and deliberately gives it no test template, because
        the obligations live in signed agreements and data-flow topology that no assertion
        in application source can prove; this is the same honesty the substrate applies
        wherever verification is review-and-evidence rather than test. It cross-references
        data-classification for the class-specific handling and supply-chain for code
        dependencies rather than restating them.'
    links:
