  - id: privacy.purpose-limitation-and-minimization
    class: substrate-rule
    title: Personal data is collected only for declared purposes and limited to what
      those purposes need, with secondary use requiring a new compatible basis
    props:
    - name: rule-id
      ns: governance-commons
      value: privacy.purpose-limitation-and-minimization
    - name: layer
      ns: governance-commons
      value: semantic
    - name: characteristic
