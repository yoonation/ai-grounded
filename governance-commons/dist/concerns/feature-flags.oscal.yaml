        and when each is used); the flag taxonomy (release, experiment, operational
        or kill-switch, permission) and the lifecycle and expiry policy for each type;
        the fail-static and default-polarity convention (feature-flags.fail-static-default);
        the evaluation-context schema, its stable targeting key, and its personal-data
