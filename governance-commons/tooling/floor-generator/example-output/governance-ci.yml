# Generated by the governance-commons floor generator (Stage 5, unpinned cut).
# Stack: python, typescript, terraform, alerting. Regenerate from the L1 layer; do not edit by hand.
# Deploy-time provenance gates (run in your deploy pipeline, not here): cosign, slsa-verifier.
name: governance-floor
'on':
  pull_request: {}
  push:
    branches:
    - main
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Pinned tool versions (from registry; install these exact versions)
      run: 'echo ''pinned: amtool==0.33.0 bandit==1.9.4 cosign==3.1.1 eslint==10.5.0
        gitleaks==8.30.1 npm==11.17.0 opengrep==1.22.0 osv-scanner==2.3.8 ruff==0.15.17
        slsa-verifier==2.7.1 tflint==0.63.1 trivy==0.71.1 uv==0.11.21'''
    - name: amtool (0.33.0)
      run: amtool check-config <alerting-config>
    - name: bandit (1.9.4)
      run: uv run bandit -q -r .
    - name: eslint (10.5.0)
      run: npx eslint .
    - name: gitleaks (8.30.1)
      run: gitleaks detect --redact
    - name: npm (11.17.0)
      run: npm ci
    - name: opengrep (1.22.0)
      run: opengrep scan --config auto .
    - name: osv-scanner (2.3.8)
      run: osv-scanner scan .
    - name: ruff (0.15.17)
      run: uv run ruff check && uv run ruff format --check
    - name: tflint (0.63.1)
      run: tflint
    - name: trivy (0.71.1)
      run: trivy config .
    - name: uv (0.11.21)
      run: uv lock --check
