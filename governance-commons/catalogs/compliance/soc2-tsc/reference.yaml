description: >
  SOC 2 reports examine the effectiveness of a service organization's
  controls relevant to the Trust Services Criteria (TSC): Security
  (Common Criteria), Availability, Processing Integrity,
  Confidentiality, and Privacy. Used widely by SaaS and cloud
  service providers to demonstrate operational maturity to customers.

  SOC 2 reports come in two types:
  - Type I - control design at a point in time
  - Type II - control design plus operating effectiveness over a period
    (typically 6-12 months)

  SOC 2 is not a certification - it is an attestation produced by a
  CPA firm following AICPA standards. SOC 2 reports are typically
  distributed under NDA to customers; the AICPA standards behind
  them are copyrighted.

