  catalog_id: soc2-tsc
  catalog_name: AICPA SOC 2 Trust Services Criteria (TSC) 2017 with 2022 revisions
  schema_version: 1.0.0
  last_reviewed: 2026-05-12
  upstream_source: https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services
  upstream_version: "2017 TSC, with 2022 revisions integrated"
