mappings:

  - target_framework: nist-800-53-rev5
    relationship: heavy-overlap
    notes: >
      SOC 2 CC family criteria map substantially to 800-53 control
      families: CC6 (Logical and Physical Access) maps to 800-53 AC,
      IA, PE families; CC7 (System Operations) maps to SI, IR, CM
      families; CC8 (Change Management) maps to CM family; CC9 (Risk
      Mitigation) maps to RA, CP families. Organizations satisfying
      800-53 Moderate baseline typically satisfy SOC 2 CC criteria
      with minimal additional work.

  - target_framework: iso-27001
    relationship: heavy-overlap
    notes: >
      SOC 2 Common Criteria and ISO 27001 Annex A controls overlap
      substantially. Many service organizations pursue both
      simultaneously. The 2022 SOC 2 revisions aligned criteria
      more closely with ISO 27001:2022 controls.

  - target_framework: nist-ai-rmf
    relationship: complementary
    notes: >
      SOC 2 does not directly address AI risks. Organizations operating
      AI systems often extend their SOC 2 scope with AI-specific
      criteria via additional matters or supplemental schedules. AI
      RMF provides the AI risk management content that SOC 2 lacks.

  - target_framework: eu-ai-act
    relationship: complementary
    notes: >
      SOC 2 reports do not constitute EU AI Act compliance evidence
      directly, but a SOC 2 Type II report can serve as supporting
      evidence for Article 17 quality management system requirements
      and Article 12 logging and record-keeping obligations.

applicability:
  recommended_when:
    - Organization is a SaaS or cloud service provider
    - Customer contracts require SOC 2 Type II reports
    - Organization is preparing for or maintaining SOC 2 attestation
    - Targeting roles at companies with active SOC 2 programs

  less_critical_when:
    - Pure technical work with no customer attestation requirements
    - Pre-revenue AI research
    - On-premise enterprise software not commonly SOC 2 attested

access:
  full_text_source: AICPA - purchase or member access required
  purchase_url: https://www.aicpa-cima.com/resources/landing/system-and-organization-controls-soc-suite-of-services
  approximate_cost: "USD 99-199 for the TSC reference, varies by AICPA membership"
  cheaper_access:
    - AICPA members have included access in some membership tiers
    - Large CPA firms maintain organizational AICPA subscriptions
    - Compliance platforms (Vanta, Drata, Secureframe) reproduce TSC text under license

usage_in_framework:
  - Cross-reference target for OSCAL mappings (cite by criterion ID)
  - Threat catalog related_compliance field can reference SOC 2 IDs
  - Project teams targeting SOC 2 attestation can populate full
    criteria text in a private fork; never commit verbatim AICPA
    text to public repositories
  - Audit conversations cite this reference file's category and
    section IDs; auditors and CPA firms have licensed access

gotchas:
  - Do not reproduce AICPA TSC text in public commits
  - SOC 2 is an attestation, not a certification. Reports are
    typically distributed under NDA
  - The 2022 revisions integrated changes from COSO 2013 framework
    and ISO 27001 alignment
  - SOC 2 Type II reports are organization-specific. The TSC are
    framework; the report is the evidence. Don't confuse the two

ai_specific_note: >
  AICPA released a complementary AI Trust Services Criteria in late
  2025 to address AI-specific risks within SOC 2 reports. This
  framework supplements rather than replaces the standard TSC and is
  emerging as an industry standard for AI service attestation. When
  AICPA publishes the AI TSC in stable form, this reference file
  will be updated to include its structure. As of last review, the
  AI TSC was in draft or pilot form.
