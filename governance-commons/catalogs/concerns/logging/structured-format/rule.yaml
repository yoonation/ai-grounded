id: logging.structured-format
name: Application log output uses a structured format (JSON or key-value) rather than
  free-form prose
layer: mechanical
characteristic: maintainability
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-20'
  entered_stable: '2026-05-22'
  authored_by: Myoung Hong
sources:
- title: OWASP ASVS v5.0.0 V11 Logging and Error Handling (structured logging requirement)
  url: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x20-V11-BusLogic.md
- title: OWASP Top 10 2021 A09 Security Logging and Monitoring Failures (insufficient
