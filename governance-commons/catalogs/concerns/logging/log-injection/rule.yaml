id: logging.log-injection
name: Log records are not constructed by string concatenation or interpolation of unvalidated
  user input
layer: mechanical
characteristic: maintainability
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-20'
  entered_stable: '2026-05-22'
  authored_by: Myoung Hong
