id: logging.correlation-ids
name: Log records include a correlation identifier (request, trace, or session ID) that
  links the record to other records produced during the same logical operation
layer: semantic
characteristic: maintainability
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-20'
  entered_stable: '2026-05-22'
  authored_by: Myoung Hong
