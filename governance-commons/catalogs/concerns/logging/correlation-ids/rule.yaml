  url: https://www.w3.org/TR/trace-context/
- title: OpenTelemetry Logs specification (correlation with trace context)
  url: https://opentelemetry.io/docs/specs/otel/logs/
- title: OWASP ASVS v5.0.0 V11 Logging (event identification and correlation)
