references: []
statement: 'Span attributes, metric labels, and trace baggage emitted from production
  code do not contain credentials, PII (including names, emails, addresses, government
  identifiers), PHI, payment card data, full session identifiers, or full bearer tokens.
  The rule applies across all telemetry channels: OpenTelemetry span attributes, OpenTelemetry
  metric attributes, Prometheus label values, Datadog tag values, vendor custom attribute
  setters, and trace baggage propagation. Redaction occurs at the telemetry emission boundary,
  not in downstream pipeline stages, because intermediate retention (collector buffers,
  vendor backend ingest queues) can compromise the pipeline before redaction stages execute.'
rationale: 'Telemetry data is treated by most operational teams as lower-sensitivity than
  logs because metric aggregation appears to anonymize and traces appear limited in time.
  Both assumptions fail at the attribute level: a metric labeled with user_email is a
  per-user lookup table; a span attribute carrying a session token is a credential that
  propagates downstream via baggage. Telemetry backends typically retain raw spans for
  7 to 30 days at full fidelity, derived aggregates for longer; the disclosure surface
  is the full retention window. Trace baggage propagation amplifies the exposure: any
  downstream service inheriting baggage receives the sensitive values without explicitly
  requesting them. The substrate-recommended emission pattern: pass bounded identifiers
  (tenant_id, account_id, request_id, customer_id where customer_id is an internal opaque
  identifier rather than an email or phone number) as attributes; pass aggregated outcomes
  (response status, latency bucket, error class) as metric labels with bounded cardinality;
  never pass request bodies, response bodies, full headers, or framework session objects
  as attributes.'
