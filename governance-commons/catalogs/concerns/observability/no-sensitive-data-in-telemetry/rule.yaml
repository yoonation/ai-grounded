id: observability.no-sensitive-data-in-telemetry
name: Sensitive data classes (credentials, PII, PHI, payment card data, session identifiers,
  full bearer tokens) do not appear as values in span attributes, metric labels, or trace
  baggage
layer: semantic
characteristic: maintainability
severity: critical
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-21'
  entered_stable: '2026-05-22'
  authored_by: Myoung Hong
