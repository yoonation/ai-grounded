id: monitoring-alerting.alerting-strategy
name: 'The alerting strategy is documented in an ADR: detection-coverage philosophy, the
  severity-to-routing matrix, the escalation and on-call model, the alert lifecycle, the
  meta-monitoring approach, and the post-incident feedback loop'
