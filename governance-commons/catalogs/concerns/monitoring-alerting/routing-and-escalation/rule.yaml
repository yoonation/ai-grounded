id: monitoring-alerting.routing-and-escalation
name: Alerts route by severity to the correct receiver, and a paging alert left unacknowledged
  within a bound escalates to a secondary responder
layer: semantic
characteristic: reliability
severity: high
status: stable
provenance:
  ai_assistance: drafted
