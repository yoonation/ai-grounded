  url: https://sre.google/sre-book/practical-alerting/
applies_to:
  language: any
  framework: any
  environment: any
references: []
statement: 'A documented on-call rotation covers every hour of the period the service
  is operated, defines a handoff between outgoing and incoming responders, and aligns
  with the escalation targets monitoring-alerting.routing-and-escalation routes pages to, so a page fired at any time
  reaches a responsible human. The rule is review-only: it confirms the human coverage
  the routing and escalation mechanics depend on. A rotation with an uncovered window,
  an undefined handoff, or escalation targets that do not match the rotation is the finding.'
rationale: 'The most carefully built routing and escalation chain still terminates at
  a human, and if no human is on the other end the chain is decorative. Coverage gaps
  are the quiet failure: the rotation looks complete until a holiday or a departed engineer
  leaves a window nobody owns, and the gap is discovered only when a page falls into it.
  The handoff is the second failure: an outgoing responder who stops watching before the
  incoming one is ready leaves a seam where pages are missed. The substrate makes this
  a review-only rule, with no test template, because a rotation is an organizational artifact
  that no application-source test can settle, the same honesty applied to the contractual
  privacy.processor-and-transfer-safeguards and agentic-systems.instruction-data-separation rules. It cross-references the routing and escalation it
  underwrites (monitoring-alerting.routing-and-escalation) and the strategy that records the model (monitoring-alerting.alerting-strategy).'
