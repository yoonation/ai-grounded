id: secrets-management.sensitive-files-gitignored
name: Sensitive configuration files (private keys, credential archives, vault unlock material)
  are excluded from version control by enforced .gitignore entries
layer: mechanical
characteristic: security
severity: critical
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-20'
  entered_stable: '2026-05-22'
  authored_by: Myoung Hong
sources:
