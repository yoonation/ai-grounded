statement: Authentication endpoints (login, password reset, MFA challenge, token endpoints,
  account recovery) implement rate limiting that constrains the rate at which requests
  are accepted. Rate limiting operates at both per-source (typically per-IP) and per-target
  (per-account or per-credential) granularities. The limits are tuned to the application's
  threat model with the substrate-recommended starting points described in the guidance
  section. The rate-limit response is uniform with respect to authentication outcome (does
  not signal whether credentials would have been correct).
rationale: 'Rate limiting is the substrate''s primary defense against credential stuffing
  and brute force attacks. Credential stuffing tests breached credential pairs against
  the application at scale; without rate limiting an attacker can test millions of pairs
  quickly and identify the small percentage that succeed. Brute force tests passwords
  against known accounts; without rate limiting weak passwords fall within minutes. Rate
  limiting is Layer 2 rather than Layer 1 because detection requires semantic understanding:
  which endpoints are authentication endpoints (framework-specific routing knowledge),
  whether the rate-limit configuration is appropriate (judgment about application risk
  profile), and whether all auth paths are covered (cross-endpoint review). Semgrep cannot
  reliably make these determinations.'
