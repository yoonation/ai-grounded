id: supply-chain.sbom-presence-and-validity
name: Every production release accompanied by a valid SBOM in CycloneDX or SPDX format
layer: semantic
characteristic: security
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-23'
  entered_stable: '2026-05-26'
  authored_by: Myoung Hong
sources:
- title: CycloneDX v1.6 SBOM specification (OWASP-stewarded SBOM format; substrate-default
    for component-and-vulnerability SBOM use cases)
  url: https://cyclonedx.org/specification/overview/
- title: SPDX v2.3 SBOM specification (Linux Foundation; v3.0 emerging; substrate-accepted
    format for license-and-provenance SBOM use cases)
  url: https://spdx.dev/specifications/
- title: CISA SBOM Minimum Elements (substrate references for US federal SBOM expectations;
    2026 update in progress)
  url: https://www.cisa.gov/sbom
- title: NIST SP 800-218 SSDF v1.1 PS.3 (Archive and Protect Each Software Release with
    associated metadata including SBOM)
  url: https://csrc.nist.gov/pubs/sp/800/218/final
- title: EU Regulation 2024/2847 (Cyber Resilience Act) Annex I Part II (vulnerability
    handling requires identifying and documenting components in products with digital
    elements; SBOM is the substrate's recommended instrument)
  url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
- title: OWASP ASVS v5.0.0 V14.2 (Build dependency inventory)
  url: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x22-V14-Configuration.md
cwe:
- CWE-1395
applies_to:
  language: any
  framework: any
  environment: any-with-production-releases
references: []
statement: 'Every production release artifact has an associated Software Bill of Materials
  in CycloneDX v1.6 or SPDX v2.3 format. The SBOM is generated by the build platform from
  the build environment and committed alongside the release artifact (in the same OCI
  registry as a referrers-attached attestation, in the same GitHub release as a release
  asset, or in the consumer''s substrate-recommended SBOM repository per supply-chain.attestation-and-sbom-retention
  retention discipline). The SBOM enumerates each component with at minimum: component
  name, version, supplier or namespace, and an integrity hash. CycloneDX and SPDX are
  both substrate-accepted because they cover overlapping use cases with different strengths;
  the consumer profile selects which is preferred.'
rationale: The substrate elects SBOM presence as L1 rather than L2 because both generation
  (build-time machinery) and validation (format conformance) are mechanically checkable.
  SBOM utility (does the SBOM accurately represent the components in the artifact?) is
  L2 semantic territory and is covered by supply-chain.attestation-and-sbom-retention retention and audit discipline.
  The L1 rule catches the failure mode where SBOM generation was never attempted; the
  L2 rules catch the failure mode where SBOM generation was performed but the SBOM drifted
  from reality. The substrate accepts both CycloneDX and SPDX because they have different
  strengths. CycloneDX is strongest for component-and-vulnerability use cases (the substrate's
  primary use case in production-grade-baseline). SPDX is strongest for license-and-provenance
  use cases. CycloneDX 1.6 is substrate-default; SPDX 2.3 is substrate-accepted; SPDX
  3.0 will be substrate-accepted on stable release.
