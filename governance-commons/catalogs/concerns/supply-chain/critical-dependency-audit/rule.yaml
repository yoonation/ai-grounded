id: supply-chain.critical-dependency-audit
name: Critical dependencies identified, classified, and audited on a substrate-documented
  cadence
layer: semantic
characteristic: security
severity: medium
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-23'
  entered_stable: '2026-05-26'
  authored_by: Myoung Hong
sources:
- title: NIST SP 800-161r1 Cybersecurity Supply Chain Risk Management Practices for Systems
    and Organizations
  url: https://csrc.nist.gov/pubs/sp/800/161/r1/final
