id: supply-chain.dependency-vetting
name: New production dependencies undergo substrate-documented vetting before adoption
  with an artifact recording the assessment outcome
layer: semantic
characteristic: security
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-23'
  entered_stable: '2026-05-26'
  authored_by: Myoung Hong
sources:
