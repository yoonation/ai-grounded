    supply-chain posture)
  url: https://github.com/ossf/scorecard
references: []
statement: 'Before a new dependency enters the consumer''s production surface, it undergoes
  a substrate-documented vetting process. The vetting produces an artifact (a committed
  markdown file, a tracker issue, an ADR, or a substrate-recommended template) recording:
  the dependency identity (name, version pin, ecosystem); the substrate-recognized supply-chain
  signals (maintainer activity, OpenSSF Scorecard score, last release recency, signing
  posture, SBOM availability); the consumer''s rationale for adoption (problem solved,
  alternatives considered, decision driver); the consumer-side audit obligations going
  forward (audit cadence per supply-chain.critical-dependency-audit, deprecation triggers); and the approver identity
  (who in the consumer organization signed off). The artifact format is substrate-recommended;
  the substrate ships a template at examples/supply-chain/dependency-vetting-template.md.
  The rule applies to production dependencies: test-only, build-tooling-only, and exploratory
  adoptions are exempt.'
rationale: 'Most supply-chain incidents in the past five years trace to dependencies that
  entered the production surface without per-adoption review. The substrate''s vetting
  discipline does not promise to catch every malicious dependency at adoption time; it
  does guarantee an audit trail for each adoption that anchors the consumer''s incident
  response. When an advisory drops on a dependency the consumer adopted, the vetting artifact
  is the consumer''s documentation of why the dependency was chosen, who chose it, what
  alternatives were considered, and what audit obligations followed. The substrate accepts
  that vetting adds friction. The friction is the point: dependencies are not free. Each
  adoption commits the consumer to ongoing audit burden (supply-chain.critical-dependency-audit) and incident response
  obligation (supply-chain.vulnerability-disclosure-response). The vetting artifact makes the burden visible at adoption
  rather than at advisory time.'
