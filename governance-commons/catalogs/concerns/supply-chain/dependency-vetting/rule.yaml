  url: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x22-V14-Configuration.md
- title: OWASP SCVS Software Component Verification Standard v1.0 (component vetting checklist
    anchored in the SBOM surface)
  url: https://owasp.org/www-project-software-component-verification-standard/
