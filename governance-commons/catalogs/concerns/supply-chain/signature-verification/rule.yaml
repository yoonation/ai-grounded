id: supply-chain.signature-verification
name: Artifact signature verified against the consumer's allowed-signers policy before
  production deployment
layer: mechanical
characteristic: security
severity: critical
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-23'
  entered_stable: '2026-05-26'
  authored_by: Myoung Hong
sources:
