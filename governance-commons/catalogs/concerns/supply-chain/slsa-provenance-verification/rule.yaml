statement: 'Every artifact deployed to production carries a SLSA provenance attestation
  that is verified at deployment time. The verification step is gated in the CI/CD pipeline:
  a deployment cannot proceed without a successful attestation verification result. The
  attestation must satisfy the consumer''s profile-selected SLSA Build Level threshold
  (substrate-default Build L2 for production-grade-baseline profile; L3 for stricter profiles:
  financial-services, healthcare, government). The verification consults a transparency
  log (Sigstore Rekor by substrate default) and verifies the signing identity against
  the consumer''s allowed-signers policy. Artifacts lacking an attestation during the
  substrate-recommended transition window (consumer-defined deadline; substrate-recommended
  six months for new dependency adoption) are tracked via the substrate''s exemption-handling
  discipline.'
rationale: Build provenance is the substrate's answer to the question "where did this
  artifact come from, who built it, from what source, in what environment, and how do
  I know the answer is trustworthy?" The SLSA framework operationalizes this question
  with a layered requirements model (Build L1 generates provenance; Build L2 signs it;
  Build L3 hardens the build platform against insider tampering). The substrate elects
  Build L2 as the production-grade-baseline threshold because Build L2 requires the build
  platform to generate the attestation (not the producer claiming the build platform did),
  with a verifiable signing identity. Build L3 raises the bar to attacker-resistant build
  platforms (hosted services with hermeticity and isolation guarantees); the substrate
  recommends L3 for profiles with elevated regulatory or risk posture. The substrate's
  verification gate is consumer-side because attestation generation is upstream (the build
  platform's responsibility) but attestation enforcement is consumer's responsibility
  (the deployment surface). The substrate publishes the verification discipline; the consumer
  implements the gate in their CI/CD.
