id: supply-chain.supply-chain-integrity-strategy
name: Substrate consumer authors and maintains a supply-chain integrity strategy ADR documenting
  SLSA level target, attestation scope, SBOM cadence, signing identity policy, transparency
  log selection, and exemption discipline
layer: judgmental
characteristic: security
severity: high
status: stable
provenance:
