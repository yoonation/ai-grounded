references: []
statement: 'The consumer authors and maintains an ADR (Architecture Decision Record) documenting
  their supply-chain integrity strategy. The ADR addresses each substrate-required decision:
  target SLSA Build Level (1, 2, or 3 substrate-recommended; consumer may select higher);
  attestation scope (which artifacts carry attestations, which predicate types are required);
  SBOM cadence (every release, every patch, every dependency change); SBOM format (CycloneDX
  or SPDX or both); signing identity policy (which OIDC issuers, which signer patterns,
  which signature schemes); transparency log selection (Sigstore Rekor public-good, self-hosted
  Rekor, equivalent); retention horizon (substrate-recommended profile-keyed defaults;
  consumer may deviate with rationale); exemption discipline (criteria for accepting unverified
  artifacts during transition; maximum transition window; approver identity). The ADR
  is committed under the consumer''s substrate-recommended ADR directory and reviewed
  on a substrate-recommended annual cadence or upon regulatory change (substrate-recommended
  explicit attention to EU CRA full-enforcement activation 2027-12-11).'
rationale: 'Supply-chain integrity is a portfolio of decisions, not a single setting.
  The substrate cannot pick the consumer''s SLSA Build Level target because the target
  depends on the consumer''s threat model, regulatory exposure, and engineering investment
  tolerance. The substrate provides the decision framework; the consumer''s ADR records
  the choices. The substrate elects an ADR rather than a profile setting because supply-chain
  strategy decisions interact: choosing SLSA Build L3 implies hosted-hardened build platforms
  which implies a specific set of OIDC issuers which implies a specific allowed-signers
  policy which implies a transparency-log configuration. A profile setting reduces the
  interaction to a single value; an ADR preserves the interaction and the rationale.'
