id: documentation.no-placeholder-documentation
name: Shipped documentation and doc comments contain no unresolved placeholder or TODO
  markers
layer: mechanical
characteristic: interaction-capability
severity: low
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-06-05'
  entered_stable: '2026-06-06'
  authored_by: Myoung Hong
sources:
- title: Diataxis documentation framework, on documentation that is complete and serves
    the reader rather than placeholder content.
  url: https://diataxis.fr/
applies_to:
  language: any
  framework: any
  environment: any
references: []
statement: Committed documentation (doc comments, README and guide files, and reference
  pages) MUST NOT contain unresolved placeholder or TODO markers presented as though the
  content were complete. A documentation artifact that ships with a TODO, TBD, fill-in-here
  stub, or lorem-ipsum placeholder in place of content is a violation.
rationale: 'A reader trusts that shipped documentation is finished. A placeholder defeats
  that trust silently: the reader spends time on a section that turns out to be empty,
  or worse, acts on a stub that looks like guidance. Flagging unresolved placeholders
  keeps the documented surface honest, so that what ships is either real content or an
  explicit, visible gap rather than a stub masquerading as complete.'
