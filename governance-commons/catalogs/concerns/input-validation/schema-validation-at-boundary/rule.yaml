id: input-validation.schema-validation-at-boundary
name: Every input boundary parses request data against an explicit schema before any domain
  logic runs
layer: semantic
characteristic: security
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-23'
  entered_stable: '2026-05-26'
  authored_by: Myoung Hong
sources:
- title: OWASP ASVS v5.0.0 V5.1.3 (Input fields are validated with positive validation,
    allow-lists)
  url: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x13-V5-Validation-Sanitization-Encoding.md
- title: NIST SP 800-53 SI-10 Information Input Validation
  url: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home
