id: input-validation.input-validation-strategy
name: The application has an explicit, documented input validation strategy decision before
  substantive input-validation implementation begins
layer: judgmental
characteristic: security
severity: critical
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-23'
  entered_stable: '2026-05-26'
  authored_by: Myoung Hong
sources:
- title: OWASP ASVS v5.0.0 V5 (Architecture and strategy decisions for input validation)
  url: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x13-V5-Validation-Sanitization-Encoding.md
applies_to:
  environment: any-with-input-boundary
references: []
statement: The application has an Architecture Decision Record (ADR) at a discoverable
  location (substrate-recommended /docs/decisions/ADR-XXX-input-validation -strategy.md)
  that documents the application's input-validation strategy. The ADR addresses the substrate-framework
  decision drivers (validation library choice, schema-first vs imperative placement, canonical
  encoding policy, error response shape, version policy for schemas) and references the
  substrate's decision-framework MADR at governance-commons/decision-frameworks/input-validation-strategy.madr.md.
  The ADR has Status Accepted (or Superseded by a successor ADR); Status Proposed indefinitely
  is not acceptable for an application in production.
rationale: 'Input validation is a cross-cutting concern that spans many modules. Without
  an explicit decision, modules diverge: one module uses Pydantic for its request models,
  another uses Marshmallow, another uses hand-written validation; canonical forms differ;
  error-response shapes differ. The accumulated divergence is hard to reconcile after
  the fact. The substrate''s L3 rule forces the decision early so the divergence does
  not accumulate. The ADR is the substrate''s contract: the application commits to a strategy;
  subsequent contributors implement against the strategy; the substrate''s L1 and L2 rules
  apply with the strategy''s specific choices made concrete.'
