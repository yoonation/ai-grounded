id: infrastructure-misconfiguration.key-management-design
name: 'Encryption-key management is deliberate: customer-managed vs provider-managed key
  choice is intentional, rotation is enabled, key policies are scoped'
layer: semantic
characteristic: security
severity: medium
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-31'
  entered_stable: '2026-06-01'
  authored_by: Myoung Hong
sources:
- title: NIST SP 800-53 Rev. 5 SC-12 Cryptographic Key Establishment and Management, SC-13
    Cryptographic Protection
  url: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home
- title: NIST SP 800-57 Part 1 Rev. 5 Recommendation for Key Management
  url: https://csrc.nist.gov/pubs/sp/800/57/pt-1/r5/final
cwe:
- CWE-321
