applies_to:
  language: any-iac
  framework: terraform-cloudformation-pulumi-arm-bicep
  environment: any-cloud-encryption-key-construct
references: []
statement: IaC declarations of encryption-key constructs (AWS KMS keys and aliases, Azure
  Key Vault keys, GCP Cloud KMS keys) reflect a deliberate choice between customer-managed
  and provider-managed keys per the profile's tilt; customer-managed keys carry key policies
  scoped to the principals that legitimately use the key; key rotation is enabled at the
  substrate's recommended cadence (annual for provider-managed, annual or shorter for
  customer-managed per profile); keys are not shared across trust boundaries (a workload's
  encryption key is not also used by an unrelated workload). Where a shared key is intentional
  (multi-tenant SaaS with tenant-keyed cryptography), the design is reviewed at architecture-review
  with a documented justification that the infrastructure-misconfiguration.infrastructure-security-baseline MADR governs.
rationale: 'The key-management design determines the meaning of encryption-at-rest. With
  a shared provider-managed key, encryption protects against media theft and snapshot
  misdirection but not against account-level compromise of the cloud-control-plane. With
  a customer-managed key whose key policy denies broad principal access, the same encryption
  additionally protects against the cloud-control-plane compromise scenario. The substrate
  treats this as L2 review because the choice is contextual: a small consumer''s regulatory
  baseline may not require the CMK isolation; a regulated consumer''s baseline does.'
