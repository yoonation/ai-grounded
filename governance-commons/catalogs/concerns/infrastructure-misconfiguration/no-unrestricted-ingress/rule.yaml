id: infrastructure-misconfiguration.no-unrestricted-ingress
name: Network security rules do not declare unrestricted ingress (0.0.0.0/0, ::/0) to
  sensitive ports
layer: mechanical
characteristic: security
severity: critical
status: stable
provenance:
