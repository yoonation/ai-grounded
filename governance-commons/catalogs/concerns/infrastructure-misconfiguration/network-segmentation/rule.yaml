references: []
statement: 'IaC declarations of network topology enforce tiered segmentation: public subnets
  containing only internet-facing load balancers and NAT gateways; application-private
  subnets containing application workloads (compute, containers, serverless); data-private
  subnets containing data-bearing resources (databases, caches with persistence, file
  systems). Cross-tier reachability is via explicit security-group, NSG, or firewall-rule
  references rather than CIDR-based allow-list of the broader subnet. Egress from private
  subnets is via NAT Gateway or cloud-native equivalent with egress controls; egress to
  managed services uses VPC endpoints / Private Endpoints / Private Service Connect rather
  than internet egress. Where a flat network is intentional (isolated CI account, ephemeral
  test environment), the IaC declares the exception with a documented justification that
  the L3 MADR''s exception-governance process covers.'
rationale: The substrate's design choice is to treat network topology as L2 (review-required)
  rather than L1 (mechanically-enforced) because the topology is a composition of resources,
  not a single attribute. A tool can detect that subnets exist and routing tables exist,
  but the semantic question "do the subnets enforce segmentation" requires reasoning about
  the relationships among security groups, NACLs, route tables, and the workload placement.
  The L2 review confirms the topology meets the substrate's tiered-segmentation pattern
  or documents the deviation.
