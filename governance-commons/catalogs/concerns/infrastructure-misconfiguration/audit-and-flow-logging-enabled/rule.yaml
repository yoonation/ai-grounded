id: infrastructure-misconfiguration.audit-and-flow-logging-enabled
name: Cloud resources have audit and flow logging enabled where the resource supports
  it
layer: mechanical
characteristic: security
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-31'
  entered_stable: '2026-06-01'
  authored_by: Myoung Hong
sources:
- title: 'CIS AWS Foundations Benchmark v3.0.0 (Section 3 Logging: CloudTrail, VPC flow
    logs, S3 access logging, ALB access logs, RDS audit logs)'
  url: https://www.cisecurity.org/benchmark/amazon_web_services
- title: 'CIS Azure Foundations Benchmark v2.1.0 (Section 5 Logging and Monitoring: Activity
