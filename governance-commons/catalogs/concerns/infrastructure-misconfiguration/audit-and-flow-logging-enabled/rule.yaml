references: []
statement: 'IaC declares audit and flow logging on every cloud resource that supports
  it. AWS: a multi-region CloudTrail trail with management and data events covering the
  account; VPC flow logs enabled on every VPC; S3 bucket access logging on every S3 bucket
  (delivering to a log-archive bucket that is itself encrypted and access-restricted);
  ALB and NLB access logging; RDS cloudwatch_logs_exports covering audit, error, slowquery,
  and general logs where applicable; EKS audit log enabled. Azure: Activity Log diagnostic
  setting per subscription; NSG flow logs on every NSG; Storage Account diagnostic settings;
  AKS audit log enabled. GCP: Cloud Audit Logs (Admin Activity, Data Access for storage
  and database services) per project; VPC flow logs enabled at the subnet level where
  the substrate''s profile requires; GKE audit logging enabled. Kubernetes: API server
  audit policy is declared in the cluster IaC. Where a resource type does not support
  a native logging capability, the rule does not apply to that resource type; the substrate
  enumerates supported resource types in the L1 binding rather than the catalog.'
rationale: 'Audit logs are the substrate''s evidence base. They cost storage (a managed
  concern via the logging concern''s logging.retention-policy retention rule and via the cost-model-selection
  concern''s COST-L1-* rules governing data-tier choice) and they require downstream pipeline
  (the observability concern governs that pipeline). The substrate''s mechanical check
  is the smallest of these costs: the IaC source either enables logging or does not. The
  substrate is intentionally agnostic about where logs are aggregated (the logging concern''s
  LOG-L2- 004 covers aggregation; the consumer''s regulatory regime drives the sink choice);
  the substrate requires only that logging is enabled at the source.'
