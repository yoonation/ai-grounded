id: agentic-systems.tool-use-authorization
name: Tool-use authorization is enforced at call time against the authority the agent
  was granted
layer: semantic
characteristic: safety
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-06-03'
  entered_stable: '2026-06-04'
  authored_by: Myoung Hong
sources:
- title: OWASP Agentic Security Initiative, agentic threats and mitigations (excessive
    agency, tool misuse, and privilege compromise, referenced as a concept)
  url: https://genai.owasp.org/resource/agentic-ai-threats-and-mitigations/
- title: Cloud Security Alliance MAESTRO threat-modeling for agentic systems (the tool
    and action layer, referenced as a concept)
  url: https://cloudsecurityalliance.org/research/topics/maestro
applies_to:
  language: any
  framework: any
  environment: any
references: []
statement: The agent's calls to tools are authorized at call time against the authority
  the agent was granted, the grant is least-privilege for the agent's purpose, and where
  the agent acts on behalf of a user its effective authority does not exceed that user's
  own permissions. The declared tool scope (agentic-systems.tool-authorization-scope) is enforced on the call path
  rather than merely documented. The underlying user permissions are owned by authorization
  and the tool credential by secrets-management, cross-referenced here.
rationale: An agent is dangerous in proportion to what its tools can do, so the authority
  behind each tool call is the control that bounds the blast radius when the agent is
  wrong or subverted. Excessive agency is repeatedly the difference between a contained
  mistake and a destructive one. The substrate makes this an L2 review because least privilege
  for an agent is contextual (it depends on the agent's purpose and the systems it touches)
  and because a declared scope that is not enforced at call time gives false assurance.
  The rule draws on the L1 scope-declaration floor and cross-references authorization
  rather than restating the user permission model.
