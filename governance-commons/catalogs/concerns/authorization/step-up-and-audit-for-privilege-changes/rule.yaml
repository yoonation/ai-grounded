id: authorization.step-up-and-audit-for-privilege-changes
name: Privilege-changing operations require step-up authentication and emit immutable
  audit events; operations affecting other users' privileges follow an approval pattern
  where the context warrants
layer: semantic
characteristic: security
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-22'
  entered_stable: '2026-05-26'
  authored_by: Myoung Hong
sources:
- title: OWASP ASVS v5.0.0 V8.4.3 (Privilege-changing operations require step-up authentication)
  url: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x17-V8-Authorization.md
- title: NIST SP 800-53 AC-3(7) Role-Based Access Control and AU-2 Event Logging
  url: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home
