references: []
statement: Every route handler whose path is protected (not explicitly public) declares
  a server-side authorization check before processing the request. The check is declarative
  (framework decorator, middleware registration, attribute annotation, or controller metadata)
  or imperative (explicit call to an authorization function within the handler body).
  The check appears in source code observable to static analysis. Routes that lack such
  a check are treated as implicitly public; the substrate requires public routes to be
  tagged explicitly via comment, decorator, or framework attribute so that the absence
  of an authorization check is a deliberate, documented choice rather than an omission.
rationale: 'Missing authorization is the most common access-control failure mode in production
  systems. The pattern is consistent across many incident reports: a new route handler
  is added during feature work, the author relies on framework conventions or shared middleware
  that does not cover the new route, and the omission is invisible at code review because
  the route appears to work correctly for authorized test users. Static detection of authorization-check
  presence catches the omission before deployment. The deny-by-default principle requires
  that authorization absence be treated as failure, not as success. Tagging public routes
  explicitly inverts the default: the failure mode becomes false-positive flagging of
  legitimately public routes, which surfaces immediately at code review and is corrected
  with a one-line annotation.'
