id: authorization.centralized-deny-by-default-policy
name: Authorization policy is centralized, deny-by-default, and expressed in a form that
  can be unit tested independently of business logic
layer: semantic
characteristic: security
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-22'
  entered_stable: '2026-05-26'
  authored_by: Myoung Hong
sources:
- title: OWASP ASVS v5.0.0 V8.3.1 (Authorization enforced at trusted service layer)
  url: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x17-V8-Authorization.md
- title: NIST SP 800-53 AC-3 Access Enforcement and AC-25 Reference Monitor
