id: authorization.multi-tenant-data-layer-isolation
name: In multi-tenant systems, data queries enforce tenant isolation at the data-access
  layer, not only at the application layer
layer: semantic
characteristic: security
severity: critical
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-22'
  entered_stable: '2026-05-26'
  authored_by: Myoung Hong
sources:
- title: OWASP ASVS v5.0.0 V8.5.1 (Multi-tenant isolation enforced at data layer)
  url: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x17-V8-Authorization.md
- title: NIST SP 800-53 AC-4 Information Flow Enforcement
  url: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home
