applies_to:
  language: any
  framework: any
  environment: multi-tenant-systems
references: []
statement: 'In multi-tenant systems where multiple customers, organizations, or other
  tenant entities share the application''s data store, queries against tenant-scoped data
  enforce tenant boundaries at the data-access layer (database, query builder, ORM middleware),
  not only at the application layer. Substrate-acceptable enforcement mechanisms include:
  PostgreSQL Row Level Security policies with tenant-context session variables; per-tenant
  schemas with schema-routing at connection time; query-builder middleware that injects
  a tenant filter into every query and fails the query when tenant context is absent;
  per-tenant databases with connection-string routing. Application-layer tenant filters
  (each query manually adds a tenant_id WHERE clause) are insufficient because they fail
  open on missing checks.'
rationale: 'The application-only enforcement failure mode is consistent across multi-tenant
  incident reports: a developer adds a new query in a feature change, forgets the tenant
  filter (because the filter is discipline, not framework-enforced), and the feature ships.
  The bug is silent: the new query works correctly for the developer''s test tenant because
  they''re already logged in to a tenant. The cross-tenant leak is invisible until either
  a customer reports seeing another customer''s data or a security review catches the
  missing filter. Data-layer enforcement inverts the failure mode. A query without tenant
  context returns no rows (or raises an error, depending on the mechanism); the missing
  filter surfaces immediately at development time. The developer cannot accidentally ship
  a query that crosses tenants because the data layer refuses to execute it. PostgreSQL
  RLS is the substrate-recommended mechanism where PostgreSQL is the data store. The policy
  is declared once per table; every query against the table is automatically filtered.
  The application sets the tenant context via SET LOCAL or SET SESSION at the start of
  each request; queries through the connection inherit the filter. Forgotten tenant context
  produces no-data results, not cross-tenant leaks.'
