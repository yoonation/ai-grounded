id: authorization.audit-events-on-decisions
name: Authorization decisions emit structured audit events including principal, resource,
  action, decision, and timestamp; deny events are captured at security-monitoring severity
layer: semantic
characteristic: security
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-22'
  entered_stable: '2026-05-26'
  authored_by: Myoung Hong
sources:
- title: OWASP ASVS v5.0.0 V8.6.1 (Authorization decisions logged with sufficient detail
    for forensic analysis)
  url: https://github.com/OWASP/ASVS/blob/v5.0.0/5.0/en/0x17-V8-Authorization.md
- title: NIST SP 800-53 AU-2 Event Logging and AU-3 Content of Audit Records
  url: https://csrc.nist.gov/projects/cprt/catalog#/cprt/framework/version/SP_800_53_5_1_1/home
