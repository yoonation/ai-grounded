id: cost-model-selection.workload-resource-limits
name: Every workload declares CPU and memory resource limits; the orchestrator rejects
  workloads that omit them
layer: mechanical
characteristic: performance-efficiency
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-21'
  entered_stable: '2026-05-22'
  authored_by: Myoung Hong
