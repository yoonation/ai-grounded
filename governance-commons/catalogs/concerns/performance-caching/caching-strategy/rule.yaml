id: performance-caching.caching-strategy
name: The application has a documented caching strategy recording what is cached, the
  topology, the key and invalidation conventions, the staleness budgets, the failure posture,
  and the bounding
layer: judgmental
characteristic: performance-efficiency
severity: high
status: stable
provenance:
  ai_assistance: drafted
  entered_draft: '2026-05-31'
  entered_stable: '2026-06-01'
  authored_by: Myoung Hong
applies_to:
  language: any
  framework: any
  environment: any
references: []
statement: 'The application has a recorded caching strategy ADR, discoverable from its
  documentation and current relative to the last significant change, covering seven sub-decisions:
  what is cached and what is never cached (with data-classification constraints as a driver),
  the cache topology and tiers, the key and namespace conventions, the invalidation model
  per data class, the staleness budget per data class, the failure posture, and the sizing
  and eviction policy. The local choices the L1 and L2 rules govern cohere with the strategy.
  The ADR is revisited at significant scale or topology changes and on a periodic cadence.'
rationale: 'Caching fails as a pile of locally reasonable decisions that do not cohere:
  a value cached by one path and invalidated by none, a key convention that differs per
  module so the same data is cached twice under different keys, a sensitive value cached
  in a shared tier because no one wrote down that it must not be. The strategy ADR is
  where these interactions are made visible and owned. The substrate requires it to be
  recorded and complete, not long; a small application''s strategy is short, but it is
  written down and updatable rather than rediscovered after an incident. The seven sub-decisions
  are the minimum that make the eight conformance rules meaningful, and the data-classification
  driver is what keeps caching from quietly violating a data boundary.'
