references: []
statement: The cache backend is bounded by a configured maximum size and an explicit eviction
  policy appropriate to the workload. An in-process cache uses a bounded-capacity structure
  with eviction rather than an unbounded dictionary. The key cardinality is considered
  against the bound. The bound is reviewed at deployment and when a new high-cardinality
  key space is introduced. The unbounded in-process collection itself is governed by reliability.bounded-buffers;
  this rule governs the cache backend's configured bound.
rationale: 'A cache is finite memory standing in for an effectively infinite source, so
  it must have a policy for what to drop when it fills. Without a configured bound and
  eviction policy, that policy is decided by the operating system at the worst possible
  time. A time-to-live alone does not bound a cache fed by a high-cardinality key space,
  because new keys can arrive faster than old ones expire. The substrate requires an explicit
  maximum and eviction policy so the cache degrades predictably (dropping the least useful
  entries) rather than catastrophically (exhausting the host). The rule draws a clean
  boundary with reliability: the unbounded in-process dictionary is a reliability.bounded-buffers finding,
  while the cache backend''s deployment bound is owned here.'
