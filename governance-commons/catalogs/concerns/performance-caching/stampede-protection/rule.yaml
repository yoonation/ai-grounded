statement: A cache key identified as hot and expensive to recompute is protected against
  a stampede so that a simultaneous miss by many requests does not collapse identical
  recomputations onto the source of record. The mitigation (a per-key recomputation lock
  or single-flight, request coalescing, probabilistic early recomputation, or stale-while-revalidate)
  is matched to the recomputation cost and the staleness tolerance. The need is reviewed
  when a hot, expensive key is introduced or a key's traffic grows.
rationale: 'The cache absorbs load by serving a value many times for each time it is computed,
  so the dangerous moment is the instant that value is absent and every waiting request
  tries to compute it at once. Without protection, the cache turns a steady source load
  into a periodic spike synchronized to the expiry, and the spike is worst for the hottest
  keys. The substrate requires that hot expensive keys carry an explicit mitigation rather
  than relying on luck that misses will not coincide. The choice among mitigations is
  a judgment: a lock serializes recomputation, coalescing shares one result, probabilistic
  early expiry spreads recomputation before the cliff, and stale-while-revalidate trades
  brief staleness for no spike at all.'
